<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<title>Échiquier — partie à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   INTERFACE — jetons de design
   Noyer sombre + laiton + ivoire : l'ambiance d'un cabinet de jeu.
   Les couleurs d'accent et de fond suivent le thème (View.applyTheme).
   ===================================================================== */
:root {
  --ivory: #f1e6cf;
  --ivory-dim: rgba(241, 230, 207, .66);
  --ivory-soft: rgba(241, 230, 207, .08);
  --ivory-faint: rgba(241, 230, 207, .17);
  --panel: rgba(18, 13, 9, .94);
  --brass: #c9a35b;
  --brass-hi: #ecd08f;
  --bg-a: #241810;
  --bg-b: #120c08;
  --bg-glow: rgba(120, 78, 44, .32);
  --alarm: #e0574a;
  --good: #5fc36a;
  --seat-h: 68px;
  --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070504; color: var(--ivory); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- Mise en page ---------- */
#app {
  position: fixed; inset: 0; display: grid;
  grid-template: "seatb" auto "stage" minmax(0, 1fr) "seatw" auto / minmax(0, 1fr);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background:
    radial-gradient(85% 65% at 50% 50%, var(--bg-glow) 0%, transparent 72%),
    radial-gradient(140% 100% at 50% 50%, var(--bg-a) 0%, var(--bg-b) 62%, #040302 100%);
}
.seat--b { grid-area: seatb; }
.seat--w { grid-area: seatw; }
#stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; overflow: hidden; }
#coach { grid-area: coach; }
#c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: default; }
#c.is-grab { cursor: grab; }
#c.is-grabbing { cursor: grabbing; }

#app.coach-mode { grid-template: "stage coach" minmax(0, 1fr) / minmax(0, 1fr) clamp(330px, 36%, 470px); }
#app.coach-mode .seat, #app.coach-mode .history-tab, #app.coach-mode .history { display: none; }
@media (max-aspect-ratio: 1/1) {
  #app.coach-mode { grid-template: "stage" minmax(0, 44%) "coach" minmax(0, 1fr) / minmax(0, 1fr); }
}

/* ---------- Sièges des joueurs (bandeaux haut/bas) ---------- */
.seat {
  height: var(--seat-h); position: relative; min-width: 0;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  user-select: none; -webkit-user-select: none;
}
.seat--b { transform: rotate(180deg); }   /* texte orienté vers le joueur d'en face */
.seat::before {                          /* filet de laiton côté plateau : indique le trait */
  content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--brass-hi) 30%, var(--brass-hi) 70%, transparent);
  opacity: 0; transform: scaleX(.6); transition: opacity .45s ease, transform .45s ease;
}
.seat.is-turn::before { opacity: 1; transform: scaleX(1); }
.seat.is-check::before { background: linear-gradient(90deg, transparent, var(--alarm) 30%, var(--alarm) 70%, transparent); }

.seat__token {
  width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-block;
  box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.12);
}
.seat--w .seat__token, .pcard--w .seat__token { background: radial-gradient(circle at 35% 30%, #fffaf0, #d9caa8 70%); }
.seat--b .seat__token, .pcard--b .seat__token { background: radial-gradient(circle at 35% 30%, #5a4a3e, #140f0c 70%); }
.seat.is-turn .seat__token { box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), 0 0 0 2px var(--brass-hi), 0 0 14px color-mix(in srgb, var(--brass-hi) 55%, transparent); }

.seat__who { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.1; }
.seat__name { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat__status { font-size: 13px; color: var(--ivory-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat.is-turn .seat__status { color: var(--brass-hi); }
.seat.is-check .seat__status { color: var(--alarm); font-weight: 600; }
.seat__material { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--brass-hi); min-width: 2ch; text-align: right; }
.seat__actions { display: flex; gap: 8px; }

.seat__clock {
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 20px; letter-spacing: .02em;
  min-width: 76px; padding: 5px 10px; text-align: center; border-radius: 7px;
  color: var(--ivory-dim); background: rgba(0,0,0,.22); border: 1px solid var(--ivory-faint);
  transition: color .25s, border-color .25s, background .25s;
}
.seat__clock.is-running { color: #1d140c; background: var(--brass-hi); border-color: var(--brass-hi); }
.seat__clock.is-low { color: #ffb3aa; border-color: rgba(224, 87, 74, .8); }
.seat__clock.is-low.is-running { color: #fff; background: var(--alarm); border-color: var(--alarm); animation: clock-pulse 1s ease-in-out infinite; }
@keyframes clock-pulse { 50% { box-shadow: 0 0 0 4px rgba(224, 87, 74, .25); } }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 13px;
  background: rgba(241, 230, 207, .04); border: 1px solid var(--ivory-faint); border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: border-color .2s, background .2s, color .2s, transform .1s;
}
.btn:hover { border-color: color-mix(in srgb, var(--brass-hi) 60%, transparent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: default; border-color: var(--ivory-faint); transform: none; }
.btn--primary { background: var(--brass); border-color: var(--brass); color: #1d140c; font-weight: 600; }
.btn--primary:hover { background: var(--brass-hi); border-color: var(--brass-hi); }
.btn--danger { border-color: rgba(224, 87, 74, .75); color: #ffb3aa; background: rgba(224, 87, 74, .1); }
.btn--small { min-height: 32px; padding: 0 10px; font-size: 12.5px; }
.btn--wide { width: 100%; }
.btn--big { min-height: 50px; font-size: 16px; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.link { background: none; border: 0; padding: 6px; color: var(--ivory-dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--ivory); }
:is(.btn, .icon-btn, .link, .menu button, .promo button, .seg button, .swatch, .resume, .tabs button, .coach__moves button, .moments button, input):focus-visible {
  outline: 2px solid var(--brass-hi); outline-offset: 2px;
}

.icon-btn {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: none; border: 1px solid transparent; border-radius: 8px; color: var(--ivory-dim);
}
.icon-btn:hover { color: var(--ivory); border-color: var(--ivory-faint); }
.icon-btn svg { width: 20px; height: 20px; }

@media (max-width: 620px) {
  :root { --seat-h: 62px; }
  .seat { gap: 8px; padding: 0 10px; }
  .seat__name { font-size: 19px; }
  .seat__actions .btn .lbl { display: none; }
  .seat__actions .btn { padding: 0 10px; }
  .seat__clock { font-size: 17px; min-width: 64px; padding: 4px 7px; }
}
@media (max-width: 380px) {
  .seat__material { display: none; }
  .seat__actions { gap: 4px; }
}
@media (max-height: 500px) and (orientation: landscape) {   /* téléphone à l'horizontale */
  :root { --seat-h: 48px; }
  .seat__name { font-size: 17px; }
  .seat__status { font-size: 12px; margin-top: 1px; }
  .btn, .icon-btn { min-height: 32px; height: 32px; }
  .icon-btn { width: 32px; }
  .seat__clock { font-size: 16px; padding: 2px 8px; }
}

/* ---------- Feuilles (dialogues) ---------- */
.sheet-layer { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; padding: 12px; }
.sheet {
  pointer-events: auto; width: min(100%, 400px); max-height: 100%; overflow: auto; padding: 22px 24px 20px;
  background: var(--panel); border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55); text-align: center;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: sheet-in .28s cubic-bezier(.2, .8, .2, 1);
}
.sheet.is-flipped { transform: rotate(180deg); animation-name: sheet-in-flipped; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(8px) scale(.97); } }
@keyframes sheet-in-flipped { from { opacity: 0; transform: rotate(180deg) translateY(8px) scale(.97); } }
.sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 0 0 6px; line-height: 1.1; }
.sheet p { margin: 0; color: var(--ivory-dim); font-size: 14px; line-height: 1.5; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.row--tight { margin-top: 10px; }
.row--left { justify-content: flex-start; margin-top: 12px; gap: 8px; }
.sheet .mirror { transform: rotate(180deg); padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid color-mix(in srgb, var(--brass) 25%, transparent); }
.sheet .mirror h2 { font-size: 24px; margin: 0; }
.sheet--result { width: min(100%, 420px); }
.sheet--result .row .btn:not(.btn--wide) { flex: 1; }
.pgn { width: 100%; height: 180px; margin-top: 10px; resize: vertical; background: rgba(0,0,0,.3); color: var(--ivory); border: 1px solid var(--ivory-faint); border-radius: 8px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }

.promo h2 { font-size: 24px; margin-bottom: 14px; }
.promo .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo .choices button {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; cursor: pointer;
  background: var(--ivory-soft); border: 1px solid var(--ivory-faint); border-radius: 10px;
}
.promo .choices button:hover { border-color: var(--brass-hi); background: color-mix(in srgb, var(--brass-hi) 10%, transparent); }
.promo .glyph { font-size: 40px; line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols2", serif; }
.promo .name { font-size: 12px; color: var(--ivory-dim); }
.promo .link { margin-top: 12px; }

/* Options */
.sheet--options { text-align: left; width: min(100%, 440px); }
.sheet--options h2 { margin-bottom: 14px; }
.opt { margin-top: 16px; }
.opt__label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ivory-dim); margin-bottom: 8px; letter-spacing: .01em; }
.seg { display: flex; padding: 3px; gap: 3px; background: rgba(0,0,0,.28); border: 1px solid var(--ivory-faint); border-radius: 10px; }
.seg button { flex: 1; min-height: 36px; padding: 6px 10px; border: 0; border-radius: 7px; background: none; color: var(--ivory-dim); font-size: 13px; cursor: pointer; transition: background .2s, color .2s; }
.seg button:hover { color: var(--ivory); }
.seg button[aria-checked="true"] { background: var(--brass); color: #1d140c; font-weight: 600; }
.seg--wrap { flex-wrap: wrap; }
.seg--wrap button { flex: 1 1 40%; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  flex: 1 1 100px; display: flex; align-items: center; gap: 9px; padding: 8px 10px; cursor: pointer; font-size: 13px;
  background: var(--ivory-soft); border: 1px solid var(--ivory-faint); border-radius: 10px; text-align: left;
}
.swatch span { width: 26px; height: 26px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.swatch[aria-checked="true"] { border-color: var(--brass-hi); background: color-mix(in srgb, var(--brass-hi) 12%, transparent); }
.check { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-size: 13.5px; line-height: 1.4; color: var(--ivory); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--brass); flex: none; }
.sound-row { display: flex; align-items: center; gap: 10px; }
.sound-row input[type="range"] { flex: 1; accent-color: var(--brass); }

/* ---------- Menu d'un siège ---------- */
.menu {
  position: absolute; z-index: 6; min-width: 240px; max-height: calc(100% - 20px); overflow: auto; padding: 6px;
  background: var(--panel); border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5); animation: sheet-in .2s ease;
}
.menu.is-flipped { transform: rotate(180deg); animation-name: sheet-in-flipped; }
.menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: none; font-size: 14px; cursor: pointer; }
.menu button:hover { background: color-mix(in srgb, var(--brass-hi) 10%, transparent); }
.menu button[disabled] { opacity: .4; cursor: default; background: none; }
.menu hr { border: 0; border-top: 1px solid rgba(241, 230, 207, .1); margin: 4px 6px; }
.menu .hint { display: block; font-size: 12px; color: var(--ivory-dim); margin-top: 2px; }

/* ---------- Toast ---------- */
.toast {
  position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 6px); z-index: 7; pointer-events: none;
  max-width: calc(100% - 24px); padding: 9px 16px; border-radius: 999px; font-size: 13px; text-align: center;
  background: var(--panel); border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent); color: var(--ivory);
  opacity: 0; transition: opacity .3s ease, transform .3s ease;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.pill { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,.45); }

/* ---------- Historique (panneau repliable) ---------- */
.history-tab {
  position: absolute; z-index: 3; left: 0; top: 14px; width: 34px; height: 46px; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--ivory-faint); border-left: 0; border-radius: 0 10px 10px 0; color: var(--ivory-dim);
  transition: transform .3s ease, opacity .3s ease, color .2s;
}
#stage[data-layout="side"] .history-tab { top: auto; bottom: 14px; }
.history-tab:hover { color: var(--ivory); }
.history-tab svg { width: 18px; height: 18px; }
.history-tab.is-hidden { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.history {
  position: absolute; z-index: 4; left: 0; top: 0; bottom: 0; width: min(270px, 78%);
  display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid color-mix(in srgb, var(--brass) 30%, transparent);
  box-shadow: 12px 0 40px rgba(0,0,0,.4); transform: translateX(-104%); transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.history.is-open { transform: none; }
.history header { display: flex; align-items: center; gap: 2px; padding: 10px 8px 8px 16px; border-bottom: 1px solid var(--ivory-faint); }
.history h3 { flex: 1; margin: 0; font-family: var(--serif); font-weight: 600; font-size: 22px; }
.history__list { list-style: none; margin: 0; padding: 8px 10px 16px; overflow: auto; flex: 1; }
.history__list li { display: grid; grid-template-columns: 34px 1fr 1fr; align-items: center; padding: 2px 0; font-size: 14px; }
.history__list li:nth-child(odd) { background: rgba(241, 230, 207, .03); border-radius: 6px; }
.history__list .num { color: var(--ivory-dim); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-left: 6px; }
.history__list .mv { padding: 4px 6px; border-radius: 5px; }
.history__list .mv.is-current { background: color-mix(in srgb, var(--brass-hi) 18%, transparent); color: var(--brass-hi); font-weight: 600; }
.history__empty { padding: 16px; color: var(--ivory-dim); font-size: 13.5px; margin: 0; }

/* ---------- Écran d'accueil ---------- */
#welcome {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: auto; padding: 24px 16px;
  background: radial-gradient(70% 60% at 50% 45%, rgba(0,0,0,.18), rgba(0,0,0,.62)), rgba(8, 6, 4, .38);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .26s ease;
}
#welcome.is-on { opacity: 1; }
.welcome__card {
  width: min(100%, 470px); padding: 30px 28px 26px; border-radius: 18px;
  background: var(--panel); border: 1px solid color-mix(in srgb, var(--brass) 42%, transparent);
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.welcome__card h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: .01em; }
.welcome__card h1::after { content: ""; display: block; width: 56px; height: 2px; margin-top: 12px; background: var(--brass); }
.lede { margin: 14px 0 6px; color: var(--ivory-dim); font-size: 14.5px; line-height: 1.55; }
.resume {
  display: flex; flex-direction: column; gap: 3px; width: 100%; margin-top: 18px; padding: 14px 16px; text-align: left; cursor: pointer;
  background: color-mix(in srgb, var(--brass-hi) 10%, transparent); border: 1px solid var(--brass); border-radius: 12px;
}
.resume span { font-weight: 600; font-size: 15px; color: var(--brass-hi); }
.resume small { color: var(--ivory-dim); font-size: 12.5px; }
.resume:hover { background: color-mix(in srgb, var(--brass-hi) 16%, transparent); }
.or { margin: 18px 0 2px; color: var(--ivory-dim); font-size: 12.5px; display: flex; align-items: center; gap: 10px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--ivory-faint); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.names label span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ivory-dim); margin-bottom: 6px; }
.names input, .custom input {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 9px; font-size: 15px;
  background: rgba(0,0,0,.3); border: 1px solid var(--ivory-faint); color: var(--ivory);
}
.names input::placeholder { color: rgba(241, 230, 207, .35); }
.names input:focus, .custom input:focus { border-color: var(--brass); outline: none; }
.custom { display: flex; gap: 10px; margin-top: 10px; }
.custom label { flex: 1; font-size: 12.5px; color: var(--ivory-dim); }
.custom input { margin-top: 5px; }
.welcome__card .btn--big { margin-top: 22px; }
.welcome__card .opt { margin-top: 18px; }
@media (max-width: 420px) {
  .welcome__card { padding: 24px 18px 20px; }
  .welcome__card h1 { font-size: 38px; }
}

/* ---------- Coach ---------- */
#coach {
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
  background: rgba(14, 10, 7, .9); border-left: 1px solid color-mix(in srgb, var(--brass) 28%, transparent);
}
@media (max-aspect-ratio: 1/1) { #coach { border-left: 0; border-top: 1px solid color-mix(in srgb, var(--brass) 28%, transparent); } }
.coach__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; flex: none; }
.coach__head h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 28px; }
.coach__progress { padding: 18px 18px 8px; }
.coach__progress .bar { height: 6px; border-radius: 3px; background: rgba(241, 230, 207, .1); overflow: hidden; }
.coach__progress .bar span { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); transition: width .35s ease; }
.coach__progress .ptxt { margin: 10px 0 4px; font-size: 13px; color: var(--ivory-dim); }
.coach__progress .link { padding-left: 0; }
.warn { color: #ffb3aa; font-size: 14px; line-height: 1.5; margin: 0; }
.coach__body { flex: 1; min-height: 0; overflow: auto; padding: 2px 16px 18px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
.coach__graph { height: 84px; flex: none; border-radius: 9px; overflow: hidden; cursor: pointer; border: 1px solid var(--ivory-faint); }
.coach__graph svg { display: block; }
.tabs { display: flex; flex: none; border-bottom: 1px solid var(--ivory-faint); }
.tabs button { flex: 1; padding: 10px 6px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ivory-dim); font-size: 14px; font-weight: 500; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ivory); border-bottom-color: var(--brass); }
.tab { display: flex; flex-direction: column; gap: 12px; }

.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.pcard { padding: 14px; border-radius: 12px; background: var(--ivory-soft); border: 1px solid var(--ivory-faint); }
.pcard header { display: flex; align-items: center; gap: 9px; }

}

  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
  font-family: var(--serif); font-size: 22px; color: var(--ivory-dim);
}

@media (prefers-reduced-motion: reduce) {

</style>
</head>
<body>
<div id="app">
  <div class="seat seat--b" data-color="b" aria-label="Siège des Noirs"></div>
  <main id="stage">
    <canvas id="c" tabindex="0" aria-label="Échiquier en 3D"></canvas>
    <div class="boot" id="boot">Préparation de l’échiquier…</div>
  </main>
  <div class="seat seat--w" data-color="w" aria-label="Siège des Blancs"></div>
  <aside id="coach" aria-label="Analyse du coach" hidden></aside>
</div>
<div id="welcome" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   MOTEUR DE RÈGLES — représentation 0x88
   Case : sq = rang*16 + colonne (a1 = 0, h1 = 7, a8 = 112, h8 = 119)
   Pièce : type (1..6) | couleur (0 = Blancs, 8 = Noirs), 0 = case vide
   ===================================================================== */
const ChessEngine = (() => {
  'use strict';
  const PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  const WHITE = 0, BLACK = 8;
  const TYPE = 7, COLOR = 8;

  // Drapeaux de coup
  const F_CAPTURE = 1, F_DOUBLE = 2, F_EP = 4, F_KCASTLE = 8, F_QCASTLE = 16, F_PROMO = 32;

  // Droits de roque
  const WK = 1, WQ = 2, BK = 4, BQ = 8;

  const KNIGHT_D = [33, 31, 18, 14, -14, -18, -31, -33];
  const KING_D = [1, -1, 16, -16, 15, 17, -15, -17];
  const BISHOP_D = [15, 17, -15, -17];
  const ROOK_D = [1, -1, 16, -16];

  // Masque de perte des droits de roque selon la case touchée
  const CASTLE_MASK = new Array(128).fill(15);
  CASTLE_MASK[0] = 15 & ~WQ;  CASTLE_MASK[7] = 15 & ~WK;  CASTLE_MASK[4] = 15 & ~(WK | WQ);
  CASTLE_MASK[112] = 15 & ~BQ; CASTLE_MASK[119] = 15 & ~BK; CASTLE_MASK[116] = 15 & ~(BK | BQ);

  const PIECE_CHARS = ' pnbrqk';
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  const onBoard = sq => (sq & 0x88) === 0;
  const fileOf = sq => sq & 7;
  const rankOf = sq => sq >> 4;
  const sqName = sq => 'abcdefgh'[sq & 7] + ((sq >> 4) + 1);
  const nameToSq = n => (parseInt(n[1], 10) - 1) * 16 + (n.charCodeAt(0) - 97);
  const to64 = sq => (sq >> 4) * 8 + (sq & 7);
  const from64 = i => (i >> 3) * 16 + (i & 7);

  class Position {
    constructor(fen = START_FEN) { this.load(fen); }

    /* ---------- FEN ---------- */
    load(fen) {
      const parts = fen.trim().split(/\s+/);
      this.board = new Array(128).fill(0);
      this.king = [-1, -1];
      let r = 7, f = 0;
      for (const ch of parts[0]) {
        if (ch === '/') { r--; f = 0; continue; }
        if (/\d/.test(ch)) { f += +ch; continue; }
        const lower = ch.toLowerCase();
        const type = PIECE_CHARS.indexOf(lower);
        if (type <= 0) throw new Error('FEN invalide : ' + ch);
        const color = ch === lower ? BLACK : WHITE;
        const sq = r * 16 + f;
        this.board[sq] = type | color;
        if (type === KING) this.king[color >> 3] = sq;
        f++;
      }
      this.turn = (parts[1] || 'w') === 'w' ? WHITE : BLACK;
      const c = parts[2] || '-';
      this.castling = (c.includes('K') ? WK : 0) | (c.includes('Q') ? WQ : 0) |
                      (c.includes('k') ? BK : 0) | (c.includes('q') ? BQ : 0);
      this.ep = parts[3] && parts[3] !== '-' ? nameToSq(parts[3]) : -1;
      this.halfmove = parseInt(parts[4] || '0', 10);
      this.fullmove = parseInt(parts[5] || '1', 10);
      this.stack = [];
    }

    fen() {
      let s = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.board[r * 16 + f];
          if (!p) { empty++; continue; }
          if (empty) { s += empty; empty = 0; }
          const ch = PIECE_CHARS[p & TYPE];
          s += (p & COLOR) ? ch : ch.toUpperCase();
        }
        if (empty) s += empty;
        if (r) s += '/';
      }
      let c = '';
      if (this.castling & WK) c += 'K';
      if (this.castling & WQ) c += 'Q';
      if (this.castling & BK) c += 'k';
      if (this.castling & BQ) c += 'q';
      return `${s} ${this.turn ? 'b' : 'w'} ${c || '-'} ${this.ep >= 0 ? sqName(this.ep) : '-'} ${this.halfmove} ${this.fullmove}`;
    }

    /* ---------- Attaques ---------- */
    // La case sq est-elle attaquée par le camp `by` ?
    attacked(sq, by) {
      const b = this.board;
      // Pions
      if (by === WHITE) {
        if (onBoard(sq - 15) && b[sq - 15] === (PAWN | WHITE)) return true;
        if (onBoard(sq - 17) && b[sq - 17] === (PAWN | WHITE)) return true;
      } else {
        if (onBoard(sq + 15) && b[sq + 15] === (PAWN | BLACK)) return true;
        if (onBoard(sq + 17) && b[sq + 17] === (PAWN | BLACK)) return true;
      }
      for (const d of KNIGHT_D) { const t = sq + d; if (onBoard(t) && b[t] === (KNIGHT | by)) return true; }
      for (const d of KING_D) { const t = sq + d; if (onBoard(t) && b[t] === (KING | by)) return true; }
      for (const d of BISHOP_D) {
        let t = sq + d;
        while (onBoard(t)) {
          const p = b[t];
          if (p) { if ((p & COLOR) === by && ((p & TYPE) === BISHOP || (p & TYPE) === QUEEN)) return true; break; }
          t += d;
        }
      }
      for (const d of ROOK_D) {
        let t = sq + d;
        while (onBoard(t)) {
          const p = b[t];
          if (p) { if ((p & COLOR) === by && ((p & TYPE) === ROOK || (p & TYPE) === QUEEN)) return true; break; }
          t += d;
        }
      }
      return false;
    }

    inCheck(color = this.turn) { return this.attacked(this.king[color >> 3], color ^ BLACK); }

    /* ---------- Génération pseudo-légale ---------- */
    pseudoMoves() {
      const moves = [], b = this.board, us = this.turn, them = us ^ BLACK;
      const add = (from, to, flags, promo = 0) =>
        moves.push({ from, to, piece: b[from], captured: flags & F_EP ? (PAWN | them) : b[to], flags, promo });
      for (let sq = 0; sq < 128; sq++) {
        if (!onBoard(sq)) { sq += 7; continue; }
        const p = b[sq];
        if (!p || (p & COLOR) !== us) continue;
        const type = p & TYPE;
        if (type === PAWN) {
          const dir = us === WHITE ? 16 : -16;
          const startRank = us === WHITE ? 1 : 6;
          const promoRank = us === WHITE ? 7 : 0;
          const one = sq + dir;
          if (onBoard(one) && !b[one]) {
            if (rankOf(one) === promoRank) {
              for (const pr of [QUEEN, ROOK, BISHOP, KNIGHT]) add(sq, one, F_PROMO, pr | us);
            } else {
              add(sq, one, 0);
              const two = one + dir;
              if (rankOf(sq) === startRank && !b[two]) add(sq, two, F_DOUBLE);
            }
          }
          for (const cd of [dir - 1, dir + 1]) {
            const t = sq + cd;
            if (!onBoard(t)) continue;
            if (b[t] && (b[t] & COLOR) === them) {
              if (rankOf(t) === promoRank) {
                for (const pr of [QUEEN, ROOK, BISHOP, KNIGHT]) add(sq, t, F_CAPTURE | F_PROMO, pr | us);
              } else add(sq, t, F_CAPTURE);
            } else if (t === this.ep) add(sq, t, F_CAPTURE | F_EP);
          }
        } else if (type === KNIGHT || type === KING) {
          for (const d of (type === KNIGHT ? KNIGHT_D : KING_D)) {
            const t = sq + d;
            if (!onBoard(t)) continue;
            if (!b[t]) add(sq, t, 0);
            else if ((b[t] & COLOR) === them) add(sq, t, F_CAPTURE);
          }
          if (type === KING) this._castleMoves(sq, add);
        } else {
          const dirs = type === BISHOP ? BISHOP_D : type === ROOK ? ROOK_D : KING_D;
          for (const d of dirs) {
            let t = sq + d;
            while (onBoard(t)) {
              if (!b[t]) add(sq, t, 0);
              else { if ((b[t] & COLOR) === them) add(sq, t, F_CAPTURE); break; }
              t += d;
            }
          }
        }
      }
      return moves;
    }

    _castleMoves(sq, add) {
      const us = this.turn, them = us ^ BLACK, b = this.board;
      const home = us === WHITE ? 4 : 116;
      if (sq !== home) return;
      const kFlag = us === WHITE ? WK : BK, qFlag = us === WHITE ? WQ : BQ;
      if (!(this.castling & (kFlag | qFlag))) return;
      if (this.attacked(home, them)) return; // pas de roque en échec
      if ((this.castling & kFlag) && !b[home + 1] && !b[home + 2] && b[home + 3] === (ROOK | us) &&
          !this.attacked(home + 1, them) && !this.attacked(home + 2, them)) add(home, home + 2, F_KCASTLE);
      if ((this.castling & qFlag) && !b[home - 1] && !b[home - 2] && !b[home - 3] && b[home - 4] === (ROOK | us) &&
          !this.attacked(home - 1, them) && !this.attacked(home - 2, them)) add(home, home - 2, F_QCASTLE);
    }

    /* ---------- Jouer / annuler ---------- */
    make(m) {
      const b = this.board, us = this.turn;
      this.stack.push({ m, castling: this.castling, ep: this.ep, halfmove: this.halfmove, fullmove: this.fullmove });
      b[m.to] = m.promo || m.piece;
      b[m.from] = 0;
      if (m.flags & F_EP) b[m.to + (us === WHITE ? -16 : 16)] = 0;
      if (m.flags & F_KCASTLE) { b[m.to - 1] = b[m.to + 1]; b[m.to + 1] = 0; }
      if (m.flags & F_QCASTLE) { b[m.to + 1] = b[m.to - 2]; b[m.to - 2] = 0; }
      if ((m.piece & TYPE) === KING) this.king[us >> 3] = m.to;
      this.castling &= CASTLE_MASK[m.from] & CASTLE_MASK[m.to];
      this.ep = m.flags & F_DOUBLE ? (m.from + m.to) >> 1 : -1;
      this.halfmove = ((m.piece & TYPE) === PAWN || (m.flags & F_CAPTURE)) ? 0 : this.halfmove + 1;
      if (us === BLACK) this.fullmove++;
      this.turn = us ^ BLACK;
    }

    unmake() {
      const st = this.stack.pop();
      if (!st) return null;
      const m = st.m, b = this.board;
      this.turn ^= BLACK;
      const us = this.turn;
      b[m.from] = m.piece;
      b[m.to] = (m.flags & F_EP) ? 0 : (m.flags & F_CAPTURE ? m.captured : 0);
      if (m.flags & F_EP) b[m.to + (us === WHITE ? -16 : 16)] = m.captured;
      if (m.flags & F_KCASTLE) { b[m.to + 1] = b[m.to - 1]; b[m.to - 1] = 0; }
      if (m.flags & F_QCASTLE) { b[m.to - 2] = b[m.to + 1]; b[m.to + 1] = 0; }
      if ((m.piece & TYPE) === KING) this.king[us >> 3] = m.from;
      this.castling = st.castling; this.ep = st.ep; this.halfmove = st.halfmove; this.fullmove = st.fullmove;
      return m;
    }

    legalMoves() {
      const out = [], us = this.turn;
      for (const m of this.pseudoMoves()) {
        this.make(m);
        if (!this.attacked(this.king[us >> 3], us ^ BLACK)) out.push(m);
        this.unmake();
      }
      return out;
    }

    /* ---------- Perft ---------- */
    perft(depth) {
      if (depth === 0) return 1;
      const us = this.turn;
      let n = 0;
      for (const m of this.pseudoMoves()) {
        this.make(m);
        if (!this.attacked(this.king[us >> 3], us ^ BLACK)) n += depth === 1 ? 1 : this.perft(depth - 1);
        this.unmake();
      }
      return n;
    }

    /* ---------- Matériel insuffisant ---------- */
    insufficientMaterial() {
      let minors = 0, knights = 0;
      const bishopColors = new Set();
      for (let sq = 0; sq < 128; sq++) {
        if (!onBoard(sq)) { sq += 7; continue; }
        const p = this.board[sq];
        if (!p) continue;
        const t = p & TYPE;
        if (t === PAWN || t === ROOK || t === QUEEN) return false;
        if (t === KNIGHT) { minors++; knights++; }
        if (t === BISHOP) { minors++; bishopColors.add((fileOf(sq) + rankOf(sq)) & 1); }
      }
      if (minors <= 1) return true;                         // K vs K, K+C vs K, K+F vs K
      if (knights === 0 && bishopColors.size === 1) return true; // fous tous de la même couleur
      return false;
    }

    /* Clé de répétition : placement + trait + roques + prise en passant réellement possible */
    repetitionKey() {
      const f = this.fen().split(' ');
      let ep = '-';
      if (this.ep >= 0 && this.legalMoves().some(m => m.flags & F_EP)) ep = f[3];
      return `${f[0]} ${f[1]} ${f[2]} ${ep}`;
    }
  }

  /* =====================================================================
     PARTIE — surcouche jouable : SAN, historique, fin de partie
     ===================================================================== */
  const SAN_LETTER = { [KNIGHT]: 'N', [BISHOP]: 'B', [ROOK]: 'R', [QUEEN]: 'Q', [KING]: 'K' };

  class Game {
    constructor(fen = START_FEN) { this.reset(fen); }

    reset(fen = START_FEN) {
      this.pos = new Position(fen);
      this.startFen = fen;
      this.history = [];              // { move, san, key }
      this.keys = [this.pos.repetitionKey()];
      this.result = null;             // { winner: 'w'|'b'|null, reason }
      this._legal = null;
    }

    get turn() { return this.pos.turn === WHITE ? 'w' : 'b'; }
    legalMoves() { return this._legal || (this._legal = this.pos.legalMoves()); }
    movesFrom(sq) { return this.legalMoves().filter(m => m.from === sq); }
    pieceAt(sq) { return this.pos.board[sq]; }
    inCheck() { return this.pos.inCheck(); }

    san(m) {
      const pos = this.pos;
      let s;
      if (m.flags & F_KCASTLE) s = 'O-O';
      else if (m.flags & F_QCASTLE) s = 'O-O-O';
      else {
        const type = m.piece & TYPE;
        const cap = m.flags & F_CAPTURE;
        if (type === PAWN) {
          s = (cap ? 'abcdefgh'[fileOf(m.from)] + 'x' : '') + sqName(m.to);
          if (m.promo) s += '=' + SAN_LETTER[m.promo & TYPE];
        } else {
          s = SAN_LETTER[type];
          const rivals = this.legalMoves().filter(o => o.to === m.to && o.from !== m.from && o.piece === m.piece);
          if (rivals.length) {
            const sameFile = rivals.some(o => fileOf(o.from) === fileOf(m.from));
            const sameRank = rivals.some(o => rankOf(o.from) === rankOf(m.from));
            if (!sameFile) s += 'abcdefgh'[fileOf(m.from)];
            else if (!sameRank) s += rankOf(m.from) + 1;
            else s += sqName(m.from);
          }
          s += (cap ? 'x' : '') + sqName(m.to);
        }
      }
      pos.make(m);
      if (pos.inCheck()) s += pos.legalMoves().length ? '+' : '#';
      pos.unmake();
      return s;
    }

    // Joue un coup légal (objet issu de legalMoves). Retourne l'entrée d'historique.
    play(m) {
      if (this.result) return null;
      const legal = this.legalMoves().find(o => o.from === m.from && o.to === m.to && (o.promo || 0) === (m.promo || 0));
      if (!legal) return null;
      const san = this.san(legal);
      this.pos.make(legal);
      this._legal = null;
      const key = this.pos.repetitionKey();
      this.keys.push(key);
      const entry = { move: legal, san };
      this.history.push(entry);
      this.result = this._computeResult();
      return entry;
    }

    undo() {
      if (!this.history.length) return null;
      const e = this.history.pop();
      this.pos.unmake();
      this.keys.pop();
      this._legal = null;
      this.result = null;
      return e;
    }

    _computeResult() {
      const moves = this.legalMoves();
      if (!moves.length) {
        if (this.pos.inCheck()) return { winner: this.turn === 'w' ? 'b' : 'w', reason: 'mat' };
        return { winner: null, reason: 'pat' };
      }
      if (this.pos.insufficientMaterial()) return { winner: null, reason: 'materiel' };
      if (this.pos.halfmove >= 100) return { winner: null, reason: '50coups' };
      const k = this.keys[this.keys.length - 1];
      if (this.keys.filter(x => x === k).length >= 3) return { winner: null, reason: 'repetition' };
      return null;
    }

    resign(color) { if (!this.result) this.result = { winner: color === 'w' ? 'b' : 'w', reason: 'abandon' }; }
    agreeDraw() { if (!this.result) this.result = { winner: null, reason: 'accord' }; }

    // Écart de matériel (Blancs − Noirs) en points classiques
    materialBalance() {
      const val = [0, 1, 3, 3, 5, 9, 0];
      let d = 0;
      for (let sq = 0; sq < 128; sq++) {
        if (!onBoard(sq)) { sq += 7; continue; }
        const p = this.pos.board[sq];
        if (p) d += (p & COLOR ? -1 : 1) * val[p & TYPE];
      }
      return d;
    }

    pgn(white = 'Blancs', black = 'Noirs') {
      const d = new Date();
