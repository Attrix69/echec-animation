    ctx.strokeStyle = F.line; ctx.globalAlpha = .75; ctx.lineWidth = u * .016;
    const f1 = 4.84 * u;
    ctx.strokeRect(C - f1, C - f1, f1 * 2, f1 * 2);
    ctx.globalAlpha = 1;
    const fontSize = u * .36, d = 4.53 * u;
    const draw = (g2, txt, x, y, rot, glow) => {
      g2.save();
      g2.translate(x, y); g2.rotate(rot);
      g2.font = `700 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
      g2.textAlign = 'center'; g2.textBaseline = 'middle';
      if (glow) { g2.shadowColor = F.neon; g2.shadowBlur = u * .12; g2.fillStyle = F.neon; g2.fillText(txt, 0, 0); }
      else {
        g2.fillStyle = 'rgba(0,0,0,.7)'; g2.fillText(txt, -1.2, -1.6);          // gravure
        g2.fillStyle = 'rgba(255,236,190,.2)'; g2.fillText(txt, 1, 1.4);
        g2.fillStyle = F.text; g2.fillText(txt, 0, 0);
      }
      g2.restore();
    };
    let emissive = null, eg = null;
    if (F.neon) {
      emissive = this.canvas(size); eg = emissive.getContext('2d');
      eg.fillStyle = '#000'; eg.fillRect(0, 0, size, size);
      eg.strokeStyle = F.neon; eg.shadowColor = F.neon; eg.shadowBlur = u * .1; eg.globalAlpha = .7; eg.lineWidth = u * .014;
      eg.strokeRect(C - f1, C - f1, f1 * 2, f1 * 2);
      eg.globalAlpha = .55;
    }
    // Coordonnées : bas/gauche orientées vers les Blancs, haut/droite vers les Noirs
    for (let k = 0; k < 8; k++) {
      const L = 'abcdefgh'[k], N = String(k + 1);
      const spots = [[L, C + (k - 3.5) * u, C + d, 0], [L, C + (k - 3.5) * u, C - d, Math.PI], [N, C - d, C - (k - 3.5) * u, 0], [N, C + d, C - (k - 3.5) * u, Math.PI]];
      for (const [t, x, y, r] of spots) { draw(ctx, t, x, y, r, false); if (eg) draw(eg, t, x, y, r, true); }
    }
    return { map: c, emissive };
  },

  edge(th) {
    const c = this.canvas(1024, 96), ctx = c.getContext('2d');
    const F = th.frame;
    if (F.kind === 'wood') this.wood(ctx, 0, 0, 1024, 96, F.wood, 75, false);
    else if (F.kind === 'marble') this.marble(ctx, 0, 0, 1024, 96, F.marble, 76);
    else { ctx.fillStyle = F.base; ctx.fillRect(0, 0, 1024, 96); }
    return c;
  },

  felt(color, W = 512, H = 256) {
    const c = this.canvas(W, H), ctx = c.getContext('2d'), R = rng(9);
    const r = 30;
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.clearRect(0, 0, W, H);
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.arcTo(W, 0, W, H, r); ctx.arcTo(W, H, 0, H, r); ctx.arcTo(0, H, 0, 0, r); ctx.arcTo(0, 0, W, 0, r); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.save(); ctx.clip();
    for (let i = 0; i < 9000; i++) { ctx.fillStyle = `rgba(255,255,255,${(R() * .035).toFixed(3)})`; ctx.fillRect(R() * W, R() * H, 1.4, 1.4); }
    ctx.lineWidth = 18; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 20; ctx.stroke();
    ctx.restore();
    // liseré clair : le bac se lit comme un plateau feutré, pas comme un trou
    const i = 5, ri = r - i;
    ctx.beginPath();
    ctx.moveTo(i + ri, i); ctx.arcTo(W - i, i, W - i, H - i, ri); ctx.arcTo(W - i, H - i, i, H - i, ri); ctx.arcTo(i, H - i, i, i, ri); ctx.arcTo(i, i, W - i, i, ri); ctx.closePath();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,236,200,.16)'; ctx.stroke();
    return c;
  },

  radial(stops, size = 256) {
    const c = this.canvas(size), ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [o, col] of stops) g.addColorStop(o, col);
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  },
};

/* ---------------------------------------------------------------
   Géométries Staunton (partagées par toutes les pièces du même type)
   --------------------------------------------------------------- */
const PieceGeo = (() => {
  // Lissage de Chaikin, coins vifs conservés
  function chaikin(pts, iters, sharp) {
    let P = pts.map((p, i) => ({ x: p[0], y: p[1], s: i === 0 || i === pts.length - 1 || sharp.has(i) }));
    for (let k = 0; k < iters; k++) {
      const out = [P[0]];
      for (let i = 0; i < P.length - 1; i++) {
        const a = P[i], b = P[i + 1];
        if (i > 0 && a.s) out.push(a);
        out.push({ x: .75 * a.x + .25 * b.x, y: .75 * a.y + .25 * b.y, s: false });
        out.push({ x: .25 * a.x + .75 * b.x, y: .25 * a.y + .75 * b.y, s: false });
      }
      out.push(P[P.length - 1]);
      P = out;
    }
    return P.map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
  }
  const lathe = (pts, sharp = []) => new THREE.LatheGeometry(chaikin(pts, 2, new Set(sharp)), 44);
  const base = R => [[0, 0], [R, 0], [R * 1.02, .035], [R * .97, .075], [R * .84, .1], [R * .8, .12], [R * .83, .145], [R * .74, .175]];
  function ball(cy, r, fromX) {
    const a0 = -Math.acos(clamp(fromX / r, 0, 1)), pts = [];
    for (let i = 0; i <= 10; i++) { const a = lerp(a0, Math.PI / 2, i / 10); pts.push([r * Math.cos(a), cy + r * Math.sin(a)]); }
    pts[pts.length - 1] = [0, cy + r];
    return pts;
  }

  function build() {
    const G = {};
    G[E.PAWN] = [{ g: lathe([...base(.27), [.14, .23], [.1, .28], [.085, .315], [.155, .33], [.16, .345], [.1, .36], [.065, .372], ...ball(.445, .1, .065)], [1]) }];

    const rook = [{ g: lathe([...base(.32), [.215, .24], [.2, .33], [.205, .4], [.25, .42], [.26, .44], [.23, .455], [.245, .47], [.265, .49], [.265, .535], [.19, .535], [.185, .515], [0, .515]], [1, 15, 16, 17, 18]) }];
    for (let k = 0; k < 6; k++) {
      const span = Math.PI / 3, a0 = k * span + span * .2, a1 = a0 + span * .6;
      const s = new THREE.Shape();
      s.absarc(0, 0, .262, a0, a1, false);
      s.absarc(0, 0, .19, a1, a0, true);
      s.closePath();
      const g = new THREE.ExtrudeGeometry(s, { depth: .07, bevelEnabled: true, bevelThickness: .008, bevelSize: .006, bevelSegments: 2, curveSegments: 6 });
      g.rotateX(-Math.PI / 2); g.translate(0, .535, 0);
      rook.push({ g });
    }
    G[E.ROOK] = rook;

    const slit = new THREE.BoxGeometry(.018, .12, .29);
    slit.rotateZ(.6); slit.translate(.02, .6, 0);
    G[E.BISHOP] = [
      { g: lathe([...base(.3), [.15, .23], [.115, .32], [.095, .41], [.16, .43], [.165, .45], [.105, .465], [.1, .48], [.14, .52], [.155, .58], [.14, .64], [.1, .69], [.05, .725], [.03, .742], ...ball(.772, .034, .03)], [1]) },
      { g: slit, slit: true },
    ];

    const queen = [{ g: lathe([...base(.34), [.175, .24], [.125, .38], [.1, .5], [.17, .52], [.175, .54], [.115, .56], [.105, .58], [.15, .66], [.2, .74], [.215, .765], [.18, .776], [.13, .79], [.085, .815], [.06, .833], [.035, .848], ...ball(.878, .045, .035)], [1]) }];
    const pearl = new THREE.SphereGeometry(.03, 14, 10);
    for (let k = 0; k < 9; k++) {
      const a = k / 9 * Math.PI * 2, g = pearl.clone();
      g.translate(Math.cos(a) * .198, .792, Math.sin(a) * .198);
      queen.push({ g });
    }
    G[E.QUEEN] = queen;

    // Roi : double croix, lisible en vue plongeante (un « + » vu d'en haut)
    const cs = new THREE.Shape(), w = .034, h = .2, aw = .088, ah = .033, ay = .125;
    cs.moveTo(-w, 0); cs.lineTo(w, 0); cs.lineTo(w, ay - ah); cs.lineTo(aw, ay - ah); cs.lineTo(aw, ay + ah); cs.lineTo(w, ay + ah);
    cs.lineTo(w, h); cs.lineTo(-w, h); cs.lineTo(-w, ay + ah); cs.lineTo(-aw, ay + ah); cs.lineTo(-aw, ay - ah); cs.lineTo(-w, ay - ah); cs.closePath();
    const cross = new THREE.ExtrudeGeometry(cs, { depth: .046, bevelEnabled: true, bevelThickness: .012, bevelSize: .009, bevelSegments: 2 });
    cross.translate(0, .885, -.023);
    const cross2 = cross.clone(); cross2.rotateY(Math.PI / 2);
    G[E.KING] = [
      { g: lathe([...base(.35), [.18, .24], [.13, .4], [.11, .54], [.18, .56], [.185, .58], [.125, .6], [.115, .62], [.16, .7], [.2, .78], [.212, .8], [.176, .816], [.12, .85], [.07, .874], [.03, .888], [0, .893]], [1]) },
      { g: cross }, { g: cross2 },
    ];

    // Cavalier : socle tourné + tête extrudée (profil) + crinière
    const ks = new THREE.Shape();
    ks.moveTo(-.2, 0);
    ks.lineTo(.2, 0);
    ks.quadraticCurveTo(.2, .14, .1, .24);
    ks.quadraticCurveTo(.14, .32, .27, .355);
    ks.quadraticCurveTo(.325, .385, .295, .445);
    ks.quadraticCurveTo(.21, .53, .105, .585);
    ks.lineTo(.085, .69);
    ks.lineTo(.02, .605);
    ks.quadraticCurveTo(-.15, .59, -.21, .42);
    ks.quadraticCurveTo(-.27, .2, -.2, 0);
    const head = new THREE.ExtrudeGeometry(ks, { depth: .18, bevelEnabled: true, bevelThickness: .045, bevelSize: .03, bevelSegments: 3, curveSegments: 14 });
    head.translate(0, 0, -.09); head.scale(.88, .88, .88); head.translate(.01, .205, 0);
    const mane = new THREE.BoxGeometry(.035, .3, .03);
    mane.rotateZ(.35); mane.translate(-.17, .5, 0);
    G[E.KNIGHT] = [
      { g: lathe([...base(.33), [.255, .2], [.255, .225], [0, .225]], [1, 9]) },
      { g: head },
      { g: mane, slit: true },
    ];
    return G;
  }
  const HEIGHT = { 1: .55, 2: .8, 3: .81, 4: .61, 5: .92, 6: 1.09 };
  const RADIUS = { 1: .27, 2: .33, 3: .3, 4: .32, 5: .34, 6: .35 };
  return { build, HEIGHT, RADIUS };
})();

/* =====================================================================
   VIEW — rendu 3D (Three.js r128)
   ===================================================================== */
const sqToWorld = sq => ({ x: E.fileOf(sq) - 3.5, z: 3.5 - E.rankOf(sq) });
const TABLE_Y = -.37;          // niveau de la table (bacs des pièces prises)

const View = {
  pieces: new Map(),            // case 0x88 -> racine 3D de la pièce
  trays: { w: [], b: [] },      // pièces prises PAR chaque camp
  dirty: true,
  lowGfx: false,
  warmup: 2500,
  tilt: 20,
  fov: 38,
  shake: { amp: 0, t: 0 },

  init() {
    this.stage = $('#stage');
    const canvas = $('#c');
    const r = this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.localClippingEnabled = true;          // découpe des pièces tranchées par le fou
    r.setClearColor(0x000000, 0);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(this.fov, 1, .5, 150);
    this.camBase = new THREE.Vector3();
    this.geo = PieceGeo.build();
    this.mat = {
      w: new THREE.MeshPhysicalMaterial({ metalness: 0 }),
      b: new THREE.MeshPhysicalMaterial({ metalness: 0 }),
      wSlit: new THREE.MeshStandardMaterial({ roughness: .7 }),
      bSlit: new THREE.MeshStandardMaterial({ roughness: .7 }),
    };
    this.buildLights();
    this.pieceGroup = new THREE.Group();
    this.scene.add(this.pieceGroup);
    this.buildOverlays();
    this.buildTrays();
    this.applyTheme(Settings.theme);
    Fx.init(this.scene);

    this.raycaster = new THREE.Raycaster();
    this.ndc = new THREE.Vector2();
    new ResizeObserver(() => this.resize()).observe(this.stage);
    this.resize();
    this.last = performance.now();
    requestAnimationFrame(t => this.loop(t));
  },

  /* ---------- Thème ---------- */
  applyTheme(name) {
    const th = this.theme = THEMES[name] || THEMES.bois;
    const L = th.light;
    this.renderer.toneMappingExposure = L.exposure;
    this.hemi.color.setHex(L.hemiSky); this.hemi.groundColor.setHex(L.hemiGround); this.hemi.intensity = L.hemiI;
    this.keyLight.color.setHex(L.key); this.keyLight.intensity = L.keyI;
    this.rimLight.color.setHex(L.rim); this.rimLight.intensity = L.rimI;
    this.fillLight.intensity = L.fillI;
    this.buildEnvironment(L.env);
    for (const c of ['w', 'b']) {
      const P = th.pieces[c], m = this.mat[c];
      m.color.setHex(P.color); m.roughness = P.rough; m.clearcoat = P.cc; m.clearcoatRoughness = c === 'b' ? .07 : .14;
      m.needsUpdate = true;
      this.mat[c + 'Slit'].color.setHex(th.pieces[c + 'Slit']);
    }
    this.buildBoard();
    this.selMesh.material.color.setHex(th.hi.sel);
    this.hoverMesh.material.color.setHex(th.hi.sel);
    this.lastMeshes.forEach(m => m.material.color.setHex(th.hi.last));
    this.dotMat.color.setHex(th.hi.dot); this.dotMat.opacity = th.hi.dotOp;
    this.ringMat.color.setHex(th.hi.dot); this.ringMat.opacity = th.hi.dotOp + .06;
    if (this.feltTex) { this.feltTex.side.dispose(); this.feltTex.front.dispose(); }
    const felt = (w, h) => { const t = new THREE.CanvasTexture(Tex.felt(th.felt, w, h)); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; };
    this.feltTex = { side: felt(156, 532), front: felt(532, 156) };
    this.trayMat.map = this.feltTex[this.trayLayout] || this.feltTex.side;
    this.trayMat.needsUpdate = true;
    const root = document.documentElement.style;
    root.setProperty('--brass', th.css.accent);
    root.setProperty('--brass-hi', th.css.accentHi);
    root.setProperty('--bg-a', th.css.bgA);
    root.setProperty('--bg-b', th.css.bgB);
    root.setProperty('--bg-glow', th.css.glow);
    this.wake();
  },

  // Carte d'environnement : studio sombre + boîtes à lumière (reflets laqués)
  buildEnvironment(envColor) {
    const env = new THREE.Scene();
    const sphere = new THREE.SphereGeometry(30, 32, 16);
    const pos = sphere.attributes.position, colors = [];
    const top = new THREE.Color(0x221a14), bottom = new THREE.Color(0x060403), tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const t = clamp((pos.getY(i) / 30 + 1) / 2, 0, 1);
      tmp.copy(bottom).lerp(top, Math.pow(t, 1.6));
      colors.push(tmp.r, tmp.g, tmp.b);
    }
    sphere.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    env.add(new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
    const box = (w, h, color, x, y, z) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    };
    const [r, g, b] = envColor;
    box(12, 7, new THREE.Color(r, g, b), -12, 13, 9);
    box(3, 16, new THREE.Color(r * .55, g * .65, b * .85), 15, 7, -11);
    box(10, 3, new THREE.Color(r * .3, g * .28, b * .25), 0, 5, 21);
    const pm = new THREE.PMREMGenerator(this.renderer);
    if (this.scene.environment) this.scene.environment.dispose();
    this.scene.environment = pm.fromScene(env, .035).texture;
    pm.dispose();
    env.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  },

  buildLights() {
    const s = this.scene;
    this.hemi = new THREE.HemisphereLight(0xffffff, 0x000000, .2);
    s.add(this.hemi);
    const key = this.keyLight = new THREE.DirectionalLight(0xffffff, 1);
    key.position.set(-4.5, 13, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    const sc = key.shadow.camera;
    sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 2; sc.far = 32;
    key.shadow.bias = -.0004;
    key.shadow.normalBias = .02;
    s.add(key);
    this.rimLight = new THREE.DirectionalLight(0xffffff, .5);
    this.rimLight.position.set(6, 5, -9);
    s.add(this.rimLight);
    this.fillLight = new THREE.DirectionalLight(0xffe2c0, .15);
    this.fillLight.position.set(3, 4, 10);
    s.add(this.fillLight);
  },

  buildBoard() {
    const th = this.theme, maxAniso = this.renderer.capabilities.getMaxAnisotropy();
    const mobile = Math.min(screen.width, screen.height) < 700;
    if (this.boardGroup) {
      this.scene.remove(this.boardGroup);
      this.boardGroup.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach(m => {
          ['map', 'emissiveMap'].forEach(k => m[k] && m[k].dispose()); m.dispose();
        });
      });
    }
    const g = this.boardGroup = new THREE.Group();
    this.scene.add(g);
    const tex = (canvas, repeat) => {
      const t = new THREE.CanvasTexture(canvas);
      t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
      if (repeat) { t.repeat.set(1 / 9.9, 1 / 9.9); t.offset.set(.5, .5); }
      return t;
    };
    const B = th.board, F = th.frame;
    const top = Tex.boardTop(th, mobile ? 128 : 176);
    const topMat = new THREE.MeshPhysicalMaterial({ map: tex(top.map), roughness: B.rough, clearcoat: B.clearcoat, clearcoatRoughness: .16 });
    if (top.emissive) { topMat.emissiveMap = tex(top.emissive); topMat.emissive.setHex(0xffffff); topMat.emissiveIntensity = .9; }
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x151008, roughness: .6 });
    const play = new THREE.Mesh(new THREE.BoxGeometry(8.2, .3, 8.2), [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
    play.position.y = -.15;
    play.receiveShadow = true;
    g.add(play);

    const shape = new THREE.Shape(), o = 4.95, i = 4.1;
    shape.moveTo(-o, -o); shape.lineTo(o, -o); shape.lineTo(o, o); shape.lineTo(-o, o); shape.closePath();
    const hole = new THREE.Path();
    hole.moveTo(-i, -i); hole.lineTo(-i, i); hole.lineTo(i, i); hole.lineTo(i, -i); hole.closePath();
    shape.holes.push(hole);
    const fg = new THREE.ExtrudeGeometry(shape, { depth: .34, bevelEnabled: true, bevelThickness: .04, bevelSize: .04, bevelSegments: 4, curveSegments: 4 });
    fg.rotateX(-Math.PI / 2);
    const fr = Tex.frame(th, mobile ? 1024 : 1536);
    const frameMat = new THREE.MeshPhysicalMaterial({ map: tex(fr.map, true), roughness: F.rough, clearcoat: F.clearcoat, clearcoatRoughness: .14 });
    if (fr.emissive) { frameMat.emissiveMap = tex(fr.emissive, true); frameMat.emissive.setHex(0xffffff); frameMat.emissiveIntensity = 1; }
    const edgeTex = new THREE.CanvasTexture(Tex.edge(th));
    edgeTex.encoding = THREE.sRGBEncoding;
    edgeTex.wrapS = edgeTex.wrapT = THREE.RepeatWrapping;
    edgeTex.repeat.set(.1, 2.2);
    const edgeMat = new THREE.MeshPhysicalMaterial({ map: edgeTex, roughness: F.rough, clearcoat: F.clearcoat * .8, clearcoatRoughness: .2 });
    const frame = new THREE.Mesh(fg, [frameMat, edgeMat]);
    frame.position.y = -.33;
    frame.receiveShadow = true; frame.castShadow = true;
    g.add(frame);

    const blob = new THREE.Mesh(new THREE.PlaneGeometry(17, 17).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ map: Tex.radial([[0, 'rgba(0,0,0,.72)'], [.52, 'rgba(0,0,0,.42)'], [1, 'rgba(0,0,0,0)']]), transparent: true, depthWrite: false }));
    blob.position.y = TABLE_Y - .012;
    g.add(blob);

    // La police des coordonnées peut arriver après le premier dessin : on regrave
    if (document.fonts && !this._fontHook) {
      this._fontHook = true;
      document.fonts.load('700 40px "Cormorant Garamond"').then(() => this.buildBoard()).catch(() => {});
    }
    this.wake();
  },

  /* ---------- Surbrillances & flèches ---------- */
  buildOverlays() {
    const ov = this.ov = new THREE.Group();
    ov.position.y = .004;
    this.scene.add(ov);
    const basic = (color, opacity, extra = {}) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, toneMapped: false, ...extra });
    const plane = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    const mk = (geo, mat, order = 1) => { const m = new THREE.Mesh(geo, mat); m.visible = false; m.renderOrder = order; ov.add(m); return m; };
    this.selMesh = mk(plane, basic(0xffffff, .52));
    this.hoverMesh = mk(plane, basic(0xffffff, .2));
    this.lastMeshes = [mk(plane, basic(0xffffff, .24)), mk(plane, basic(0xffffff, .34))];
    this.dotGeo = new THREE.CircleGeometry(.13, 40).rotateX(-Math.PI / 2);
    this.ringGeo = new THREE.RingGeometry(.4, .47, 56).rotateX(-Math.PI / 2);
    this.dotMat = basic(0x000000, .36);
    this.ringMat = basic(0x000000, .42);
    this.dots = []; this.rings = []; this.arrows = [];
    const checkTex = Tex.radial([[0, 'rgba(255,70,50,1)'], [.45, 'rgba(230,40,30,.75)'], [1, 'rgba(200,20,10,0)']]);
    this.checkMesh = mk(new THREE.PlaneGeometry(1.3, 1.3).rotateX(-Math.PI / 2), basic(0xffffff, .8, { map: checkTex, blending: THREE.AdditiveBlending }), 0);
  },

  placeOverlay(mesh, sq) { const p = sqToWorld(sq); mesh.position.set(p.x, 0, p.z); mesh.visible = true; },

  setHighlights({ selected = -1, targets = [], last = null, check = -1 }) {
    if (selected >= 0) this.placeOverlay(this.selMesh, selected); else this.selMesh.visible = false;
    if (last) { this.placeOverlay(this.lastMeshes[0], last.from); this.placeOverlay(this.lastMeshes[1], last.to); }
    else this.lastMeshes.forEach(m => (m.visible = false));
    let d = 0, r = 0;
    for (const t of targets) {
      const pool = t.capture ? this.rings : this.dots;
      const i = t.capture ? r++ : d++;
      if (!pool[i]) { const m = new THREE.Mesh(t.capture ? this.ringGeo : this.dotGeo, t.capture ? this.ringMat : this.dotMat); m.renderOrder = 1; this.ov.add(m); pool.push(m); }
      this.placeOverlay(pool[i], t.sq);
    }
    for (; d < this.dots.length; d++) this.dots[d].visible = false;
    for (; r < this.rings.length; r++) this.rings[r].visible = false;
    if (check >= 0) { this.placeOverlay(this.checkMesh, check); this.checkMesh.position.y = -.001; }
    else this.checkMesh.visible = false;
    this.wake();
  },
  setHover(sq) { if (sq >= 0) this.placeOverlay(this.hoverMesh, sq); else this.hoverMesh.visible = false; this.wake(); },

  // Flèches plates au-dessus des pièces : [{ from, to, color }]
  setArrows(list) {
    for (const a of this.arrows) { this.ov.remove(a); a.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
    this.arrows = [];
    for (const a of list) {
      const f = sqToWorld(a.from), t = sqToWorld(a.to);
      const dx = t.x - f.x, dz = t.z - f.z;
      const pts = [[f.x, f.z]];
      if (Math.abs(dx) + Math.abs(dz) === 3 && Math.abs(dx) && Math.abs(dz)) {         // cavalier : flèche en L
        pts.push(Math.abs(dx) > Math.abs(dz) ? [t.x, f.z] : [f.x, t.z]);
      }
      pts.push([t.x, t.z]);
      const grp = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({ color: a.color, transparent: true, opacity: a.opacity || .82, depthTest: false, depthWrite: false, toneMapped: false });
      const W = .075;
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
        const last = i === pts.length - 2;
        let len = Math.hypot(x1 - x0, z1 - z0);
        const start = i === 0 ? .2 : -W;
        const s = new THREE.Shape();
        if (last) {
          len -= .12;
          const hl = .34, hw = .24;
          s.moveTo(start, -W); s.lineTo(len - hl, -W); s.lineTo(len - hl, -hw); s.lineTo(len, 0);
          s.lineTo(len - hl, hw); s.lineTo(len - hl, W); s.lineTo(start, W); s.closePath();
        } else {
          s.moveTo(start, -W); s.lineTo(len + W, -W); s.lineTo(len + W, W); s.lineTo(start, W); s.closePath();
        }
        const geo = new THREE.ShapeGeometry(s).rotateX(-Math.PI / 2);
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x0, .06, z0);
        m.rotation.y = Math.atan2(-(z1 - z0), x1 - x0);
        m.renderOrder = 20;
        grp.add(m);
      }
      this.ov.add(grp);
      this.arrows.push(grp);
    }
    this.wake();
  },

  /* ---------- Pièces ---------- */
  facing(c) { return c === 'b' && Settings.flipBlack ? 0 : Math.PI; },
  makePiece(p) {
    const type = p & E.TYPE, c = colorOf(p);
    const root = new THREE.Group(), tilt = new THREE.Group(), body = new THREE.Group();
    root.add(tilt); tilt.add(body);
    for (const part of this.geo[type]) {
      const m = new THREE.Mesh(part.g, part.slit ? this.mat[c + 'Slit'] : this.mat[c]);
      m.castShadow = true; m.receiveShadow = !part.slit;
      body.add(m);
    }
    body.rotation.y = this.facing(c);
    root.tilt = tilt; root.body = body;
    root.userData = { piece: p, sq: -1 };
    return root;
  },
  refreshFacing() {
    const all = [...this.pieces.values(), ...this.trays.w, ...this.trays.b];
    for (const m of all) m.body.rotation.y = this.facing(colorOf(m.userData.piece));
    this.wake();
  },
  resetPose(mesh) {
    mesh.tilt.rotation.set(0, 0, 0); mesh.tilt.quaternion.identity(); mesh.tilt.position.set(0, 0, 0);
    mesh.tilt.scale.set(1, 1, 1); mesh.scale.set(1, 1, 1);
  },
  putAt(mesh, sq) {
    const p = sqToWorld(sq);
    mesh.position.set(p.x, 0, p.z);
    mesh.userData.sq = sq;
  },
  disposePiece(mesh) { this.pieceGroup.remove(mesh); },

  // Réconcilie la scène avec la position (sans animation, sauf apparition)
  sync(pos, pop = false) {
    const keep = new Set();
    for (let i = 0; i < 64; i++) {
      const sq = E.from64(i), p = pos.board[sq];
      let mesh = this.pieces.get(sq);
      if (mesh && mesh.userData.piece !== p) { this.disposePiece(mesh); this.pieces.delete(sq); mesh = null; }
      if (p && !mesh) {
        mesh = this.makePiece(p);
        this.pieceGroup.add(mesh);
        this.pieces.set(sq, mesh);
        if (pop) { const m = mesh; m.scale.setScalar(.01); Tweens.add(320, k => m.scale.setScalar(Math.max(.01, Ease.outBack(k)))); }
      }
      if (mesh) { this.putAt(mesh, sq); this.resetPose(mesh); if (!pop) mesh.scale.set(1, 1, 1); keep.add(mesh); }
    }
    for (const t of ['w', 'b']) this.trays[t].forEach(m => keep.add(m));
    for (const child of [...this.pieceGroup.children]) if (!keep.has(child) && !child.userData.leaving) this.pieceGroup.remove(child);
    this.wake();
  },

  /* ---------- Bacs des pièces prises ---------- */
  buildTrays() {
    this.trayMat = new THREE.MeshStandardMaterial({ roughness: 1, transparent: true });
    this.trayMeshes = {};
    for (const c of ['w', 'b']) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), this.trayMat);
      m.receiveShadow = true;
      m.position.y = TABLE_Y;
      this.scene.add(m);
      this.trayMeshes[c] = m;
    }
    this.trayLayout = 'side';
  },
  layoutTrays() {
    const side = this.trayLayout === 'side';
    if (this.feltTex && this.trayMat.map !== this.feltTex[this.trayLayout]) { this.trayMat.map = this.feltTex[this.trayLayout]; this.trayMat.needsUpdate = true; }
    for (const c of ['w', 'b']) {
      const m = this.trayMeshes[c], s = c === 'w' ? 1 : -1;
      if (side) { m.scale.set(1.55, 1, 5.3); m.rotation.y = 0; m.position.set(s * 6.1, TABLE_Y, s * 2.3); }
      else { m.scale.set(5.3, 1, 1.55); m.position.set(-s * 2.2, TABLE_Y, s * 6.05); }
      this.trays[c].forEach((p, i) => { const t = this.traySlot(c, i); p.position.set(t.x, t.y, t.z); });
    }
  },
  // Emplacement n°i du bac du camp « captor »
  traySlot(captor, i) {
    const s = captor === 'w' ? 1 : -1, col = i % 2, row = Math.floor(i / 2);
    const sp = .6;
    if (this.trayLayout === 'side') return { x: s * (5.8 + col * sp), y: TABLE_Y, z: s * (4.45 - row * sp) };
    return { x: -s * (4.45 - row * sp), y: TABLE_Y, z: s * (5.75 + col * sp) };
  },
  TRAY_SCALE: .6,
  addToTray(captor, mesh) {
    this.trays[captor].push(mesh);
    mesh.userData.sq = -1; mesh.userData.leaving = false; mesh.userData.tray = captor;
    if (!mesh.parent) this.pieceGroup.add(mesh);
  },
  // Reconstruit les bacs d'après la liste des prises
  syncTrays(captured) {
    for (const c of ['w', 'b']) {
      const want = captured[c], have = this.trays[c];
      let same = have.length === want.length && have.every((m, i) => m.userData.piece === want[i]);
      if (same) continue;
      have.forEach(m => this.pieceGroup.remove(m));
      this.trays[c] = want.map((p, i) => {
        const m = this.makePiece(p);
        const t = this.traySlot(c, i);
        m.position.set(t.x, t.y, t.z); m.scale.setScalar(this.TRAY_SCALE);
        m.userData.tray = c;
        this.pieceGroup.add(m);
        return m;
      });
    }
    this.wake();
  },

  /* ---------- Picking ---------- */
  setPointer(ev) {
    const rect = this.renderer.domElement.getBoundingClientRect();
    this.ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    this.raycaster.setFromCamera(this.ndc, this.camera);
  },
  planeHit(ev, y = 0) {
    this.setPointer(ev);
    const p = new THREE.Vector3();
    return this.raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -y), p) ? p : null;
  },
  squareAtPoint(p) {
    if (!p) return -1;
    const f = Math.floor(p.x + 4), r = Math.floor(4 - p.z);
    return f >= 0 && f < 8 && r >= 0 && r < 8 ? r * 16 + f : -1;
  },
  pick(ev, ignore = null) {
    this.setPointer(ev);
    const objs = [...this.pieces.values()].filter(o => o !== ignore);
    const hit = this.raycaster.intersectObjects(objs, true)[0];
    if (hit) {
      let o = hit.object;
      while (o.parent && o.parent !== this.pieceGroup) o = o.parent;
      if (o.userData.sq >= 0) return o.userData.sq;
    }
    return this.squareAtPoint(this.planeHit(ev, 0));
  },

  /* ---------- Caméra ---------- */
  fitPoints() {
    const P = [], v = (x, y, z) => P.push(new THREE.Vector3(x, y, z));
    for (const x of [-5, 5]) for (const z of [-5, 5]) { v(x, .08, z); v(x, TABLE_Y, z); }
    for (const c of ['w', 'b']) {
      for (const i of [0, 1, 14, 15]) { const t = this.traySlot(c, i); v(t.x, TABLE_Y, t.z); v(t.x, TABLE_Y + .6, t.z); }
    }
    return P;
  },
  // Cadrage exact : la caméra (inclinaison fixe) se rapproche au maximum du plateau
  fit() {
    const cam = this.camera, w = this.stage.clientWidth, h = this.stage.clientHeight;
    const tilt = THREE.MathUtils.degToRad(this.tilt);
    const dir = new THREE.Vector3(0, Math.cos(tilt), Math.sin(tilt));
    const Mx = 1 - 16 / w, My = 1 - 12 / h;
    const pts = this.fitPoints(), v = new THREE.Vector3();
    let tz = 0, d = 20;
    const place = dist => {
      cam.position.set(0, 0, tz).addScaledVector(dir, dist);
      cam.lookAt(0, 0, tz);
      cam.updateMatrixWorld(true);
    };
    const bounds = () => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of pts) { v.copy(p).project(cam); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
      return { x0, x1, y0, y1 };
    };
    for (let iter = 0; iter < 4; iter++) {
      let lo = 3, hi = 120;
      for (let i = 0; i < 28; i++) {
        d = (lo + hi) / 2; place(d);
        const b = bounds();
        const ok = Math.max(-b.x0, b.x1) <= Mx && (b.y1 - b.y0) <= 2 * My;
        if (ok) hi = d; else lo = d;
      }
      d = hi; place(d);
      const b = bounds(), cy = (b.y0 + b.y1) / 2;
      const worldPerNdc = d * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
      tz -= cy * worldPerNdc / Math.cos(tilt);
    }
    place(d);
    this.camBase.copy(cam.position);
    this.camTarget = new THREE.Vector3(0, 0, tz);
  },

  resize() {
    const w = this.stage.clientWidth, h = this.stage.clientHeight;
    if (!w || !h) return;
    this.renderer.setSize(w, h, false);
    const cam = this.camera;
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
    const layout = w / h > 1.15 ? 'side' : 'front';
    if (layout !== this.trayLayout) { this.trayLayout = layout; }
    this.stage.dataset.layout = layout;
    this.layoutTrays();
    this.fit();
    const size = new THREE.Vector2();
    this.renderer.getDrawingBufferSize(size);
    Fx.setScale(size.y / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2))));
    this.wake();
  },

  doShake(amp = .05, ms = 260) { this.shake.amp = amp; this.shake.t = ms; this.shake.d = ms; this.wake(); },

  wake() { this.dirty = true; },

  loop(now) {
    const dt = Math.min(100, now - this.last);
    this.last = now;
    Tweens.tick(dt);
    const fxActive = Fx.update(dt / 1000);
    if (typeof Clock !== 'undefined') Clock.tick();
    const pulsing = this.checkMesh.visible;
    if (pulsing) this.checkMesh.material.opacity = .45 + .35 * (.5 + .5 * Math.sin(now / 190));
    if (this.shake.t > 0) {
      this.shake.t -= dt;
      const a = this.shake.amp * Math.max(0, this.shake.t / this.shake.d);
      this.camera.position.set(this.camBase.x + (Math.random() - .5) * a, this.camBase.y + (Math.random() - .5) * a * .5, this.camBase.z + (Math.random() - .5) * a);
      if (this.shake.t <= 0) this.camera.position.copy(this.camBase);
    }
    if (this.warmup > 0) this.warmup -= dt;
    const active = this.dirty || Tweens.active || fxActive || pulsing || this.warmup > 0 || this.shake.t > 0 || (typeof Game !== 'undefined' && Game.dragging);
    if (active) {
      this.renderer.render(this.scene, this.camera);
      this.dirty = false;
      this.sampleFps(dt, this.renderedLast);
    }
    this.renderedLast = active;
    requestAnimationFrame(t => this.loop(t));
  },

  // Graphismes allégés automatiques si < 40 fps de façon soutenue
  fps: { time: 0, frames: 0, strikes: 0 },
  sampleFps(dt, continuous) {
    if (this.lowGfx || !continuous || document.hidden) return;
    const f = this.fps;
    f.time += dt; f.frames++;
    if (f.time >= 1000) {
      const fps = f.frames * 1000 / f.time;
      f.strikes = fps < 40 ? f.strikes + 1 : 0;
      f.time = 0; f.frames = 0;
      if (f.strikes >= 2) this.setLowGraphics(true);
    }
  },
  setLowGraphics(on) {
    if (this.lowGfx === on) return;
    this.lowGfx = on;
    Fx.low = on;
    this.renderer.shadowMap.enabled = !on;
    this.keyLight.castShadow = !on;
    this.renderer.setPixelRatio(on ? 1 : Math.min(window.devicePixelRatio || 1, 2));
    this.scene.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => (m.needsUpdate = true)); });
    this.resize();
    if (on) UI.toast('Graphismes allégés pour garder l’animation fluide');
  },
};

/* =====================================================================
   FX — particules, éclats, ondes et chorégraphies par type de pièce
   ===================================================================== */

// Système de particules (Points + shader : taille, couleur, opacité par particule)
class ParticleSystem {
  constructor(max, additive) {
    this.max = max; this.n = 0;
    const F = k => new Float32Array(max * k);
    Object.assign(this, { pos: F(3), vel: F(3), col: F(3), alpha: F(1), size: F(1), life: F(1), age: F(1), a0: F(1), s0: F(1), grow: F(1), grav: F(1), drag: F(1) });
    const g = this.geo = new THREE.BufferGeometry();
    const attr = (name, arr, k) => { const a = new THREE.BufferAttribute(arr, k); a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(name, a); };
    attr('position', this.pos, 3); attr('pcolor', this.col, 3); attr('palpha', this.alpha, 1); attr('psize', this.size, 1);
    g.setDrawRange(0, 0);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { scale: { value: 600 } },
      vertexShader: `
        attribute vec3 pcolor; attribute float palpha; attribute float psize;
        uniform float scale; varying vec3 vC; varying float vA;
        void main() {
          vC = pcolor; vA = palpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = psize * scale / -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vC; varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(vC, a * a * vA);
        }`,
      transparent: true, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = additive ? 6 : 5;
  }
  emit(o) {
    if (this.n >= this.max) return;
    const i = this.n++, i3 = i * 3;
    this.pos[i3] = o.x; this.pos[i3 + 1] = o.y; this.pos[i3 + 2] = o.z;
    this.vel[i3] = o.vx || 0; this.vel[i3 + 1] = o.vy || 0; this.vel[i3 + 2] = o.vz || 0;
    const c = o.color;
    this.col[i3] = c.r; this.col[i3 + 1] = c.g; this.col[i3 + 2] = c.b;
    this.life[i] = o.life || .8; this.age[i] = 0;
    this.a0[i] = o.alpha == null ? 1 : o.alpha; this.alpha[i] = 0;
    this.s0[i] = o.size || .2; this.size[i] = this.s0[i];
    this.grow[i] = o.grow || 0; this.grav[i] = o.gravity || 0; this.drag[i] = o.drag || 0;
  }
  update(dt) {
    let i = 0;
    while (i < this.n) {
      this.age[i] += dt;
      if (this.age[i] >= this.life[i]) { this.kill(i); continue; }
      const i3 = i * 3, dr = Math.max(0, 1 - this.drag[i] * dt);
      this.vel[i3] *= dr; this.vel[i3 + 1] = this.vel[i3 + 1] * dr + this.grav[i] * dt; this.vel[i3 + 2] *= dr;
      this.pos[i3] += this.vel[i3] * dt; this.pos[i3 + 1] += this.vel[i3 + 1] * dt; this.pos[i3 + 2] += this.vel[i3 + 2] * dt;
      const t = this.age[i] / this.life[i];
      this.alpha[i] = this.a0[i] * Math.min(1, t * 8) * Math.pow(1 - t, 1.3);
      this.size[i] = this.s0[i] * (1 + this.grow[i] * t);
      i++;
    }
    this.geo.setDrawRange(0, this.n);
    for (const k of ['position', 'pcolor', 'palpha', 'psize']) this.geo.attributes[k].needsUpdate = true;
    return this.n > 0;
  }
  kill(i) {
    const j = --this.n;
    if (i === j) return;
    for (const k of ['pos', 'vel', 'col']) { const a = this[k]; a[i * 3] = a[j * 3]; a[i * 3 + 1] = a[j * 3 + 1]; a[i * 3 + 2] = a[j * 3 + 2]; }
    for (const k of ['alpha', 'size', 'life', 'age', 'a0', 's0', 'grow', 'grav', 'drag']) this[k][i] = this[k][j];
  }
  clear() { this.n = 0; this.geo.setDrawRange(0, 0); }
}

const Fx = {
  low: false,
  shards: [],
  init(scene) {
    this.scene = scene;
    this.glow = new ParticleSystem(900, true);
    this.dust = new ParticleSystem(500, false);
    scene.add(this.glow.points, this.dust.points);
    this.ringGeo = new THREE.RingGeometry(.86, 1, 64).rotateX(-Math.PI / 2);
    this.discGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    this.glowTex = Tex.radial([[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']]);
    this.shardGeos = [new THREE.TetrahedronGeometry(1, 0), new THREE.OctahedronGeometry(1, 0), new THREE.BoxGeometry(1.2, .7, .9)];
  },
  setScale(s) { this.glow.mat.uniforms.scale.value = s; this.dust.mat.uniforms.scale.value = s; },
  count(n) { return this.low ? Math.ceil(n / 3) : n; },
  glowColor() { return new THREE.Color(View.theme.glow); },

  update(dt) {
    let active = this.glow.update(dt) | this.dust.update(dt);
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const s = this.shards[i];
      s.age += dt;
      s.v.y -= 9.8 * dt;
      s.m.position.addScaledVector(s.v, dt);
      const onBoard = Math.abs(s.m.position.x) < 4.95 && Math.abs(s.m.position.z) < 4.95;
      const floor = (onBoard ? 0 : TABLE_Y) + s.r * .6;
      if (s.m.position.y < floor) {
        s.m.position.y = floor;
        if (s.v.y < 0) s.v.y *= -.32;
        s.v.x *= .7; s.v.z *= .7; s.w.multiplyScalar(.7);
      }
      s.m.rotation.x += s.w.x * dt; s.m.rotation.y += s.w.y * dt; s.m.rotation.z += s.w.z * dt;
      if (s.age > s.life - .35) s.m.scale.setScalar(s.r * Math.max(.001, (s.life - s.age) / .35));
      if (s.age >= s.life) { this.scene.remove(s.m); this.shards.splice(i, 1); }
    }
    return active || this.shards.length > 0;
  },

  // Efface les effets résiduels (retour en arrière, nouvelle position)
  clearAll() {
    this.glow.clear(); this.dust.clear();
    for (const sh of this.shards) this.scene.remove(sh.m);
    this.shards.length = 0;
    View.wake();
  },

  /* ---------- Briques d'effets ---------- */
  burst(sys, x, y, z, n, o) {
    const col = o.color;
    for (let i = 0; i < this.count(n); i++) {
      const a = Math.random() * Math.PI * 2, sp = (o.speed || 1) * (.4 + Math.random() * .8);
      sys.emit({
        x: x + Math.cos(a) * (o.radius || 0), y: y + Math.random() * (o.height || 0), z: z + Math.sin(a) * (o.radius || 0),
        vx: Math.cos(a) * sp, vy: (o.up || 0) * (.5 + Math.random()), vz: Math.sin(a) * sp,
        color: Array.isArray(col) ? col[i % col.length] : col, life: (o.life || .7) * (.7 + Math.random() * .6),
        size: (o.size || .2) * (.7 + Math.random() * .6), grow: o.grow || 0, gravity: o.gravity || 0, drag: o.drag || 2, alpha: o.alpha,
      });
    }
    View.wake();
  },
  dustPuff(x, z, y = 0, strength = 1) {
    const base = View.theme.board.kind === 'night' ? new THREE.Color(0x3a4a5a) : new THREE.Color(0x8b7a66);
    this.burst(this.dust, x, y + .03, z, 18 * strength, { color: base, speed: 1.1 * strength, up: .35, life: .8, size: .32, grow: 1.4, drag: 3.2, alpha: .42, radius: .22 });
  },
  shockwave(x, y, z, color, { r0 = .3, r1 = 1.5, ms = 520, opacity = .85 } = {}) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
    const m = new THREE.Mesh(this.ringGeo, mat);
    m.position.set(x, y + .012, z); m.renderOrder = 7;
    this.scene.add(m);
    return Tweens.add(ms, k => {
      const e = Ease.outCubic(k);
      m.scale.setScalar(lerp(r0, r1, e));
      mat.opacity = opacity * (1 - k);
    }).then(() => { this.scene.remove(m); mat.dispose(); });
  },
  glowDisc(color, size, opacity = .8) {
    const mat = new THREE.MeshBasicMaterial({ color, map: this.glowTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
    const m = new THREE.Mesh(this.discGeo, mat);
    m.scale.set(size, 1, size); m.renderOrder = 7; m.userData.max = opacity;
    this.scene.add(m);
    return m;
  },
  dropMesh(m) { this.scene.remove(m); m.material.dispose(); },

  // Inclinaison d'une pièce dans le sens (dx, dz) — pivot à la base
  lean(mesh, dx, dz, angle) {
    const l = Math.hypot(dx, dz) || 1;
    mesh.tilt.quaternion.setFromAxisAngle(new THREE.Vector3(dz / l, 0, -dx / l), angle);
  },
  roll(mesh, dx, dz, angle) {
    const l = Math.hypot(dx, dz) || 1;
    mesh.tilt.quaternion.setFromAxisAngle(new THREE.Vector3(dx / l, 0, dz / l), angle);
  },
  // Clone une pièce avec des matériaux propres (fondu, découpe)
  cloneWithOwnMaterials(mesh, extra = {}) {
    const c = mesh.clone(true);
    c.tilt = c.children[0]; c.body = c.tilt && c.tilt.children[0];
    c.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); Object.assign(o.material, { transparent: true, ...extra }); o.castShadow = false; } });
    return c;
  },
  setOpacity(mesh, a) { mesh.traverse(o => { if (o.isMesh) o.material.opacity = a; }); },
  disposeClone(mesh) { mesh.parent && mesh.parent.remove(mesh); mesh.traverse(o => { if (o.isMesh) o.material.dispose(); }); },

  /* ---------- Déplacements (retournent { done, contact }) ---------- */
  moves: {
    [E.PAWN](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
      if (o.capture) {                                  // estoc : armé, fente rapide
        const D = 430;
        const done = Tweens.add(D, k => {
          let e, y = 0, lean;
          if (k < .28) { const q = Ease.outQuad(k / .28); e = -.1 * q; lean = -.18 * q; }
          else { const q = Ease.inOutCubic((k - .28) / .72); e = lerp(-.1, 1, q); y = .14 * Math.sin(Math.PI * q); lean = lerp(-.18, .3, Math.min(1, q * 1.6)) * (1 - Math.max(0, q - .75) * 4); }
          m.position.set(a.x + dx * e, y, a.z + dz * e);
          Fx.lean(m, dx, dz, lean);
        });
        Sound.play('pawnStab');
        return { done, contact: D * .82 };
      }
      const hops = dist > 1.5 ? 3 : 2, H = 190, D = hops * H + 170;
      let landed = 0;
      const done = Tweens.add(D, k => {
        const t = k * D;
        if (t < hops * H) {
          const i = Math.floor(t / H), lt = (t - i * H) / H;
          const e = (i + Ease.inOutSine(lt)) / hops;
          m.position.set(a.x + dx * e, .17 * Math.sin(Math.PI * lt), a.z + dz * e);
          const sq = 1 - .1 * Math.max(0, 1 - lt * 5) - .06 * Math.max(0, lt * 5 - 4);   // tassement aux appuis
          m.tilt.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
          if (i > landed) { landed = i; Sound.play('pawnHop'); }
        } else {                                         // rebond à l'atterrissage
          const q = (t - hops * H) / 170;
          m.position.set(b.x, 0, b.z);
          const s = 1 - .14 * Math.sin(Math.PI * Math.min(1, q * 1.4)) * (1 - q);
          m.tilt.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
          if (landed < hops) { landed = hops; Sound.play('pawn'); }
        }
      });
      return { done, contact: D };
    },

    [E.KNIGHT](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z;
      const corner = Math.abs(dx) > Math.abs(dz) ? { x: b.x, z: a.z } : { x: a.x, z: b.z };
      const D = 720;
      let launched = false, landed = false;
      const done = Tweens.add(D, k => {
        if (k < .2) {                                    // se cabre
          const q = Ease.outQuad(k / .2);
          m.position.set(a.x, 0, a.z);
          Fx.lean(m, dx, dz, -.5 * q);
        } else if (k < .88) {                            // vol en arc qui suit le L
          if (!launched) { launched = true; Sound.play('knightJump'); }
          const t = Ease.inOutSine((k - .2) / .68), u = 1 - t;
          m.position.set(u * u * a.x + 2 * u * t * corner.x + t * t * b.x, 1.15 * 4 * t * (1 - t), u * u * a.z + 2 * u * t * corner.z + t * t * b.z);
          Fx.lean(m, dx, dz, lerp(-.5, .35, t));
        } else {                                         // réception
          const q = (k - .88) / .12;
          m.position.set(b.x, 0, b.z);
          Fx.lean(m, dx, dz, .35 * (1 - Ease.outBack(q)));
          const s = 1 - .12 * Math.sin(Math.PI * q);
          m.tilt.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
          if (!landed) {
            landed = true;
            Sound.play('knightLand');
            Fx.shockwave(b.x, 0, b.z, Fx.glowColor(), { r1: 1.25, ms: 480, opacity: .6 });
            Fx.dustPuff(b.x, b.z, 0, .8);
          }
        }
      });
      return { done, contact: D * .86 };
    },

    [E.BISHOP](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
      const D = clamp(320 + dist * 115, 420, 1000);
      const col = Fx.glowColor();
      Sound.play('bishopGlide', { dur: D / Tweens.speed / 1000 });
      const done = Tweens.add(D, k => {
        const e = Ease.inOutCubic(k);
        m.position.set(a.x + dx * e, .05 * Math.sin(Math.PI * k), a.z + dz * e);
        Fx.lean(m, dx, dz, .14 * Math.sin(Math.PI * k));
        if (k < .97) for (let i = 0; i < 2; i++) {       // traînée lumineuse
          Fx.glow.emit({ x: m.position.x + (Math.random() - .5) * .16, y: .08 + Math.random() * .55, z: m.position.z + (Math.random() - .5) * .16,
            vx: -dx * .04, vy: .12, vz: -dz * .04, color: col, life: .55, size: .22, grow: -.4, alpha: .7 });
        }
      });
      done.then(() => Sound.play('tock', { f: 520 }));
      return { done, contact: D * .74 };
    },

    [E.ROOK](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
      const D = clamp(300 + dist * 125, 420, 1100);
      Sound.play('rookSlide', { dur: D / Tweens.speed / 1000 });
      let arrived = false;
      const done = Tweens.add(D, k => {
        const e = o.capture ? Ease.inQuad(k) : Ease.inOutQuad(k);
        m.position.set(a.x + dx * e, .012 * Math.abs(Math.sin(k * 40)) * (1 - k), a.z + dz * e);
        Fx.lean(m, dx, dz, (o.capture ? .16 : .07) * Math.sin(Math.PI * Math.min(1, k * 1.15)));
        if (k >= 1 && !arrived) {
          arrived = true;
          View.doShake(o.capture ? .09 : .045, 260);
          Fx.dustPuff(b.x, b.z, 0, o.capture ? 1.4 : 1);
          Sound.play('rookThud');
        }
      });
      return { done, contact: D * .88 };
    },

    [E.QUEEN](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
      const D = clamp(760 + dist * 70, 850, 1300);
      const col = Fx.glowColor();
      const halo = Fx.glowDisc(col, 1.5, .75);
      Sound.play('queenRise');
      const done = Tweens.add(D, k => {
        let e, y;
        if (k < .25) { const q = Ease.outCubic(k / .25); e = 0; y = .55 * q; }
        else if (k < .78) { const q = Ease.inOutSine((k - .25) / .53); e = q; y = .55 + .04 * Math.sin(q * Math.PI * 3); }
        else { const q = Ease.outCubic((k - .78) / .22); e = 1; y = .55 * (1 - q); }
        m.position.set(a.x + dx * e, y, a.z + dz * e);
        halo.position.set(m.position.x, .015, m.position.z);
        halo.material.opacity = .75 * Math.sin(Math.PI * k);
        const s = 1.3 + .25 * Math.sin(k * 20);
        halo.scale.set(s, 1, s);
        if (Math.random() < .6) {
          const ang = Math.random() * Math.PI * 2;
          Fx.glow.emit({ x: m.position.x + Math.cos(ang) * .32, y: y + .2 + Math.random() * .5, z: m.position.z + Math.sin(ang) * .32,
            vx: -Math.sin(ang) * .4, vy: .25, vz: Math.cos(ang) * .4, color: col, life: .6, size: .16, alpha: .8 });
        }
      });
      done.then(() => { Fx.dropMesh(halo); Sound.play('tock', { f: 440 }); });
      return { done, contact: D * .7 };
    },

    [E.KING](m, a, b, o) {
      const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
      const steps = Math.max(3, Math.round(dist * 2.2)), S = 300, D = steps * S;
      let step = -1;
      const done = Tweens.add(D, k => {
        const t = k * D, i = Math.min(steps - 1, Math.floor(t / S)), lt = (t - i * S) / S;
        const e = (i + Ease.inOutSine(lt)) / steps;
        m.position.set(a.x + dx * e, .045 * Math.sin(Math.PI * lt), a.z + dz * e);
        Fx.roll(m, dx, dz, (i % 2 ? 1 : -1) * .1 * Math.sin(Math.PI * lt));   // pas solennels, balancement
        if (i !== step) { step = i; Sound.play('kingStep'); }
        if (k >= 1) m.tilt.quaternion.identity();
      });
      return { done, contact: D * .84 };
    },
  },

  // Glisser-déposer : la pièce se pose simplement
  drop(m, b) {
    const from = m.position.clone();
    Sound.play('tock', { f: 480 });
    return { done: Tweens.add(170, k => { const e = Ease.outCubic(k); m.position.set(lerp(from.x, b.x, e), lerp(from.y, 0, e), lerp(from.z, b.z, e)); }), contact: 60 };
  },

  /* ---------- Captures (selon la pièce attaquante) ---------- */
  captures: {
    // Pion : la victime bascule puis tombe hors du plateau vers le bac
    async [E.PAWN](v, dir, captor) {
      Sound.play('topple');
      const p0 = v.position.clone(), R = .28;
      await Tweens.add(340, k => {
        const a = Ease.inQuad(k) * 1.5;
        Fx.lean(v, dir.x, dir.z, a);
        v.position.set(p0.x + dir.x * .22 * k, R * Math.sin(a) * .55, p0.z + dir.z * .22 * k);
      });
      await Fx.flyToTray(v, captor, { arc: 1.1, ms: 560 });
    },
    // Cavalier : retombe sur la victime, projetée en tournoyant
    async [E.KNIGHT](v, dir, captor) {
      Sound.play('whack');
      View.doShake(.04, 160);
      await Fx.flyToTray(v, captor, { arc: 2.2, ms: 820, tumble: 3, spin: 2 });
    },
    // Fou : tranche en diagonale, deux moitiés qui glissent
    async [E.BISHOP](v, dir, captor) {
      Sound.play('slice');
      const c = colorOf(v.userData.piece);
      const side = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
      const n = side.clone().add(new THREE.Vector3(0, 1.1, 0)).normalize();
      const slope = side.clone().multiplyScalar(n.y).add(new THREE.Vector3(0, -n.x * side.x - n.z * side.z, 0)).normalize();
      const p0 = v.position.clone().add(new THREE.Vector3(0, .38, 0));
      const pA = new THREE.Plane(n.clone(), -n.dot(p0)), pB = new THREE.Plane(n.clone().negate(), n.dot(p0));
      const A = Fx.cloneWithOwnMaterials(v, { clippingPlanes: [pA], side: THREE.DoubleSide });
      const B = Fx.cloneWithOwnMaterials(v, { clippingPlanes: [pB], side: THREE.DoubleSide });
      v.parent.remove(v);
      View.pieceGroup.add(A, B);
      // éclair de coupe
      const flash = Fx.glowDisc(Fx.glowColor(), 1, 1);
      flash.scale.set(1.2, 1, .08);
      flash.position.copy(p0);
      flash.rotation.y = Math.atan2(-side.z, side.x);
      flash.rotation.z = Math.atan2(n.x * side.x + n.z * side.z, n.y) * 0;
      const a0 = A.position.clone(), b0 = B.position.clone();
      await Tweens.add(760, k => {
        const e = Ease.inQuad(k);
        const offA = slope.clone().multiplyScalar(.8 * e).add(new THREE.Vector3(0, -.25 * e * e, 0));
        const offB = n.clone().multiplyScalar(-.06 * Ease.outCubic(k));
        A.position.copy(a0).add(offA); B.position.copy(b0).add(offB);
        pA.constant = -n.dot(p0.clone().add(offA));
        pB.constant = n.dot(p0.clone().add(offB));
        Fx.lean(A, slope.x, slope.z, .5 * e);
        flash.material.opacity = Math.max(0, 1 - k * 4);
        flash.scale.set(1.2 + k * 1.2, 1, .08);
        const fade = k < .55 ? 1 : 1 - (k - .55) / .45;
        Fx.setOpacity(A, fade); Fx.setOpacity(B, fade);
      });
      Fx.dropMesh(flash);
      Fx.disposeClone(A); Fx.disposeClone(B);
      Fx.trayPop(v.userData.piece, captor, c);
    },
    // Tour : charge comme un bélier, la victime vole en éclats
    async [E.ROOK](v, dir, captor) {
      Sound.play('shatter');
      const c = colorOf(v.userData.piece), p = v.position.clone();
      v.parent.remove(v);
      View.doShake(.1, 300);
      Fx.dustPuff(p.x, p.z, 0, 1.3);
      const n = Fx.count(28);
      for (let i = 0; i < n; i++) {
        const r = .04 + Math.random() * .07;
        const m = new THREE.Mesh(Fx.shardGeos[i % 3], View.mat[c]);
        m.scale.setScalar(r); m.castShadow = !Fx.low;
        const ang = Math.random() * Math.PI * 2, rad = Math.random() * .22;
        m.position.set(p.x + Math.cos(ang) * rad, .05 + Math.random() * .6, p.z + Math.sin(ang) * rad);
        const sp = 1.4 + Math.random() * 2.4;
        const v3 = new THREE.Vector3(dir.x * sp + Math.cos(ang) * (.6 + Math.random()), 1 + Math.random() * 3, dir.z * sp + Math.sin(ang) * (.6 + Math.random()));
        Fx.scene.add(m);
        Fx.shards.push({ m, v: v3, w: new THREE.Vector3((Math.random() - .5) * 18, (Math.random() - .5) * 18, (Math.random() - .5) * 18), age: 0, life: 1.4 + Math.random() * .5, r });
      }
      await Tweens.delay(380);
      Fx.trayPop(v.userData.piece, captor, c);
    },
    // Dame : onde d'énergie, la victime se désintègre en particules
    async [E.QUEEN](v, dir, captor, origin) {
      Sound.play('zap');
      const c = colorOf(v.userData.piece), col = Fx.glowColor();
      Fx.shockwave(origin.x, 0, origin.z, col, { r0: .2, r1: 2.4, ms: 650, opacity: .9 });
      Fx.shockwave(origin.x, .35, origin.z, col, { r0: .1, r1: 1.6, ms: 520, opacity: .7 });
      const g = Fx.cloneWithOwnMaterials(v);
      const p = v.position.clone();
      v.parent.remove(v);
      View.pieceGroup.add(g);
      const pc = new THREE.Color(View.theme.pieces[c].color);
      await Tweens.add(820, k => {
        g.scale.set(1 - .3 * k, 1 + .25 * k, 1 - .3 * k);
        g.position.y = .25 * k;
        Fx.setOpacity(g, 1 - Ease.inQuad(k));
        for (let i = 0; i < (Fx.low ? 1 : 4); i++) {
          const a = Math.random() * Math.PI * 2, r = Math.random() * .28;
          Fx.glow.emit({ x: p.x + Math.cos(a) * r, y: Math.random() * .9 * (1 - k * .5) + .1, z: p.z + Math.sin(a) * r,
            vx: Math.cos(a) * .3 + dir.x * .3, vy: .6 + Math.random() * .8, vz: Math.sin(a) * .3 + dir.z * .3,
            color: Math.random() < .5 ? col : pc, life: .9, size: .13 + Math.random() * .1, drag: 1, alpha: .9 });
        }
      });
      Fx.disposeClone(g);
      Fx.trayPop(v.userData.piece, captor, c);
    },
    // Roi : frappe autoritaire, la victime s'effondre et s'enfonce dans le sol
    async [E.KING](v, dir, captor) {
      Sound.play('slam');
      const c = colorOf(v.userData.piece), p = v.position.clone();
      View.doShake(.06, 200);
      Fx.dustPuff(p.x, p.z, 0, 1.1);
      await Tweens.add(180, k => { const s = 1 - .3 * Ease.outQuad(k); v.tilt.scale.set(1 + (1 - s) * .5, s, 1 + (1 - s) * .5); });
      await Tweens.add(620, k => { v.position.y = -1.1 * Ease.inCubic(k); });
      v.parent.remove(v);
      Fx.trayPop(v.userData.piece, captor, c);
    },
  },

  // Vol d'une pièce vers le bac de son capteur
  flyToTray(v, captor, { arc = 1, ms = 600, tumble = 0, spin = 0 } = {}) {
    const idx = View.trays[captor].length;
    View.addToTray(captor, v);
    const t = View.traySlot(captor, idx), p0 = v.position.clone(), q0 = v.tilt.quaternion.clone();
    const axis = new THREE.Vector3(Math.random() - .5, .3, Math.random() - .5).normalize(), qT = new THREE.Quaternion();
    return Tweens.add(ms, k => {
      const e = Ease.inOutSine(k);
      v.position.set(lerp(p0.x, t.x, e), lerp(p0.y, t.y, e) + arc * Math.sin(Math.PI * k), lerp(p0.z, t.z, e));
      v.scale.setScalar(lerp(1, View.TRAY_SCALE, e));
      if (tumble) { qT.setFromAxisAngle(axis, tumble * Math.PI * 2 * Ease.outCubic(k)); v.tilt.quaternion.copy(qT); }
      else v.tilt.quaternion.copy(q0).slerp(new THREE.Quaternion(), Ease.outCubic(k));
      v.rotation.y = spin * Math.PI * 2 * Ease.outCubic(k);
    }).then(() => {
      View.resetPose(v); v.rotation.y = 0; v.scale.setScalar(View.TRAY_SCALE); v.position.set(t.x, t.y, t.z);
      Sound.play('tock', { f: 700, g: .25 });
    });
  },
  // Apparition dans le bac (la victime d'origine a été détruite)
  trayPop(piece, captor) {
    const m = View.makePiece(piece);
    const idx = View.trays[captor].length;
    const t = View.traySlot(captor, idx);
    m.position.set(t.x, t.y, t.z);
    m.scale.setScalar(.001);
    View.pieceGroup.add(m);
    View.addToTray(captor, m);
    this.burst(this.glow, t.x, t.y + .15, t.z, 10, { color: this.glowColor(), speed: .6, up: .6, life: .5, size: .14, alpha: .7 });
    return Tweens.add(380, k => m.scale.setScalar(Math.max(.001, View.TRAY_SCALE * Ease.outBack(k))));
  },

  // Promotion : colonne de lumière, le pion se transforme
  async promote(pawn, sq, newPiece) {
    const p = sqToWorld(sq), col = this.glowColor();
    Sound.play('promote');
    const beamMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false });
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(.34, .42, 2.4, 32, 1, true), beamMat);
    beam.position.set(p.x, 1.2, p.z); beam.renderOrder = 8;
    this.scene.add(beam);
    const disc = this.glowDisc(col, 1.8, 1);
    disc.position.set(p.x, .015, p.z);
    const fresh = View.makePiece(newPiece);
    View.putAt(fresh, sq);
    fresh.scale.setScalar(.001);
    View.pieceGroup.add(fresh);
    const ghost = this.cloneWithOwnMaterials(pawn, { emissive: col });
    ghost.position.copy(pawn.position);
    View.pieceGroup.add(ghost);
    View.pieceGroup.remove(pawn);
    View.pieces.set(sq, fresh);
    await Tweens.add(950, k => {
      beamMat.opacity = .55 * Math.sin(Math.PI * k);
      disc.material.opacity = Math.sin(Math.PI * k);
      const g1 = Math.min(1, k / .5);
      ghost.scale.set(1 - .5 * g1, 1 + .35 * g1, 1 - .5 * g1);
      ghost.rotation.y = k * 6;
      Fx.setOpacity(ghost, 1 - g1);
      ghost.traverse(o => { if (o.isMesh && o.material.emissiveIntensity != null) o.material.emissiveIntensity = g1 * 2; });
      const g2 = clamp((k - .35) / .65, 0, 1);
      fresh.scale.setScalar(Math.max(.001, Ease.outBack(g2)));
      fresh.rotation.y = (1 - Ease.outCubic(g2)) * -4;
      if (Math.random() < .8) {
        const a = k * 20 + Math.random(), r = .45;
        Fx.glow.emit({ x: p.x + Math.cos(a) * r, y: .05 + k * 1.4, z: p.z + Math.sin(a) * r, vx: 0, vy: .8, vz: 0, color: col, life: .6, size: .18, alpha: .9 });
      }
    });
    fresh.rotation.y = 0;
    this.disposeClone(ghost);
    this.scene.remove(beam); beam.geometry.dispose(); beamMat.dispose();
    this.dropMesh(disc);
  },

  // Échec et mat : le roi vaincu bascule lentement
  async topple(king) {
    if (!king) return;
    const dir = king.position.z < 0 ? { x: .35, z: -1 } : { x: -.35, z: 1 };
    const p0 = king.position.clone(), R = .3;
    let hit = false;
    await Tweens.add(1700, k => {
      const a = (Math.PI / 2 - .06) * (k < .82 ? Ease.inQuad(k / .82) : 1 - .06 * Math.sin(Math.PI * (k - .82) / .18));
      Fx.lean(king, dir.x, dir.z, a);
      king.position.set(p0.x + dir.x * R * (1 - Math.cos(a)) * .5, R * Math.sin(a) * .62, p0.z + dir.z * R * (1 - Math.cos(a)) * .5);
      if (k >= .82 && !hit) {
        hit = true;
        View.doShake(.07, 280);
        this.dustPuff(king.position.x + dir.x * .5, king.position.z + dir.z * .5, 0, 1.2);
        Sound.play('thudBig');
      }
    });
  },

  /* ---------- Chef d'orchestre d'un coup ---------- */
  async playMove(m, pos, { dropped = false, captured } = {}) {
    const type = m.piece & E.TYPE, captor = colorOf(m.piece);
    const mover = View.pieces.get(m.from);
    const capSq = m.flags & E.F_EP ? m.to + (m.piece & E.COLOR ? 16 : -16) : m.to;
    const victim = (m.flags & E.F_CAPTURE) ? View.pieces.get(capSq) : null;
    const castle = m.flags & (E.F_KCASTLE | E.F_QCASTLE);
    View.pieces.delete(m.from);
    if (victim) { View.pieces.delete(capSq); victim.userData.leaving = true; }
    let rook = null, rf = -1, rt = -1;
    if (castle) {
      rf = m.flags & E.F_KCASTLE ? m.to + 1 : m.to - 2;
      rt = m.flags & E.F_KCASTLE ? m.to - 1 : m.to + 1;
      rook = View.pieces.get(rf);
      View.pieces.delete(rf);
      if (rook) { View.pieces.set(rt, rook); rook.userData.sq = rt; }
    }
    if (mover) { View.pieces.set(m.to, mover); mover.userData.sq = m.to; }

    if (Tweens.off || !mover) {                           // animations désactivées
      if (victim) victim.parent && victim.parent.remove(victim);
      Sound.play(victim ? 'capture' : castle ? 'castle' : 'tock', { f: 520 });
      View.sync(pos);
      if (captured) View.syncTrays(captured);
      return;
    }
    const a = sqToWorld(m.from), b = sqToWorld(m.to);
    const run = dropped ? this.drop(mover, b) : this.moves[type](mover, a, b, { capture: !!victim, castle });
    const jobs = [run.done];
    if (castle && rook) {
      Sound.play('castle');
      const ra = sqToWorld(rf), rb = sqToWorld(rt);
      jobs.push(Tweens.delay(dropped ? 0 : 160).then(() => Tweens.add(dropped ? 260 : 900, k => {
        const e = Ease.inOutSine(k);
        rook.position.set(lerp(ra.x, rb.x, e), 1.0 * Math.sin(Math.PI * k), ra.z);   // la tour passe au-dessus du roi
        Fx.lean(rook, rb.x - ra.x, 0, .25 * Math.sin(Math.PI * k));
      })).then(() => { rook.tilt.quaternion.identity(); Fx.dustPuff(rb.x, rb.z, 0, .6); Sound.play('rookThud'); }));
    }
    if (victim) {
      const dir = new THREE.Vector3(b.x - a.x, 0, b.z - a.z).normalize();
      const attacker = type;
      jobs.push(Tweens.delay(run.contact).then(() => this.captures[attacker](victim, dir, captor, mover.position.clone())));
    }
    await Promise.all(jobs);
    View.resetPose(mover);
    View.putAt(mover, m.to);
    if (m.promo) await this.promote(mover, m.to, m.promo);
    View.sync(pos);
    if (captured) View.syncTrays(captured);
  },
};

/* =====================================================================
   SOUND — tous les sons sont synthétisés (Web Audio API, aucun fichier)
   ===================================================================== */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -14; this.comp.ratio.value = 4;
      this.master = this.ctx.createGain();
      this.master.connect(this.comp).connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.applyVolume();
    return this.ctx;
  },
  applyVolume() { if (this.master) this.master.gain.value = Settings.sound ? Math.pow(Settings.volume, 1.5) : 0; },
  unlock() { this.ensure(); },
  play(name, opts = {}) {
    if (!Settings.sound || !this.defs[name]) return;
    const ctx = this.ensure();
    if (!ctx || ctx.state !== 'running') return;
    try { this.defs[name].call(this, ctx.currentTime + .005, opts); } catch (e) { /* son ignoré */ }
  },

  tone(t, { type = 'sine', f0, f1, dur = .2, gain = .3, attack = .004 }) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + .05);
  },
  noise(t, { dur = .1, gain = .3, type = 'bandpass', f = 1000, f1, q = 1, attack = .002 }) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    fl.type = type; fl.frequency.setValueAtTime(f, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    fl.Q.value = q;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(this.master);
    s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  tock(t, f = 520, g = .45) {
    this.tone(t, { f0: f, f1: f * .55, dur: .09, gain: g });
    this.noise(t, { f: f * 3, q: 2, dur: .035, gain: g * .5 });
  },

  defs: {
    tock(t, o) { this.tock(t, o.f || 520, o.g || .45); },
    pawnHop(t) { this.tock(t, 760, .18); },
    pawn(t) { this.tock(t, 620, .38); },
    pawnStab(t) { this.noise(t, { type: 'highpass', f: 2500, f1: 6000, dur: .1, gain: .22 }); this.tock(t + .08, 820, .3); },
    knightJump(t) { this.noise(t, { f: 400, f1: 1600, q: 1.5, dur: .32, gain: .22, attack: .08 }); },
    knightLand(t) { this.tone(t, { f0: 150, f1: 55, dur: .28, gain: .55 }); this.noise(t, { type: 'lowpass', f: 500, dur: .12, gain: .35 }); },
    bishopGlide(t, o) {
      const d = clamp(o.dur || .6, .3, 1.2);
      this.tone(t, { f0: 1320, f1: 1760, dur: d, gain: .05, attack: d * .4 });
      this.tone(t, { f0: 1980, f1: 2640, dur: d * .9, gain: .025, attack: d * .4 });
      this.noise(t, { type: 'highpass', f: 5000, dur: d, gain: .04, attack: d * .3 });
    },
    rookSlide(t, o) { const d = clamp(o.dur || .6, .3, 1.2); this.noise(t, { type: 'lowpass', f: 260, f1: 520, dur: d, gain: .22, attack: .08 }); },
    rookThud(t) { this.tone(t, { f0: 95, f1: 42, dur: .38, gain: .75 }); this.noise(t, { type: 'lowpass', f: 260, dur: .2, gain: .45 }); },
    queenRise(t) { [523.25, 659.25, 783.99].forEach((f, i) => this.tone(t + i * .04, { type: 'triangle', f0: f, dur: .95, gain: .07, attack: .2 })); },
    kingStep(t) { this.tone(t, { f0: 190, f1: 120, dur: .13, gain: .32 }); this.noise(t, { type: 'lowpass', f: 700, dur: .05, gain: .18 }); },
    capture(t) { this.noise(t, { f: 1800, q: 1.2, dur: .09, gain: .5 }); this.tock(t, 360, .5); },
    topple(t) { this.tock(t, 300, .35); this.tock(t + .22, 240, .3); },
    whack(t) { this.noise(t, { f: 900, q: 1, dur: .12, gain: .7 }); this.tone(t, { f0: 230, f1: 110, dur: .16, gain: .5 }); },
    slice(t) { this.noise(t, { type: 'highpass', f: 6500, f1: 1800, dur: .2, gain: .4 }); this.tone(t + .02, { f0: 2400, f1: 1700, dur: .45, gain: .07 }); },
    shatter(t) {
      for (let i = 0; i < 12; i++) this.noise(t + Math.random() * .28, { f: 1800 + Math.random() * 5000, q: 4, dur: .05 + Math.random() * .06, gain: .25 });
      this.tone(t, { f0: 90, f1: 40, dur: .35, gain: .6 });
    },
    zap(t) { this.tone(t, { type: 'sawtooth', f0: 1300, f1: 90, dur: .45, gain: .1 }); this.tone(t, { f0: 70, f1: 40, dur: .45, gain: .45 }); },
    slam(t) { this.tone(t, { f0: 75, f1: 32, dur: .55, gain: .85 }); this.noise(t, { type: 'lowpass', f: 180, dur: .3, gain: .55 }); },
    castle(t) { this.tock(t, 500, .35); this.tock(t + .2, 420, .35); },
    check(t) { this.tone(t, { f0: 660, dur: .13, gain: .22 }); this.tone(t + .13, { f0: 880, dur: .2, gain: .22 }); },
    mate(t) {
      [659.25, 523.25, 440, 329.63].forEach((f, i) => this.tone(t + i * .22, { type: 'triangle', f0: f, dur: .55, gain: .14, attack: .02 }));
      this.tone(t + .9, { f0: 65, f1: 35, dur: 1, gain: .5 });
    },
    promote(t) {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(t + i * .075, { f0: f, dur: .4, gain: .1 }));
      this.noise(t + .3, { type: 'highpass', f: 6000, dur: .5, gain: .05, attack: .1 });
    },
    thudBig(t) { this.tone(t, { f0: 110, f1: 45, dur: .5, gain: .6 }); this.noise(t, { type: 'lowpass', f: 320, dur: .25, gain: .4 }); },
    draw(t) { [392, 493.88, 587.33].forEach(f => this.tone(t, { type: 'triangle', f0: f, dur: 1, gain: .07, attack: .05 })); },
    start(t) { [392, 523.25, 659.25].forEach((f, i) => this.tone(t + i * .06, { type: 'triangle', f0: f, dur: .7, gain: .07, attack: .03 })); },
    tick(t) { this.tone(t, { type: 'square', f0: 1500, dur: .03, gain: .05 }); },
    flag(t) { this.tone(t, { type: 'square', f0: 440, dur: .3, gain: .12 }); this.tone(t + .32, { type: 'square', f0: 330, dur: .45, gain: .12 }); },
    click(t) { this.tone(t, { f0: 1200, dur: .03, gain: .06 }); },
  },
};

const PROMO_NAMES = { [E.QUEEN]: 'Dame', [E.ROOK]: 'Tour', [E.BISHOP]: 'Fou', [E.KNIGHT]: 'Cavalier' };
const GLYPHS = { w: { [E.QUEEN]: '♕', [E.ROOK]: '♖', [E.BISHOP]: '♗', [E.KNIGHT]: '♘' }, b: { [E.QUEEN]: '♛', [E.ROOK]: '♜', [E.BISHOP]: '♝', [E.KNIGHT]: '♞' } };
const CLOCK_PRESETS = { none: null, blitz: { base: 3, inc: 2 }, rapid: { base: 10, inc: 5 } };

const fmtClock = ms => {
  ms = Math.max(0, ms);
  if (ms < 10000) return (ms / 1000).toFixed(1).replace('.', ',');
  const s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`;
};

const UI = {
  seats: {},
  init() {
    for (const c of ['w', 'b']) {
      const el = $(`.seat--${c}`);
      el.innerHTML = `
        <button class="icon-btn" data-act="menu" aria-label="Menu">${ICON.menu}</button>
        <span class="seat__token" aria-hidden="true"></span>
        <div class="seat__who"><span class="seat__name"></span><span class="seat__status" aria-live="polite"></span></div>
        <span class="seat__material"></span>
        <span class="seat__clock" hidden></span>
        <div class="seat__actions"></div>`;
      el.addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (b && !b.disabled) Game.onSeatAction(c, b.dataset.act, b);
      });
      this.seats[c] = el;
    }
    this.stage = $('#stage');
    this.layer = document.createElement('div');
    this.layer.className = 'sheet-layer';
    this.stage.appendChild(this.layer);
    this.toastEl = document.createElement('div');
    this.toastEl.className = 'toast';
    this.stage.appendChild(this.toastEl);
    this.buildHistory();
    document.addEventListener('pointerdown', e => {
      if (this.menuEl && !this.menuEl.contains(e.target) && !e.target.closest('[data-act="menu"]')) this.closeMenu();
    });
  },

  /* ---------- Sièges ---------- */
  setSeat(c, { name, status, turn, check, material, actions }) {
    const el = this.seats[c];
    el.querySelector('.seat__name').textContent = name;
    el.querySelector('.seat__status').textContent = status;
    el.querySelector('.seat__material').textContent = material > 0 ? `+${material}` : '';
    el.classList.toggle('is-turn', !!turn);
    el.classList.toggle('is-check', !!check);
    const box = el.querySelector('.seat__actions');
    const html = actions.map(a =>
      `<button class="btn ${a.cls || ''}" data-act="${a.act}" ${a.disabled ? 'disabled' : ''} aria-label="${a.label}">${a.icon ? ICON[a.icon] : ''}<span class="lbl">${a.label}</span></button>`).join('');
    if (box._html !== html) { box._html = html; box.innerHTML = html; }
  },
  setClock(c, ms, { show, running, low }) {
    const el = this.seats[c].querySelector('.seat__clock');
    el.hidden = !show;
    if (!show) return;
    const txt = fmtClock(ms);
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('is-running', !!running);
    el.classList.toggle('is-low', !!low);
  },

  /* ---------- Feuilles ---------- */
  clearSheet() { this.layer.innerHTML = ''; },
  sheet(html, { flipped = false, cls = '' } = {}) {
    this.layer.innerHTML = `<div class="sheet ${cls} ${flipped ? 'is-flipped' : ''}" role="dialog">${html}</div>`;
    return this.layer.firstElementChild;
  },

  promotion(color) {
    return new Promise(resolve => {
      const vs = '\uFE0E';
      const choices = [E.QUEEN, E.ROOK, E.BISHOP, E.KNIGHT].map(t =>
        `<button data-t="${t}"><span class="glyph" aria-hidden="true">${GLYPHS[color][t]}${vs}</span><span class="name">${PROMO_NAMES[t]}</span></button>`).join('');
      const el = this.sheet(`<div class="promo"><h2>Promotion</h2><div class="choices">${choices}</div><button class="link">Annuler</button></div>`, { flipped: color === 'b' });
      el.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        this.clearSheet();
        resolve(b.classList.contains('link') ? null : +b.dataset.t);
      });
      el.querySelector('button').focus();
    });
  },

  gameOver({ title, text }, handlers) {
    const el = this.sheet(`
      <div class="mirror" aria-hidden="true"><h2>${title}</h2><p>${text}</p></div>
      <h2>${title}</h2><p>${text}</p>
      <div class="row">
        <button class="btn btn--primary btn--wide" data-k="coach">Analyser la partie avec le coach</button>
      </div>
      <div class="row row--tight">
        <button class="btn" data-k="close">Voir le plateau</button>
        <button class="btn" data-k="new">Nouvelle partie</button>
      </div>`, { cls: 'sheet--result' });
    if (!handlers.canAnalyse) el.querySelector('[data-k="coach"]').disabled = true;
    el.addEventListener('click', e => {
      const b = e.target.closest('button[data-k]');
      if (!b || b.disabled) return;
      this.clearSheet();
      handlers[b.dataset.k]();
    });
  },
  resultPill(onOpen) {
    const b = document.createElement('button');
    b.className = 'btn btn--primary pill';
    b.textContent = 'Afficher le résultat';
    b.addEventListener('click', () => { b.remove(); onOpen(); });
    this.layer.innerHTML = '';
    this.layer.appendChild(b);
  },

  /* ---------- Menu d'un siège ---------- */
  openMenu(color, items) {
    this.closeMenu();
    const m = this.menuEl = document.createElement('div');
    m.className = 'menu' + (color === 'b' ? ' is-flipped' : '');
    m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' :
      `<button data-i="${i}" ${it.disabled ? 'disabled' : ''}>${it.label}${it.hint ? `<span class="hint">${it.hint}</span>` : ''}</button>`).join('');
    if (color === 'w') { m.style.left = '12px'; m.style.bottom = '10px'; }
    else { m.style.right = '12px'; m.style.top = '10px'; }
    m.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const it = items[+b.dataset.i];
      if (it.confirm && !b.dataset.armed) {
        b.dataset.armed = '1';
        b.innerHTML = `${it.confirm}<span class="hint">Touche à nouveau pour confirmer</span>`;
        return;
      }
      this.closeMenu();
      it.run();
    });
    this.stage.appendChild(m);
    m.querySelector('button:not([disabled])')?.focus();
  },
  closeMenu() { if (this.menuEl) { this.menuEl.remove(); this.menuEl = null; } },

  toast(msg, ms = 2600) {
    const t = this.toastEl;
    t.textContent = msg;
    t.classList.add('is-on');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('is-on'), ms);
  },

  /* ---------- Historique (panneau latéral repliable) ---------- */
  buildHistory() {
