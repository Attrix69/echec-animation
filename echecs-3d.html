const fmtClock = ms => {
  ms = Math.max(0, ms);
  if (ms < 10000) return (ms / 1000).toFixed(1).replace('.', ',');
  const s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`;
};

    el.querySelector('.seat__status').textContent = status;

    if (box._html !== html) { box._html = html; box.innerHTML = html; }
  },
  // Pièces prises par chaque camp (glyphes, de la plus forte à la plus faible)
  setCaptured(captured) {
    for (const c of ['w', 'b']) {
      const el = this.seats[c] && this.seats[c].querySelector('.seat__caps');
      if (!el) continue;
      const list = [...(captured[c] || [])].sort((a, b) => (b & E.TYPE) - (a & E.TYPE));
      const txt = list.map(p => CAP_GLYPHS[colorOf(p)][p & E.TYPE]).join('') ;
      if (el.textContent !== txt) el.textContent = txt;
    }
  },
  // Passage de tour : balayage lumineux sur le siège du joueur qui doit jouer
  turnEnter(c) {
    const el = this.seats[c];
    if (!el || REDUCED_MOTION) return;
    el.classList.remove('is-turn-enter');
    void el.offsetWidth;
    el.classList.add('is-turn-enter');
    clearTimeout(el._te);
    el._te = setTimeout(() => el.classList.remove('is-turn-enter'), 1000);
  },
  setClock(c, ms, { show, running, low }) {
    const el = this.seats[c].querySelector('.seat__clock');
    el.hidden = !show;
    if (!show) return;
    const txt = fmtClock(ms);
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('is-running', !!running);
    el.classList.toggle('is-low', !!low);
  },

  /* ---------- Feuilles ---------- */
  clearSheet() { this.layer.innerHTML = ''; },

  promotion(color) {

  /* ---------- Menu d'un siège ---------- */
  openMenu(color, items) {
    this.closeMenu();
    const m = this.menuEl = document.createElement('div');
    m.className = 'menu' + (color === 'b' ? ' is-flipped' : '');
    m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' :
      `<button data-i="${i}" ${it.disabled ? 'disabled' : ''}>${it.label}${it.hint ? `<span class="hint">${it.hint}</span>` : ''}</button>`).join('');
    if (color === 'w') { m.style.left = '12px'; m.style.bottom = '10px'; }

    m.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;

      if (it.confirm && !b.dataset.armed) {
        b.dataset.armed = '1';
        b.innerHTML = `${it.confirm}<span class="hint">Touche à nouveau pour confirmer</span>`;

      this.closeMenu();

    m.querySelector('button:not([disabled])')?.focus();

  closeMenu() { if (this.menuEl) { this.menuEl.remove(); this.menuEl = null; } },

  toast(msg, ms = 2600) {
    const t = this.toastEl;

    t.classList.add('is-on');

  /* ---------- Historique (panneau latéral repliable) ---------- */
  buildHistory() {
    const tab = this.histTab = document.createElement('button');
    tab.className = 'history-tab';
    tab.setAttribute('aria-label', 'Afficher l’historique des coups');
    tab.innerHTML = ICON.list;
    tab.addEventListener('click', () => this.toggleHistory());
    const p = this.histEl = document.createElement('aside');
    p.className = 'history';
    p.innerHTML = `
      <header><h3>Coups joués</h3>
        <button class="icon-btn" data-h="pgn" aria-label="Copier la partie (PGN)">${ICON.copy}</button>
        <button class="icon-btn" data-h="close" aria-label="Fermer l’historique">${ICON.close}</button></header>
      <ol class="history__list"></ol>
      <p class="history__empty">Aucun coup pour l’instant.</p>`;
    p.addEventListener('click', e => {
      const b = e.target.closest('[data-h]');
      if (!b) return;
      if (b.dataset.h === 'close') this.toggleHistory(false);
      if (b.dataset.h === 'pgn') Game.copyPgn();
    });
    this.stage.append(tab, p);
  },
  toggleHistory(force) {
    const open = force == null ? !this.histEl.classList.contains('is-open') : force;
    this.histEl.classList.toggle('is-open', open);
    this.histTab.classList.toggle('is-hidden', open);
    if (open) this.renderHistory(Game.game);
  },
  renderHistory(g) {
    if (!this.histEl.classList.contains('is-open')) return;
    const list = this.histEl.querySelector('.history__list');
    const startBlack = g.startFen.split(' ')[1] === 'b';
    let n = parseInt(g.startFen.split(' ')[5] || '1', 10), html = '', row = null;
    g.history.forEach((h, i) => {
      const white = startBlack ? i % 2 === 1 : i % 2 === 0;
      const cur = i === g.history.length - 1 ? ' is-current' : '';
      if (white || i === 0) { if (row) html += row + '</li>'; row = `<li><span class="num">${n}.</span>${white ? '' : '<span class="mv">…</span>'}`; }
      row += `<span class="mv${cur}">${escapeHtml(sanFr(h.san))}</span>`;
      if (!white) n++;
    });
    if (row) html += row + '</li>';
    list.innerHTML = html;
    this.histEl.querySelector('.history__empty').hidden = g.history.length > 0;
    list.scrollTop = list.scrollHeight;
  },

    el.addEventListener('click', e => {

        Settings.clock.base = clamp(parseFloat($('#cBase').value) || 10, 1, 180);
        Settings.clock.inc = clamp(parseInt($('#cInc').value, 10) || 0, 0, 60);
        Settings.flipBlack = $('#flipB').checked;
        saveSettings();
        View.refreshFacing();
        close({ resume: false });
      };
      w.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') w.querySelector('[data-w="start"]').click(); };
    });
  },
};

/* =====================================================================
   COACH — analyse Stockfish, classification des coups, explications
   ===================================================================== */
const SF_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/';

/* ---------- Stockfish dans un Web Worker (Blob + importScripts) ---------- */
const Stockfish = {
  worker: null, ready: null, handler: null,
  start() {
    if (!this.ready) {
      this.ready = (async () => {
        if (typeof WebAssembly === 'object' && await this.boot('wasm')) return true;
        if (await this.boot('asm')) return true;
        this.ready = null;
        throw new Error('Stockfish indisponible');
      })();
    }
    return this.ready;
  },
  boot(kind) {
    return new Promise(resolve => {
      // La version WebAssembly cherche « stockfish.wasm » à côté du script : on redirige vers cdnjs.
      const code = kind === 'wasm'
        ? `var BASE=${JSON.stringify(SF_BASE)};var _f=self.fetch.bind(self);` +
          `self.fetch=function(u,o){var s=String(u);if(s.indexOf('stockfish.wasm')>=0&&s.indexOf(BASE)!==0)u=BASE+'stockfish.wasm';return _f(u,o);};` +
          `importScripts(BASE+'stockfish.wasm.js');`
        : `importScripts(${JSON.stringify(SF_BASE + 'stockfish.js')});`;
      let w;
      try { w = new Worker(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))); }
      catch (e) { resolve(false); return; }
      const timer = setTimeout(() => { w.terminate(); resolve(false); }, kind === 'wasm' ? 10000 : 20000);
      w.onmessage = e => {
        if (String(e.data).indexOf('uciok') === 0) {
          clearTimeout(timer);
          this.worker = w; this.kind = kind;
          w.onmessage = ev => this.handler && this.handler(String(ev.data));
          w.postMessage('setoption name Hash value 32');
          w.postMessage('ucinewgame');
          resolve(true);
        }
      };
      w.onerror = () => { clearTimeout(timer); w.terminate(); resolve(false); };
      w.postMessage('uci');
    });
  },
  analyse(fen, opts) {
    const run = () => this._analyse(fen, opts || {});
    this.queue = (this.queue || Promise.resolve()).then(run, run);
    return this.queue;
  },
  _analyse(fen, { movetime = 900, depth = 16, searchmoves = '' }) {
    return new Promise(resolve => {
      let last = null;
      const guard = setTimeout(() => this.worker.postMessage('stop'), movetime + 6000);
      this.handler = line => {
        if (line.indexOf('info') === 0 && line.indexOf(' pv ') > 0 && line.indexOf(' score ') > 0) {
          if (/ (lowerbound|upperbound)/.test(line) && last) return;
          const cp = / score cp (-?\d+)/.exec(line), mt = / score mate (-?\d+)/.exec(line), d = / depth (\d+)/.exec(line);
          last = { depth: d ? +d[1] : 0, cp: cp ? +cp[1] : null, mate: mt ? +mt[1] : null, pv: line.split(' pv ')[1].trim().split(/\s+/) };
        } else if (line.indexOf('bestmove') === 0) {
          clearTimeout(guard);
          this.handler = null;
          const best = line.split(/\s+/)[1];
          const r = last || { cp: 0, mate: null, pv: [], depth: 0 };
          resolve({ ...r, best: best && best !== '(none)' ? best : r.pv[0] });
        }
      };
      this.worker.postMessage('position fen ' + fen);
      this.worker.postMessage(`go depth ${depth} movetime ${movetime}${searchmoves ? ' searchmoves ' + searchmoves : ''}`);
    });
  },
  stop() { if (this.worker) this.worker.postMessage('stop'); },
};

/* ---------- Catégories ---------- */
const CATS = {
  brilliant: { label: 'Coup brillant', plural: 'Coups brillants', icon: '!!', color: '#2fbfa8' },
  best: { label: 'Meilleur coup', plural: 'Meilleurs coups', icon: '★', color: '#86b845' },
  good: { label: 'Bon coup', plural: 'Bons coups', icon: '✓', color: '#9db8a4' },
  inaccuracy: { label: 'Imprécision', plural: 'Imprécisions', icon: '?!', color: '#e2b340' },
  mistake: { label: 'Erreur', plural: 'Erreurs', icon: '?', color: '#e3843a' },
  blunder: { label: 'Gaffe', plural: 'Gaffes', icon: '??', color: '#e0493d' },
  missedMate: { label: 'Mat manqué', plural: 'Mats manqués', icon: '#?', color: '#c45fae' },
};
const CAT_ORDER = ['brilliant', 'best', 'good', 'inaccuracy', 'mistake', 'blunder', 'missedMate'];
const ERROR_CATS = new Set(['inaccuracy', 'mistake', 'blunder', 'missedMate']);

/* ---------- Outils d'analyse de position ---------- */
const Tactics = {
  D: { N: [33, 31, 18, 14, -14, -18, -31, -33], K: [1, -1, 16, -16, 15, 17, -15, -17], B: [15, 17, -15, -17], R: [1, -1, 16, -16] },
  attacks(pos, sq) {
    const p = pos.board[sq], t = p & E.TYPE, out = [], D = this.D;
    if (t === E.PAWN) { const d = p & E.COLOR ? -16 : 16; for (const s of [sq + d - 1, sq + d + 1]) if (E.onBoard(s)) out.push(s); return out; }
    if (t === E.KNIGHT || t === E.KING) { for (const d of t === E.KNIGHT ? D.N : D.K) if (E.onBoard(sq + d)) out.push(sq + d); return out; }
    for (const d of t === E.BISHOP ? D.B : t === E.ROOK ? D.R : D.K) {
      let s = sq + d;
      while (E.onBoard(s)) { out.push(s); if (pos.board[s]) break; s += d; }
    }
    return out;
  },
  // Attaque double / fourchette depuis sq
  double(pos, sq) {
    const p = pos.board[sq];
    if (!p) return null;
    const enemy = (p & E.COLOR) ^ E.COLOR, val = VALUES[p & E.TYPE] || 0, targets = [];
    for (const t of this.attacks(pos, sq)) {
      const q = pos.board[t];
      if (!q || (q & E.COLOR) !== enemy) continue;
      const tt = q & E.TYPE;
      if (tt === E.PAWN) continue;
      if (tt === E.KING || VALUES[tt] > val || !pos.attacked(t, enemy)) targets.push({ sq: t, type: tt });
    }
    if (targets.length < 2) return null;
    const w = t => (t.type === E.KING ? 99 : VALUES[t.type]);
    return targets.sort((a, b) => w(b) - w(a)).slice(0, 2);
  },
  // Clouage / enfilade depuis une pièce à longue portée
  line(pos, sq) {
    const p = pos.board[sq], t = p & E.TYPE;
    if (t !== E.BISHOP && t !== E.ROOK && t !== E.QUEEN) return null;
    const enemy = (p & E.COLOR) ^ E.COLOR, D = this.D;
    let best = null;
    for (const d of t === E.BISHOP ? D.B : t === E.ROOK ? D.R : D.K) {
      let s = sq + d, first = null;
      while (E.onBoard(s)) {
        const q = pos.board[s];
        if (q) {
          if (!first) { if ((q & E.COLOR) !== enemy) break; first = { sq: s, type: q & E.TYPE }; }
          else {
            if ((q & E.COLOR) === enemy) {
              const second = { sq: s, type: q & E.TYPE };
              const v1 = first.type === E.KING ? 99 : VALUES[first.type], v2 = second.type === E.KING ? 99 : VALUES[second.type];
              let r = null;
              if (first.type !== E.KING && v2 > v1 && (second.type === E.KING || v2 >= 5)) r = { kind: 'pin', a: first, b: second, score: v2 };
              else if (v1 > v2 && v2 >= 3) r = { kind: 'skewer', a: first, b: second, score: v1 + v2 };
              if (r && (!best || r.score > best.score)) best = r;
            }
            break;
          }
        }
        s += d;
      }
    }
    return best;
  },
  passed(pos, sq) {
    const p = pos.board[sq];
    if ((p & E.TYPE) !== E.PAWN) return false;
    const c = p & E.COLOR, dir = c ? -16 : 16, f = E.fileOf(sq);
    for (let s = sq + dir; E.onBoard(s); s += dir) {
      for (const df of [-1, 0, 1]) {
        const x = s + df;
        if (E.fileOf(s) + df < 0 || E.fileOf(s) + df > 7) continue;
        if (pos.board[x] === (E.PAWN | (c ^ E.COLOR))) return false;
      }
    }
    return f >= 0;
  },
  find(pos, u) { return pos.legalMoves().find(m => uci(m) === u); },
  // Joue une ligne (UCI) et relève les prises, du point de vue du camp au trait
  line_(fen, ucis, max) {
    const pos = new E.Position(fen), me = pos.turn, events = [];
    let net = 0;
    for (let i = 0; i < Math.min(max, ucis.length); i++) {
      const m = this.find(pos, ucis[i]);
      if (!m) break;
      const mine = pos.turn === me;
      if (m.flags & E.F_CAPTURE) { const v = VALUES[m.captured & E.TYPE]; net += mine ? v : -v; events.push({ ply: i, mine, type: m.captured & E.TYPE, sq: m.flags & E.F_EP ? m.to + (mine === (me === E.WHITE) ? -16 : 16) : m.to }); }
      if (m.promo) { const v = VALUES[m.promo & E.TYPE] - 1; net += mine ? v : -v; }
      pos.make(m);
    }
    return { net, events, pos };
  },
  sanLine(fen, ucis, max = 4) {
    const g = new E.Game(fen), out = [];
    for (const u of ucis.slice(0, max)) {
      const m = g.legalMoves().find(x => uci(x) === u);
      if (!m) break;
      out.push(sanFr(g.san(m)));
      g.play(m);
    }
    return out;
  },
  // Sacrifice : après le coup, l'adversaire gagne du matériel par une prise simple
  sacrifice(fen, move) {
    const pos = new E.Position(fen), me = pos.turn;
    const gain = (move.flags & E.F_CAPTURE ? VALUES[move.captured & E.TYPE] : 0) + (move.promo ? VALUES[move.promo & E.TYPE] - 1 : 0);
    pos.make(move);
    if (pos.legalMoves().length === 0) return false;
    let opp = 0;
    for (const m of pos.legalMoves()) {
      if (!(m.flags & E.F_CAPTURE)) continue;
      const v = VALUES[m.captured & E.TYPE];
      pos.make(m);
      const defended = pos.attacked(m.to, me);
      pos.unmake();
      opp = Math.max(opp, v - (defended ? VALUES[m.piece & E.TYPE] : 0));
    }
    return opp >= 2 && gain - opp <= -2;
  },
};

/* ---------- Mise en mots ---------- */
const Words = {
  the: t => ({ 1: 'le pion', 2: 'le cavalier', 3: 'le fou', 4: 'la tour', 5: 'la dame', 6: 'le roi' }[t]),
  your: t => ((t === 4 || t === 5) ? 'ta ' : 'ton ') + PIECE_NAME[t],
  his: t => ((t === 4 || t === 5) ? 'sa ' : 'son ') + PIECE_NAME[t],
  a: t => ((t === 4 || t === 5) ? 'une ' : 'un ') + PIECE_NAME[t],
  list: arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' et ' + arr[arr.length - 1] : arr[0] || '',
  sq: s => E.sqName(s),
  evalW(cp, mate) {
    if (mate != null) return mate === 0 ? '#' : (mate > 0 ? '+M' : '−M') + Math.abs(mate);
    const v = cp / 100;
    return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',');
  },
  lost(events) {
    const lost = events.filter(e => !e.mine).map(e => e.type).sort((a, b) => VALUES[b] - VALUES[a]);
    const won = events.filter(e => e.mine).map(e => e.type).sort((a, b) => VALUES[b] - VALUES[a]);
    if (!lost.length) return '';
    return `tu perds ${this.a(lost[0])}${lost.length > 1 && VALUES[lost[1]] >= 1 && lost[0] !== lost[1] ? ' et ' + this.a(lost[1]) : ''}${won.length ? ' pour ' + this.a(won[0]) : ''}`;
  },
};

const winPct = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);

const Coach = {
  data: null, ply: 0, filter: 'all', tab: 'summary', busy: false, cancelled: false, claude: false,

  /* ---------- Cycle de vie ---------- */
  async open(game, names) {
    const reuse = this.data && this.game === game && this.dataLen === game.history.length;
    this.game = game; this.names = names;
    this.cancelled = false;
    const token = this.token = {};
    Game.mode = 'coach';
    $('#app').classList.add('coach-mode');
    this.panel = $('#coach');
    this.panel.hidden = false;
    this.renderShell();
    View.resize();
    if (reuse) { this.renderAll(); this.setPly(this.ply); return; }
    this.data = null; this.ply = 0; this.filter = 'all'; this.tab = 'summary';
    this.setProgress(0, 1, 'Chargement du moteur d’analyse…');
    try { await Stockfish.start(); }
    catch (e) {
      this.setProgress(0, 1, '');
      this.panel.querySelector('.coach__progress').innerHTML = `<p class="warn">Le moteur d’analyse n’a pas pu être chargé. Vérifie ta connexion internet, puis relance l’analyse.</p><div class="row"><button class="btn" data-c="retry">Réessayer</button><button class="btn" data-c="close">Revenir à la partie</button></div>`;
      return;
    }
    if (token !== this.token) return;
    const ok = await this.analyse(token);
    if (!ok || token !== this.token) return;
    this.dataLen = game.history.length;
    this.probeClaude();
    this.renderAll();
    this.setPly(0);
  },
  async close() {
    if (this.closing) return;
    this.closing = true;
    this.cancelled = true;
    this.token = null;
    Stockfish.stop();
    await this.stopLine();
    if (this.animating) { Tweens.boost = 40; while (this.animating) await Tweens.delay(16); Tweens.boost = 1; }
    this.closing = false;
    $('#app').classList.remove('coach-mode');
    this.panel.hidden = true;
    View.setArrows([]);
    Game.backFromCoach();
  },

  /* ---------- Analyse ---------- */
  async analyse(token) {
    const g = this.game, fens = [], moves = [];
    const pos = new E.Position(g.startFen);
    for (const h of g.history) { fens.push(pos.fen()); moves.push(h); pos.make(h.move); }
    fens.push(pos.fen());
    const evals = [], pevals = [];
    const N = fens.length;
    for (let i = 0; i < N; i++) {
      if (this.cancelled || token !== this.token) return false;
      this.setProgress(i, N, `Analyse de la position ${i + 1} sur ${N}`);
      const p = new E.Position(fens[i]);
      const turn = p.turn === E.WHITE ? 'w' : 'b', s = turn === 'w' ? 1 : -1;
      if (!p.legalMoves().length) {
        evals.push(p.inCheck() ? { cp: null, mate: 0, mated: turn, pv: [], best: null } : { cp: 0, mate: null, pv: [], best: null, terminal: true });
        continue;
      }
      const r = await Stockfish.analyse(fens[i], { movetime: 900, depth: 16 });
      evals.push({ cp: r.cp == null ? null : s * r.cp, mate: r.mate == null ? null : s * r.mate, pv: r.pv, best: r.best, depth: r.depth });
      // Valeur du coup réellement joué, mesurée depuis la même position (comparaison cohérente avec le meilleur coup)
      if (i < moves.length) {
        const played = uci(moves[i].move);
        if (played !== r.best && !this.cancelled && token === this.token) {
          const q = await Stockfish.analyse(fens[i], { movetime: 650, depth: Math.max(12, r.depth || 12), searchmoves: played });
          if (q.pv && q.pv[0] === played) pevals[i] = { cp: q.cp == null ? null : s * q.cp, mate: q.mate == null ? null : s * q.mate, pv: q.pv.slice(1), best: q.pv[1] || null };
        }
      }
    }
    if (this.cancelled || token !== this.token) return false;
    this.setProgress(N, N, 'Analyse terminée');
    this.data = this.classify(fens, moves, evals, pevals);
    return true;
  },

  cpOf(ev) {
    if (ev.mate != null) {
      if (ev.mate === 0) return ev.mated === 'w' ? -1100 : 1100;
      return Math.sign(ev.mate) * (1100 - Math.min(Math.abs(ev.mate), 50) * 2);
    }
    return clamp(ev.cp || 0, -1000, 1000);
  },

  classify(fens, moves, evals, pevals = []) {
    const out = [];
    moves.forEach((h, i) => {
      const color = colorOf(h.move.piece), s = color === 'w' ? 1 : -1;
      const eb = evals[i], ea = pevals[i] || evals[i + 1];
      const played = uci(h.move), isBest = played === eb.best;
      // Coup du moteur : aucune perte (les écarts entre deux recherches ne sont que du bruit)
      const before = s * this.cpOf(eb), after = isBest && ea.mate == null && eb.mate == null ? before : s * this.cpOf(ea);
      const loss = isBest ? 0 : Math.max(0, before - after);
      const mateFor = ev => ev.mate != null && (ev.mate === 0 ? ev.mated !== color : Math.sign(ev.mate) === s);
      const mateAgainst = ev => ev.mate != null && ev.mate !== 0 && Math.sign(ev.mate) === -s;
      let cls;
      if (mateFor(eb) && !mateFor(ea) && !isBest) cls = 'missedMate';
      else if (isBest || loss <= 10) cls = 'best';
      else if (loss <= 50) cls = 'good';
      else if (loss <= 100) cls = 'inaccuracy';
      else if (loss <= 250) cls = 'mistake';
      else cls = 'blunder';
      if (cls === 'best' && after >= -50 && before < 700 && Tactics.sacrifice(fens[i], h.move)) cls = 'brilliant';
      const wb = winPct(before), wa = winPct(after);
      const acc = clamp(103.1668 * Math.exp(-0.04354 * Math.max(0, wb - wa)) - 3.1669, 0, 100);
      const g = new E.Game(fens[i]);
      const bm = eb.best && g.legalMoves().find(m => uci(m) === eb.best);
      out.push({
        i, color, san: h.san, sanFr: sanFr(h.san), uci: played, move: h.move,
        bestUci: eb.best, bestSanFr: bm ? sanFr(g.san(bm)) : null, bestMove: bm || null,
        before, after, loss, cls, winDrop: Math.max(0, wb - wa), acc,
        evB: eb, evA: ea, fen: fens[i], fenAfter: fens[i + 1],
        mateFor: mateFor(eb) ? Math.abs(eb.mate) : 0, mateAgainst: mateAgainst(ea) ? Math.abs(ea.mate) : 0,
        num: Math.floor(i / 2) + parseInt((fens[0].split(' ')[5] || '1'), 10) + (fens[0].split(' ')[1] === 'b' && i % 2 ? 1 : 0),
      });
    });
    out.forEach(m => { const t = this.explain(m); m.text = t.text; m.tip = t.tip; });
    const summary = {};
    for (const c of ['w', 'b']) {
      const mine = out.filter(m => m.color === c);
      const counts = Object.fromEntries(CAT_ORDER.map(k => [k, mine.filter(m => m.cls === k).length]));
      const acc = mine.length ? mine.reduce((a, m) => a + m.acc, 0) / mine.length : 100;
      const key = [...mine].filter(m => (ERROR_CATS.has(m.cls) && m.winDrop >= 4) || m.cls === 'brilliant' || m.cls === 'missedMate')
        .sort((a, b) => (b.cls === 'brilliant' ? 30 : b.winDrop) - (a.cls === 'brilliant' ? 30 : a.winDrop)).slice(0, 3);
      summary[c] = { counts, acc, key, n: mine.length };
    }
    return { moves: out, evals, fens, summary };
  },

  /* ---------- Explications par détection de motifs ---------- */
  explain(m) {
    const opp = 'ton adversaire';
    const played = m.sanFr, best = m.bestSanFr;
    const posAfter = new E.Position(m.fenAfter);
    const doublePlayed = !posAfter.legalMoves().length ? null : Tactics.double(posAfter, m.move.to);
    const linePlayed = Tactics.line(posAfter, m.move.to);
    const tips = [];

    // Pourquoi le meilleur coup était meilleur
    const bestReason = () => {
      if (!m.bestMove) return '';
      const pb = new E.Position(m.fen);
      pb.make(m.bestMove);
      if (pb.inCheck() && !pb.legalMoves().length) return 'qui matait immédiatement';
      if (m.mateFor) return `qui menait au mat en ${m.mateFor}`;
      const d = Tactics.double(pb, m.bestMove.to);
      if (d) return `qui attaquait ${Words.list(d.map(t => Words.the(t.type)))} en même temps (${(m.bestMove.piece & E.TYPE) === E.KNIGHT || (m.bestMove.piece & E.TYPE) === E.PAWN ? 'fourchette' : 'attaque double'})`;
      const l = Tactics.line(pb, m.bestMove.to);
      if (l && l.kind === 'pin') return `qui clouait ${Words.the(l.a.type)} ${l.b.type === E.KING ? 'contre le roi' : 'devant ' + Words.the(l.b.type)}`;
      if (l && l.kind === 'skewer') return `qui attaquait ${Words.the(l.a.type)} et, derrière, ${Words.the(l.b.type)} (enfilade)`;
      const gain = Tactics.line_(m.fen, m.evB.pv || [], 5);
      if (gain.net >= 2) { const w = gain.events.filter(e => e.mine).sort((a, b) => VALUES[b.type] - VALUES[a.type])[0]; if (w) return `qui gagnait ${Words.a(w.type)}`; }
      if (m.bestMove.flags & (E.F_KCASTLE | E.F_QCASTLE)) return 'qui mettait ton roi à l’abri';
      const pb0 = new E.Position(m.fen);
      if ((m.bestMove.piece & E.TYPE) === E.PAWN && Tactics.passed(pb0, m.bestMove.from)) return 'qui faisait avancer ton pion passé';
      const home = m.color === 'w' ? 0 : 7;
      if (m.i < 24 && [E.KNIGHT, E.BISHOP].includes(m.bestMove.piece & E.TYPE) && E.rankOf(m.bestMove.from) === home) return `qui développait ${Words.your(m.bestMove.piece & E.TYPE)}`;
      if (m.bestMove.flags & E.F_CAPTURE) return `qui prenait ${Words.the(m.bestMove.captured & E.TYPE)} adverse`;
      return m.before > 150 ? 'qui gardait ton avantage' : m.before < -150 ? 'qui limitait les dégâts' : 'qui gardait l’équilibre';
    };

    // Bonnes nouvelles
    if (m.cls === 'brilliant') {
      const line = Tactics.sanLine(m.fen, m.evB.pv || [], 4);
      return { text: `Coup brillant ! Tu offres du matériel avec ${played}, mais c’est bien le meilleur coup${line.length > 1 ? ` : la suite ${line.join(' ')} te donne l’initiative` : ''}.`, tip: '' };
    }
    if (m.cls === 'best' || m.cls === 'good') {
      if (posAfter.inCheck() && !posAfter.legalMoves().length) return { text: `${played} : échec et mat, bravo !`, tip: '' };
      const intro = m.cls === 'best' ? `${played} est ${m.uci === m.bestUci ? 'exactement le coup du moteur' : 'aussi fort que le choix du moteur'}.` : `${played} est un bon coup${best ? ` ; le moteur préférait de peu ${best}` : ''}.`;
      let extra = '';
      if (doublePlayed) extra = ` Tu attaques ${Words.list(doublePlayed.map(t => Words.the(t.type)))} en même temps.`;
      else if (linePlayed && linePlayed.kind === 'pin') extra = ` Tu cloues ${Words.the(linePlayed.a.type)} adverse.`;
      else if (m.move.flags & (E.F_KCASTLE | E.F_QCASTLE)) extra = ' Ton roi est à l’abri et ta tour entre en jeu.';
      else if (m.move.flags & E.F_CAPTURE) extra = ` Tu prends ${Words.the(m.move.captured & E.TYPE)} au bon moment.`;
      return { text: intro + extra, tip: '' };
    }

    // Erreurs
    const parts = [`Tu as joué ${played}.`];
    if (m.cls === 'missedMate') {
      const line = Tactics.sanLine(m.fen, m.evB.pv || [], Math.min(7, m.mateFor * 2 - 1));
      parts.push(`Tu avais un mat en ${m.mateFor} : ${line.join(' ')}.`);
      tips.push('Quand le roi adverse est exposé, regarde d’abord tous les échecs possibles.');
    } else if (best) {
      const r = bestReason();
      parts.push(`Mieux : ${best}${r ? ', ' + r : ''}.`);
    }
    // Conséquence du coup joué
    const reply = (m.evA.pv || [])[0];
    const replySan = reply ? Tactics.sanLine(m.fenAfter, [reply], 1)[0] : null;
    if (m.mateAgainst) {
      parts.push(`Après ton coup, ${opp} a un mat en ${m.mateAgainst}${replySan ? `, qui commence par ${replySan}` : ''}.`);
      tips.push('Avant de jouer, vérifie les échecs que ton adversaire pourrait donner.');
    } else {
      const seq = Tactics.line_(m.fen, [m.uci, ...(m.evA.pv || [])], 5);
      const lostTxt = Words.lost(seq.events);
      let said = false;
      if (seq.net <= -2 && lostTxt) {
        parts.push(`Après ton coup, ${opp} peut jouer ${replySan || 'la bonne réponse'} et ${lostTxt}.`);
        const firstLoss = seq.events.find(e => !e.mine);
        if (firstLoss && firstLoss.ply === 1) tips.push('Réflexe à prendre : avant chaque coup, regarde quelles pièces ton adversaire peut capturer.');
        said = true;
      }
      if (reply) {
        const pr = new E.Position(m.fenAfter), rm = Tactics.find(pr, reply);
        if (rm) {
          pr.make(rm);
          const d = Tactics.double(pr, rm.to);
          if (d && !said) { parts.push(`${replySan} ferait une ${(rm.piece & E.TYPE) === E.KNIGHT ? 'fourchette' : 'attaque double'} sur ${Words.list(d.map(t => Words.your(t.type)))}.`); tips.push('Repère les cases d’où une pièce adverse attaquerait deux de tes pièces à la fois.'); said = true; }
          const l = !said && Tactics.line(pr, rm.to);
          if (l) { parts.push(l.kind === 'pin' ? `${replySan} cloue ${Words.your(l.a.type)} ${l.b.type === E.KING ? 'contre ton roi' : 'devant ' + Words.your(l.b.type)}.` : `${replySan} attaque ${Words.your(l.a.type)} puis ${Words.your(l.b.type)} derrière (enfilade).`); said = true; }
        }
      }
      // Roque perdu, roi exposé, pièce mal placée
      const pb = new E.Position(m.fen);
      const rights = c => c === 'w' ? pb.castling & 3 : pb.castling & 12;
      const pa = new E.Position(m.fenAfter);
      const rightsA = m.color === 'w' ? pa.castling & 3 : pa.castling & 12;
      const type = m.move.piece & E.TYPE;
      if (!said && rights(m.color) && !rightsA && !(m.move.flags & (E.F_KCASTLE | E.F_QCASTLE))) {
        parts.push('Ce coup te fait perdre le droit de roquer.');
        tips.push('Roquer tôt met ton roi en sécurité et active ta tour.');
        said = true;
      }
      const k = pb.king[m.color === 'w' ? 0 : 1];
      if (!said && type === E.PAWN && Math.abs(E.fileOf(m.move.from) - E.fileOf(k)) <= 1 && Math.abs(E.rankOf(m.move.from) - E.rankOf(k)) <= 2 && (E.fileOf(k) >= 5 || E.fileOf(k) <= 2)) {
        parts.push('Ce coup de pion affaiblit l’abri de ton roi, qui devient plus exposé.');
        said = true;
      }
      if (!said && type === E.KNIGHT && (E.fileOf(m.move.to) === 0 || E.fileOf(m.move.to) === 7)) {
        parts.push('Un cavalier au bord de l’échiquier contrôle peu de cases.');
        said = true;
      }
      if (!said && m.bestMove && (m.bestMove.piece & E.TYPE) === E.PAWN && Tactics.passed(pb, m.bestMove.from) && type !== E.PAWN) {
        parts.push('Tu as laissé de côté ton pion passé, une vraie force en finale.');
        said = true;
      }
      if (!said && m.i < 20 && (type === E.QUEEN || type === E.KING || type === E.ROOK) && m.bestMove && [E.KNIGHT, E.BISHOP].includes(m.bestMove.piece & E.TYPE)) {
        parts.push('En début de partie, sors d’abord tes cavaliers et tes fous.');
        said = true;
      }
      if (!said) {
        const eb = Words.evalW(m.color === 'w' ? m.before : -m.before, null), ea = Words.evalW(m.color === 'w' ? m.after : -m.after, null);
        parts.push(m.cls === 'inaccuracy'
          ? `Rien de grave, mais tu laisses filer un peu d’avantage (${eb} → ${ea}).`
          : `L’évaluation passe de ${eb} à ${ea} : ${opp} prend le dessus.`);
      }
    }
    return { text: parts.join(' '), tip: tips[0] || '' };
  },

  /* ---------- Rendu du panneau ---------- */
  renderShell() {
    this.panel.innerHTML = `
      <header class="coach__head">
        <h2>Le coach</h2>
        <button class="btn" data-c="close">Quitter l’analyse</button>
      </header>
      <div class="coach__progress"><div class="bar"><span></span></div><p class="ptxt"></p><button class="link" data-c="close">Annuler</button></div>
      <div class="coach__body" hidden></div>`;
    this.panel.onclick = e => this.onClick(e);
  },
  setProgress(i, n, txt) {
    const p = this.panel.querySelector('.coach__progress');
    if (!p) return;
    const bar = p.querySelector('.bar span');
    if (bar) bar.style.width = `${Math.round(i / n * 100)}%`;
    const t = p.querySelector('.ptxt');
    if (t) t.textContent = txt;
  },
  renderAll() {
    this.panel.querySelector('.coach__progress').hidden = true;
    const body = this.panel.querySelector('.coach__body');
    body.hidden = false;
    body.innerHTML = `
      <div class="coach__graph" role="img" aria-label="Graphique d’évaluation de la partie"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="summary" aria-selected="${this.tab === 'summary'}">Bilan</button>
        <button role="tab" data-tab="review" aria-selected="${this.tab === 'review'}">Coup par coup</button>
      </div>
      <section class="tab tab--summary" ${this.tab === 'summary' ? '' : 'hidden'}></section>
      <section class="tab tab--review" ${this.tab === 'review' ? '' : 'hidden'}>
        <div class="coach__nav">
          <button class="icon-btn" data-nav="first" aria-label="Début">${ICON.first}</button>
          <button class="icon-btn" data-nav="prev" aria-label="Coup précédent">${ICON.prev}</button>
          <span class="navpos"></span>
          <button class="icon-btn" data-nav="next" aria-label="Coup suivant">${ICON.next}</button>
          <button class="icon-btn" data-nav="last" aria-label="Fin">${ICON.last}</button>
        </div>
        <div class="coach__card"></div>
        <div class="seg seg--wrap filter" role="radiogroup">
          <button role="radio" data-f="all">Tous les coups</button>
          <button role="radio" data-f="w">Erreurs des Blancs</button>
          <button role="radio" data-f="b">Erreurs des Noirs</button>
        </div>
        <ol class="coach__moves"></ol>
      </section>`;
    this.renderGraph();
    this.renderSummary();
    this.renderMoves();
    const graph = body.querySelector('.coach__graph');
    graph.addEventListener('click', e => {
      const r = graph.getBoundingClientRect();
      const p = Math.round((e.clientX - r.left) / r.width * this.data.moves.length);
      this.showTab('review');
      this.setPly(clamp(p, 0, this.data.moves.length));
    });
    this.bindSwipe(body.querySelector('.coach__card'));
  },
  renderGraph() {
    const d = this.data, N = d.moves.length, W = 1000, H = 120;
    const ys = d.evals.map(ev => H - winPct(this.cpOf(ev)) / 100 * H);
    const x = i => N ? i / N * W : 0;
    let path = `M0 ${H / 2}`;
    ys.forEach((y, i) => { path += ` L${x(i).toFixed(1)} ${y.toFixed(1)}`; });
    const area = `${path} L${W} ${H} L0 ${H} Z`;
    const marks = d.moves.filter(m => ['blunder', 'mistake', 'missedMate', 'brilliant'].includes(m.cls))
      .map(m => `<rect x="${(x(m.i + 1) - 4).toFixed(1)}" y="${m.cls === 'brilliant' ? 2 : H - 12}" width="8" height="10" rx="2" fill="${CATS[m.cls].color}"/>`).join('');
    this.panel.querySelector('.coach__graph').innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="100%">
        <rect width="${W}" height="${H}" fill="#1a1512"/>
        <path d="${area}" fill="#ece3cf" opacity=".92"/>
        <line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="#8a7a60" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="4 4"/>
        ${marks}
        <line class="cursor" x1="0" y1="0" x2="0" y2="${H}" stroke="var(--brass-hi)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>`;
  },
  badge(cls) { const c = CATS[cls]; return `<span class="badge" style="--c:${c.color}" title="${c.label}">${c.icon}</span>`; },
  renderSummary() {
    const s = this.data.summary;
    const card = c => {
      const S = s[c], name = this.names[c];
      const counts = CAT_ORDER.map(k => `<li>${this.badge(k)}<span>${CATS[k].plural}</span><b>${S.counts[k]}</b></li>`).join('');
      const key = S.key.length ? S.key.map(m => `<li><button data-ply="${m.i + 1}">${this.badge(m.cls)}<span>${m.num}${m.color === 'w' ? '.' : '…'} ${escapeHtml(m.sanFr)}</span><em>${CATS[m.cls].label.toLowerCase()}</em></button></li>`).join('')
        : '<li class="none">Aucun faux pas marquant.</li>';
      return `<article class="pcard pcard--${c}">
        <header><span class="seat__token"></span><strong>${escapeHtml(name)}</strong></header>
        <p class="acc"><b>${Math.round(S.acc)}</b><span>% de précision</span></p>
        <ul class="counts">${counts}</ul>
        <h4>Moments clés</h4><ol class="moments">${key}</ol>
      </article>`;
    };
    this.panel.querySelector('.tab--summary').innerHTML = `<div class="pcards">${card('w')}${card('b')}</div>
      <p class="coach__hint">Touche un moment clé ou le graphique pour revoir la position.</p>`;
  },
  visible(m) { return this.filter === 'all' || (m.color === this.filter && ERROR_CATS.has(m.cls)); },
  renderMoves() {
    const list = this.panel.querySelector('.coach__moves');
    const items = this.data.moves.filter(m => this.visible(m));
    const pad = this.filter === 'all' && items[0] && items[0].color === 'b' ? '<li aria-hidden="true"></li>' : '';
    list.innerHTML = items.length ? pad + items.map(m => `<li><button data-ply="${m.i + 1}" class="${m.i + 1 === this.ply ? 'is-current' : ''}">
        <span class="n">${m.num}${m.color === 'w' ? '.' : '…'}</span><span class="s">${escapeHtml(m.sanFr)}</span>${this.badge(m.cls)}</button></li>`).join('')
      : '<li class="none">Aucune erreur de ce camp. Bravo !</li>';
    $$('.filter button', this.panel).forEach(b => b.setAttribute('aria-checked', b.dataset.f === this.filter));
  },
  showTab(t) {
    this.tab = t;
    $$('.tabs [role="tab"]', this.panel).forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
    this.panel.querySelector('.tab--summary').hidden = t !== 'summary';
    this.panel.querySelector('.tab--review').hidden = t !== 'review';
  },
  renderCard() {
    const card = this.panel.querySelector('.coach__card');
    const N = this.data.moves.length;
    this.panel.querySelector('.navpos').textContent = this.ply ? `Coup ${this.ply} sur ${N}` : 'Position de départ';
    const cur = this.panel.querySelector('.cursor');
    if (cur) { const x = N ? this.ply / N * 1000 : 0; cur.setAttribute('x1', x); cur.setAttribute('x2', x); }
    $$('.coach__moves button', this.panel).forEach(b => b.classList.toggle('is-current', +b.dataset.ply === this.ply));
    if (!this.ply) { card.innerHTML = '<p class="expl">Avance coup par coup avec les flèches, ou touche un coup de la liste. La flèche rouge montre le coup joué, la verte le meilleur coup.</p>'; return; }
    const m = this.data.moves[this.ply - 1], c = CATS[m.cls];
    const evB = Words.evalW(m.evB.mate != null ? null : m.evB.cp, m.evB.mate), evA = Words.evalW(m.evA.mate != null ? null : m.evA.cp, m.evA.mate);
    const canLine = (m.evB.pv || []).length > 0 && m.cls !== 'best';
    card.innerHTML = `
      <div class="mv-head">${this.badge(m.cls)}
        <div class="mv-title"><strong>${m.num}${m.color === 'w' ? '.' : '…'} ${escapeHtml(m.sanFr)}</strong><span style="color:${c.color}">${c.label} ${m.color === 'w' ? 'des Blancs' : 'des Noirs'}</span></div>
        <span class="ev" title="Évaluation avant → après">${evB} → ${evA}</span></div>
      <p class="expl"><b>${escapeHtml(this.names[m.color])} :</b> ${escapeHtml(m.text)}</p>
      ${m.tip ? `<p class="tip">${escapeHtml(m.tip)}</p>` : ''}
      <p class="claude-out" hidden></p>
      <div class="row row--left">
        ${canLine ? `<button class="btn btn--small" data-c="line">${ICON.play}<span>Jouer la ligne suggérée</span></button>` : ''}
        <button class="btn btn--small" data-c="replay">Rejouer depuis ici</button>
        ${this.claude ? '<button class="btn btn--small" data-c="claude">Demander à Claude</button>' : ''}
      </div>`;
  },

  /* ---------- Navigation ---------- */
  captured(ply) {
    const cap = { w: [], b: [] };
    this.game.history.slice(0, ply).forEach(h => { if (h.move.flags & E.F_CAPTURE) cap[colorOf(h.move.piece)].push(h.move.captured); });
    return cap;
  },
  async setPly(p, animate = false) {
    await this.stopLine();
    if (this.animating) return;
    const N = this.data.moves.length;
    p = clamp(p, 0, N);
    if (animate && p === this.ply + 1 && !Tweens.off) {
      this.animating = true;
      const m = this.data.moves[p - 1];
      this.ply = p;
      View.setArrows([]);
      this.renderCard();
      const pos = new E.Position(m.fenAfter);
      await Fx.playMove(m.move, pos, { captured: this.captured(p) });
      this.animating = false;
    } else {
      this.ply = p;
      Fx.clearAll();
      View.sync(new E.Position(this.data.fens[p]));
      View.syncTrays(this.captured(p));
      this.renderCard();
    }
    this.paintBoard();
  },
  paintBoard() {
    const p = this.ply, pos = new E.Position(this.data.fens[p]);
    const m = p ? this.data.moves[p - 1] : null;
    View.setHighlights({ last: m ? { from: m.move.from, to: m.move.to } : null, check: pos.inCheck() ? pos.king[pos.turn >> 3] : -1 });
    const arrows = [];
    if (m) {
      if (m.bestMove && m.uci !== m.bestUci) arrows.push({ from: m.bestMove.from, to: m.bestMove.to, color: 0x5fc36a });
      arrows.push({ from: m.move.from, to: m.move.to, color: m.uci === m.bestUci || m.cls === 'best' || m.cls === 'brilliant' || m.cls === 'good' ? 0x5fc36a : 0xe0493d, opacity: .7 });
    }
    View.setArrows(arrows);
  },
  step(dir) {
    const N = this.data.moves.length;
    if (this.filter === 'all') { if (dir > 0) this.setPly(this.ply + 1, true); else this.setPly(this.ply - 1); return; }
    const plies = this.data.moves.filter(m => this.visible(m)).map(m => m.i + 1);
    const target = dir > 0 ? plies.find(x => x > this.ply) : [...plies].reverse().find(x => x < this.ply);
    if (target != null) this.setPly(target, target === this.ply + 1);
    else UI.toast(dir > 0 ? 'Plus d’erreur après ce coup' : 'Pas d’erreur avant ce coup');
    void N;
  },
  onKey(e) {
    if (Game.mode !== 'coach' || !this.data) return false;
    if (e.key === 'ArrowRight') this.step(1);
    else if (e.key === 'ArrowLeft') this.step(-1);
    else if (e.key === 'Home') this.setPly(0);
    else if (e.key === 'End') this.setPly(this.data.moves.length);
    else return false;
    e.preventDefault();
    return true;
  },
  bindSwipe(el) {
    let x0 = null;
    el.addEventListener('pointerdown', e => { x0 = e.clientX; });
    el.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) this.step(dx < 0 ? 1 : -1); });
  },

  /* ---------- Ligne suggérée ---------- */
  playLine() {
    if (this.lineActive || this.animating) return;
    this.linePromise = this.runLine();
    return this.linePromise;
  },
  async runLine() {
    const m = this.data.moves[this.ply - 1];
    if (!m) return;
    const pv = (m.evB.pv || []).slice(0, 4);
    this.lineActive = true;
    this.animating = true;
    const g = new E.Game(m.fen);
    View.sync(g.pos); View.syncTrays(this.captured(this.ply - 1));
    View.setArrows([]);
    const card = this.panel.querySelector('.coach__card');
    const bar = document.createElement('div');
    bar.className = 'line-bar';
    bar.innerHTML = `<span>Ligne suggérée : ${escapeHtml(Tactics.sanLine(m.fen, pv, 4).join(' '))}</span><button class="btn btn--small" data-c="back">Revenir à la partie</button>`;
    card.prepend(bar);
    const base = this.captured(this.ply - 1);
    for (const u of pv) {
      if (!this.lineActive) break;
      const mv = g.legalMoves().find(x => uci(x) === u);
      if (!mv) break;
      View.setArrows([{ from: mv.from, to: mv.to, color: 0x5fc36a, opacity: .55 }]);
      await Tweens.delay(250);
      const e = g.play(mv);
      if (mv.flags & E.F_CAPTURE) base[colorOf(mv.piece)].push(mv.captured);
      await Fx.playMove(e.move, g.pos, { captured: base });
      View.setHighlights({ last: { from: mv.from, to: mv.to }, check: g.inCheck() ? g.pos.king[g.pos.turn >> 3] : -1 });
      await Tweens.delay(350);
    }
    if (this.lineActive) View.setArrows([]);
    this.animating = false;
  },
  // Interrompt proprement la ligne suggérée (attend la fin du coup en cours, accéléré)
  async stopLine() {
    if (!this.lineActive) return;
    this.lineActive = false;
    Tweens.boost = 40;
    Tweens.finishAll();
    try { await this.linePromise; } catch (e) { /* ignore */ }
    Tweens.boost = 1;
    this.animating = false;
    const bar = this.panel && this.panel.querySelector('.line-bar');
    if (bar) bar.remove();
  },

  /* ---------- Claude (optionnel) ---------- */
  async probeClaude() {
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: 'Réponds seulement : OK' }] }),
      });
      this.claude = r.ok;
      if (this.claude && this.ply) this.renderCard();
    } catch (e) { this.claude = false; }
  },
  async askClaude() {
    const m = this.data.moves[this.ply - 1];
    const out = this.panel.querySelector('.claude-out');
    if (!m || !out) return;
    out.hidden = false;
    out.textContent = 'Claude réfléchit…';
    const prompt = `Tu es un coach d'échecs bienveillant pour des joueurs amateurs. Tutoie le joueur, écris en français simple, 3 phrases maximum, sans inventer de variantes autres que celles fournies.
Position avant le coup (FEN) : ${m.fen}
Camp qui joue : ${m.color === 'w' ? 'Blancs' : 'Noirs'}
Coup joué : ${m.sanFr} (catégorie : ${CATS[m.cls].label})
Meilleur coup selon Stockfish : ${m.bestSanFr || 'inconnu'}
Ligne principale du moteur : ${Tactics.sanLine(m.fen, m.evB.pv || [], 4).join(' ')}
Réponse forte de l'adversaire après le coup joué : ${Tactics.sanLine(m.fenAfter, m.evA.pv || [], 3).join(' ')}
Évaluation (centipions, point de vue du joueur) : avant ${m.before}, après ${m.after}
Explication automatique : ${m.text}
Explique l'idée principale à retenir de ce moment.`;
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] }),
      });
      const data = await r.json();
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
      out.textContent = text || 'Pas de réponse de Claude cette fois-ci.';
    } catch (e) { out.textContent = 'Claude n’est pas joignable pour le moment. L’explication ci-dessus reste valable.'; }
  },

  onClick(e) {
    const c = e.target.closest('[data-c]');
    if (c) {
      const k = c.dataset.c;
      if (k === 'close') this.close();
      if (k === 'retry') { this.renderShell(); this.open(this.game, this.names); }
      if (k === 'line') this.playLine();
      if (k === 'back') this.setPly(this.ply);
      if (k === 'replay') { const p = Math.max(0, this.ply - 1); this.close().then(() => Game.replayFrom(p)); }
      if (k === 'claude') this.askClaude();
      return;
    }
    const t = e.target.closest('[data-tab]');
    if (t) { this.showTab(t.dataset.tab); return; }
    const n = e.target.closest('[data-nav]');
    if (n) {
      const k = n.dataset.nav;
      if (k === 'first') this.setPly(0);
      if (k === 'last') this.setPly(this.data.moves.length);
      if (k === 'prev') this.step(-1);
      if (k === 'next') this.step(1);
      return;
    }
    const f = e.target.closest('[data-f]');
    if (f) { this.filter = f.dataset.f; this.renderMoves(); return; }
    const p = e.target.closest('[data-ply]');
    if (p) { this.showTab('review'); this.setPly(+p.dataset.ply); }
  },
};

/* =====================================================================
   MAIN — pendule, contrôleur de partie, sauvegarde, démarrage
   ===================================================================== */

/* ---------------------------------------------------------------
   Pendule (Fischer) : démarre au premier coup, se met en pause
   pendant les animations, les menus de fin et le coach.
   --------------------------------------------------------------- */
const Clock = {
  enabled: false, base: 0, inc: 0,
  time: { w: 0, b: 0 }, running: null, last: 0, snaps: [], lastTickSec: -1,

  fromSettings() {
    const c = Settings.clock;
    if (c.mode === 'none') return null;
    const p = CLOCK_PRESETS[c.mode] || { base: c.base, inc: c.inc };
    return { base: p.base * 60000, inc: p.inc * 1000 };
  },
  setup(cfg) {
    this.running = null;
    this.enabled = !!cfg;
    this.base = cfg ? cfg.base : 0;
    this.inc = cfg ? cfg.inc : 0;
    this.time = { w: this.base, b: this.base };
    this.snaps = [{ ...this.time }];
    this.render();
  },
  update() {
    if (!this.running) return;
    const now = performance.now();
    this.time[this.running] -= now - this.last;
    this.last = now;
  },
  start(c) {
    if (!this.enabled || Game.game.result) return;
    this.update();
    this.running = c;
    this.last = performance.now();
    this.render();
  },
  pause() { this.update(); this.running = null; this.render(); },
  // Le joueur vient de jouer : on arrête sa pendule et on ajoute l'incrément
  pressed(mover, plies) {
    if (!this.enabled) return;
    this.update();
    this.time[mover] += this.inc;                                    // Fischer : incrément à chaque coup
    this.running = null;
    this.snaps.length = plies;
    this.snaps.push({ ...this.time });
    this.render();
  },
  restore(plies) {
    if (!this.enabled) return;
    this.running = null;
    const s = this.snaps[Math.min(plies, this.snaps.length - 1)] || { w: this.base, b: this.base };
    this.time = { ...s };
    this.snaps.length = Math.min(plies + 1, this.snaps.length);
    this.render();
  },
  tick() {
    if (!this.enabled || !this.running) return;
    this.update();
    const c = this.running, t = this.time[c];
    if (t <= 0) { this.time[c] = 0; this.running = null; this.render(); Game.flag(c); return; }
    if (t < 10000) {
      const s = Math.ceil(t / 1000);
      if (s !== this.lastTickSec) { this.lastTickSec = s; Sound.play('tick'); }
    }
    this.render();
  },
  render() {
    for (const c of ['w', 'b']) {
      UI.setClock(c, this.time[c], { show: this.enabled, running: this.running === c, low: this.enabled && this.time[c] < 20000 });
    }
  },
  state() { this.update(); return { enabled: this.enabled, base: this.base, inc: this.inc, time: { ...this.time }, snaps: this.snaps.map(s => ({ ...s })) }; },
  load(s) {
    if (!s || !s.enabled) { this.setup(null); return; }
    this.setup({ base: s.base, inc: s.inc });
    this.time = { ...s.time };
    this.snaps = (s.snaps && s.snaps.length ? s.snaps : [{ w: s.base, b: s.base }]).map(x => ({ ...x }));
    this.render();
  },
};

/* ---------------------------------------------------------------
   Game — contrôleur : entrées, règles, état de l'interface
   --------------------------------------------------------------- */
const Game = {
  mode: 'welcome',            // 'welcome' | 'play' | 'coach'
  game: null,
  names: { w: 'Blancs', b: 'Noirs' },
  custom: { w: false, b: false },
  selected: -1,
  targets: [],
  locked: false,              // entrées bloquées pendant une animation / un choix
  drawOffer: null,            // camp qui propose la nulle
  resignArm: null,
  drag: null,
  get dragging() { return !!(this.drag && this.drag.moved); },

  init() {
    this.game = new E.Game();
    View.sync(this.game.pos);
    this.bindInput();
    this.refresh();
    Clock.setup(null);
    window.addEventListener('keydown', e => this.onKey(e));
    const persist = () => { if (this.mode === 'play' && this.game.history.length) this.save(); };
    document.addEventListener('visibilitychange', persist);
    window.addEventListener('pagehide', persist);
    this.showWelcome();
  },

  /* ---------- Accueil, nouvelle partie, reprise ---------- */
  async showWelcome() {
    if (this.mode === 'play' && this.game && this.game.history.length) { Clock.pause(); this.save(); }
    this.mode = 'welcome';
    Clock.pause();
    this.refresh();
    UI.clearSheet(); UI.closeMenu(); UI.toggleHistory(false);
    const saved = Store.get(KEY_GAME, null);
    const canResume = !!(saved && saved.v === 1 && saved.uci && saved.uci.length && !saved.result);
    let info = '';
    if (canResume) {
      const n = saved.uci.length, nw = saved.names.w || 'Blancs', nb = saved.names.b || 'Noirs';
      info = `${nw} contre ${nb}, ${n} ${n > 1 ? 'demi-coups joués' : 'demi-coup joué'}`;
    }
    const r = await UI.welcome({ canResume, resumeInfo: info });
    if (r.resume && this.resume(saved)) return;
    this.newGame();
  },

  applyNames(n) {
    this.custom = { w: !!(n.w && n.w.trim()), b: !!(n.b && n.b.trim()) };
    this.names = { w: this.custom.w ? n.w.trim() : 'Blancs', b: this.custom.b ? n.b.trim() : 'Noirs' };
  },

  newGame() {
    this.game = new E.Game();
    this.applyNames(Settings.names);
    this.resetUiState();
    Clock.setup(Clock.fromSettings());
    Fx.clearAll();
    View.sync(this.game.pos, true);
    View.syncTrays({ w: [], b: [] });
    this.mode = 'play';
    this.paint(); this.refresh();
    this.save();
    Sound.play('start');
  },

  resume(saved) {
    try {
      const g = new E.Game(saved.startFen || undefined);
      for (const u of saved.uci) {
        const m = g.legalMoves().find(x => uci(x) === u);
        if (!m || !g.play(m)) throw new Error('coup invalide ' + u);
      }
      this.game = g;
      this.applyNames(saved.names || {});
      this.resetUiState();
      Clock.load(saved.clock);
      View.sync(g.pos, true);
      View.syncTrays(this.captured());
      this.mode = 'play';
      this.paint(); this.refresh();
      Sound.play('start');
      if (g.history.length) Clock.start(g.turn);
      UI.toast(`Partie reprise : ${this.turnLabel(g.turn)}`);
      return true;
    } catch (err) {
      console.warn('Reprise impossible', err);
      Store.del(KEY_GAME);
      UI.toast('La partie enregistrée n’a pas pu être reprise');
      return false;
    }
  },

  resetUiState() {
    this.drawOffer = null; this.resignArm = null;
    this.selected = -1; this.targets = [];
    this.locked = false; this.drag = null;
    UI.clearSheet(); UI.closeMenu();
  },

  save() {
    const g = this.game;
    Store.set(KEY_GAME, {
      v: 1, startFen: g.startFen, uci: g.history.map(h => uci(h.move)),
      names: { w: this.custom.w ? this.names.w : '', b: this.custom.b ? this.names.b : '' },
      clock: Clock.state(), result: g.result, ts: Date.now(),
    });
  },

  // Pièces prises PAR chaque camp, dans l'ordre
  captured(g = this.game) {
    const cap = { w: [], b: [] };
    g.history.forEach(h => { if (h.move.flags & E.F_CAPTURE) cap[colorOf(h.move.piece)].push(h.move.captured); });
    return cap;
  },

  /* ---------- Entrées : clic, toucher, glisser-déposer (via TouchController) ---------- */
  bindInput() { TouchController.init(View.canvas); },

  canInput() { return this.mode === 'play' && !this.locked && !this.game.result; },
  ownPieceAt(sq) {
    const p = sq >= 0 ? this.game.pieceAt(sq) : 0;
    return !!p && colorOf(p) === this.game.turn;
  },

  onDown(e) {
    Sound.unlock();
    UI.closeMenu();
    if (this.mode === 'coach') { this.swipe = { x: e.clientX, y: e.clientY }; return; }
    if (!this.canInput() || e.button > 0) return;
    const sq = View.pick(e);
    if (this.selected >= 0 && sq !== this.selected && this.targets.some(t => t.sq === sq)) {
      this.tryMove(this.selected, sq);
      return;
    }
    if (this.ownPieceAt(sq)) {
      const wasSelected = sq === this.selected;
      if (!wasSelected) { Sound.play('click'); Haptics.select(); }
      this.select(sq);
      this.drag = { sq, piece: View.pieces.get(sq), x: e.clientX, y: e.clientY, moved: false, wasSelected, id: e.pointerId };
      try { View.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      return;
    }
    if (this.selected >= 0 && sq >= 0) Haptics.error();
    this.deselect();
  },

  onMove(e) {
    const cv = View.canvas;
    if (!this.drag) {
      if (e.pointerType === 'mouse' && this.canInput()) {
        const now = performance.now();
        if (now - (this._hoverT || 0) < 40) return;          // survol : picking limité à 25 Hz
        this._hoverT = now;
        const sq = View.pick(e);
        const tgt = this.targets.some(t => t.sq === sq);
        const own = this.ownPieceAt(sq);
        cv.classList.toggle('is-grab', own || tgt);
        View.setHover(tgt ? sq : -1);
        const hp = own && sq !== this.selected ? View.pieces.get(sq) : null;
        if (this.hoverPiece && this.hoverPiece !== hp && this.hoverPiece.lift.target === ANIMATION_CONFIG.hover.lift) this.hoverPiece.lift.target = 0;
        if (hp) hp.lift.target = ANIMATION_CONFIG.hover.lift;
        this.hoverPiece = hp;
      }
      return;
    }
    const d = this.drag;
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) return;
    if (!d.moved) { d.moved = true; HighlightManager.bright(d.piece, true); }
    cv.classList.add('is-grabbing');
    const lift = ANIMATION_CONFIG.drag.lift;
    const p = View.planeHit(e, lift);
    if (p && d.piece) {
      d.piece.dragTarget = { x: clamp(p.x, -4.6, 4.6), z: clamp(p.z, -4.6, 4.6) };
      d.piece.lift.target = lift;
      const over = View.squareAtPoint(View.planeHit(e, 0));
      View.setHover(this.targets.some(t => t.sq === over) ? over : -1);
    }
    View.wake();
  },

  onUp(e) {
    if (this.mode === 'coach') {
      const s = this.swipe; this.swipe = null;
      if (s) {
        const dx = e.clientX - s.x, dy = e.clientY - s.y;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) Coach.step(dx < 0 ? 1 : -1);
      }
      return;
    }
    const d = this.drag;
    if (!d) return;
    this.drag = null;
    View.canvas.classList.remove('is-grabbing');
    View.setHover(-1);
    if (!d.moved) { if (d.wasSelected) this.deselect(); return; }
    const to = View.squareAtPoint(View.planeHit(e, 0));
    if (to >= 0 && to !== d.sq && this.targets.some(t => t.sq === to)) this.tryMove(d.sq, to, true);
    else { Haptics.error(); this.returnHome(d); }
  },

  cancelDrag() {
    if (!this.drag) return;
    const d = this.drag; this.drag = null;
    View.canvas.classList.remove('is-grabbing');
    View.setHover(-1);
    if (d.moved) this.returnHome(d);
  },

  // Glisser vers une case illégale : la pièce revient à sa place
  returnHome(d) {
    if (!d.piece) return;
    this.locked = true;
    PieceAnimationController.returnHome(d.piece, d.sq).then(() => {
      this.locked = false;
      if (this.selected === d.sq && d.piece.alive) d.piece.lift.target = ANIMATION_CONFIG.select.lift;
    });
  },

  select(sq) {
    this.selected = sq;
    this.targets = this.game.movesFrom(sq)
      .filter((m, i, a) => a.findIndex(o => o.to === m.to) === i)     // une seule cible par promotion
      .map(m => ({ sq: m.to, capture: !!(m.flags & E.F_CAPTURE) }));
    this.paint();
  },
  deselect() { this.selected = -1; this.targets = []; this.paint(); },

  async tryMove(from, to, dropped = false) {
    const cands = this.game.movesFrom(from).filter(m => m.to === to);
    if (!cands.length) { this.deselect(); return; }
    let move = cands[0];
    if (cands.length > 1) {                                           // promotion : choix de la pièce
      this.locked = true;
      if (dropped) { const pc = View.pieces.get(from); if (pc) { pc.dragTarget = null; pc.lift.cur = 0; HighlightManager.bright(pc, false); View.putAt(pc, from); } dropped = false; }
      const t = await UI.promotion(this.game.turn);
      this.locked = false;
      if (!t || this.mode !== 'play') { this.deselect(); return; }
      move = cands.find(m => (m.promo & E.TYPE) === t);
    }
    return this.commit(move, dropped);
  },

  async commit(move, dropped) {
    const mover = this.game.turn;
    const entry = this.game.play(move);
    if (!entry) return;
    if (this.drawOffer && this.drawOffer !== mover) {
      this.drawOffer = null;
      UI.toast('Proposition de nulle déclinée : un coup a été joué');
    }
    this.resignArm = null;
    Clock.pressed(mover, this.game.history.length);
    this.selected = -1; this.targets = [];
    this.locked = true;
    View.setHighlights({ last: { from: entry.move.from, to: entry.move.to } });
    this.refresh();
    UI.renderHistory(this.game);
    this.save();
    const g = this.game;
    await Fx.playMove(entry.move, g.pos, { dropped, captured: this.captured() });
    if (g !== this.game) return;                                      // partie remplacée entre-temps
    this.locked = false;
    this.refresh();
    this.paint();
    const r = g.result;
    if (r && r.reason === 'mat') Sound.play('mate');
    else if (g.inCheck()) { Sound.play('check'); Haptics.check(); }
    if (r) { this.finish(); return; }
    UI.turnEnter(g.turn);                                            // pass & play : c'est au tour de l'autre joueur
    Clock.start(g.turn);
  },

  undo() {
    if (this.mode !== 'play' || this.locked || !this.game.history.length) return;
    Tweens.finishAll();
    Fx.clearAll();
    this.game.undo();
    this.drawOffer = null; this.resignArm = null;
    UI.clearSheet();
    Clock.restore(this.game.history.length);
    this.deselect();
    View.sync(this.game.pos);
    View.syncTrays(this.captured());
    this.refresh();
    UI.renderHistory(this.game);
    this.save();
    Sound.play('tock', { f: 380, g: .3 });
    if (this.game.history.length) Clock.start(this.game.turn);
  },

  // Temps écoulé
  flag(c) {
    const g = this.game;
    if (g.result || this.mode !== 'play') return;
    Sound.play('flag');
    // L'adversaire peut-il encore mater ? Roi seul ou roi + une pièce mineure : non.
    const opp = other(c), oppBit = opp === 'w' ? 0 : E.COLOR;
    let minors = 0, heavy = 0;
    for (let i = 0; i < 64; i++) {
      const p = g.pos.board[E.from64(i)];
      if (!p || (p & E.COLOR) !== oppBit) continue;
      const t = p & E.TYPE;
      if (t === E.KNIGHT || t === E.BISHOP) minors++;
      else if (t !== E.KING) heavy++;
    }
    const canMate = heavy > 0 || minors > 1;
    g.result = canMate ? { winner: opp, reason: 'temps' } : { winner: null, reason: 'temps-nulle', flagged: c };
    this.finish();
  },

  /* ---------- Surbrillances ---------- */
  paint() {
    const g = this.game, last = g.history[g.history.length - 1];
    const check = (!g.result || g.result.reason === 'mat') && g.inCheck() ? g.pos.king[g.pos.turn >> 3] : -1;
    View.setHighlights({
      selected: this.selected,
      targets: this.targets,
      last: last ? { from: last.move.from, to: last.move.to } : null,
      check,
    });
  },

  /* ---------- Sièges ---------- */
  turnLabel(c) { return this.custom[c] ? `${this.names[c]}, à toi de jouer` : `aux ${c === 'w' ? 'Blancs' : 'Noirs'} de jouer`; },
  isPlural(c) { return !this.custom[c]; },
  subject(c) { return this.custom[c] ? this.names[c] : c === 'w' ? 'Les Blancs' : 'Les Noirs'; },
  verb(c, sing, plur) { return this.isPlural(c) ? plur : sing; },

  refresh() {
    const g = this.game, bal = g.materialBalance();
    const last = g.history[g.history.length - 1];
    for (const c of ['w', 'b']) {
      const turn = this.mode === 'play' && !g.result && g.turn === c;
      const check = turn && g.inCheck();
      let status;
      if (g.result) status = g.result.winner === c ? 'Victoire' : g.result.winner ? 'Défaite' : 'Partie nulle';
      else if (this.mode === 'coach') status = 'Analyse en cours';
      else if (this.drawOffer && this.drawOffer !== c) status = 'Ton adversaire propose la nulle';
      else if (this.drawOffer === c) status = 'Nulle proposée, en attente de réponse';
      else if (turn) status = check ? 'Échec ! À toi de jouer' : 'À toi de jouer';
      else if (this.mode === 'play' && !last) status = 'En attente : les Blancs commencent';
      else if (last && colorOf(last.move.piece) === c) status = `Tu as joué ${sanFr(last.san)}`;
      else status = 'Les Blancs commencent';

      let actions;
      if (g.result || this.mode !== 'play') actions = [];
      else if (this.drawOffer && this.drawOffer !== c) {
        actions = [{ act: 'decline', label: 'Refuser' }, { act: 'accept', label: 'Accepter la nulle', cls: 'btn--primary' }];
      } else {
        actions = [
          this.drawOffer === c
            ? { act: 'draw', label: 'Nulle proposée', icon: 'draw', disabled: true }
            : { act: 'draw', label: 'Proposer nulle', icon: 'draw', disabled: !g.history.length },
          this.resignArm === c
            ? { act: 'resign', label: 'Confirmer l’abandon', icon: 'flag', cls: 'btn--danger' }
            : { act: 'resign', label: 'Abandonner', icon: 'flag' },
        ];
      }
      const waiting = this.mode === 'play' && !g.result && g.turn !== c;
      UI.setSeat(c, { name: this.names[c], status, turn, check, material: c === 'w' ? bal : -bal, actions, waiting });
    }
    if (BabylonRenderer.scene) View.setTurn(this.mode === 'play' && !g.result && !this.locked ? g.turn : null);   // filet lumineux du trait (3D)
  },

  onSeatAction(c, act) {
    const g = this.game;
    Sound.unlock();
    switch (act) {
      case 'menu': this.openMenu(c); return;
      case 'draw':
        if (g.result || this.locked) return;
        this.drawOffer = c;
        Sound.play('click');
        UI.toast(`${this.subject(c)} ${this.verb(c, 'propose', 'proposent')} la nulle`);
        break;
      case 'accept':
        this.drawOffer = null;
        g.agreeDraw();
        this.finish();
        break;
      case 'decline':
        this.drawOffer = null;
        UI.toast('Nulle refusée, la partie continue');
        break;
      case 'resign':
        if (g.result) return;
        if (this.resignArm !== c) {
          this.resignArm = c;
          clearTimeout(this._ra);
          this._ra = setTimeout(() => { this.resignArm = null; this.refresh(); }, 3500);
        } else {
          this.resignArm = null;
          g.resign(c);
          this.finish();
        }
        break;
    }
    this.refresh();
  },

  openMenu(c) {
    const g = this.game, over = !!g.result;
    const lastSan = g.history.length ? sanFr(g.history[g.history.length - 1].san) : '';
    const items = [];
    if (over) {
      items.push({ label: 'Analyser la partie avec le coach', hint: 'Revue de chaque coup par Stockfish', disabled: !g.history.length, run: () => this.openCoach() });
      items.push({ label: 'Afficher le résultat', run: () => this.showResult() });
    }
    items.push(
      { label: 'Annuler le dernier coup', hint: lastSan ? `Revient avant ${lastSan}` : 'Aucun coup joué', disabled: !g.history.length || this.locked, run: () => this.undo() },
      { label: 'Historique des coups', hint: 'Notation algébrique, repliable', run: () => UI.toggleHistory(true) },
      { label: 'Copier la partie (PGN)', disabled: !g.history.length, run: () => this.copyPgn() },
      '-',
      { label: 'Options', hint: 'Thème, animations, son, orientation', run: () => UI.openOptions(c) },
      { label: Settings.sound ? 'Couper le son' : 'Rétablir le son', run: () => { Settings.sound = !Settings.sound; saveSettings(); Sound.applyVolume(); UI.toast(Settings.sound ? 'Son activé' : 'Son coupé'); } },
      '-',
      { label: 'Nouvelle partie', hint: over || !g.history.length ? 'Retour à l’écran d’accueil' : 'La partie en cours reste enregistrée', run: () => this.showWelcome() },
      { label: 'Vérifier le moteur de règles', hint: 'Tests perft, détail dans la console', run: () => this.selfTest() },
    );
    UI.openMenu(c, items);
  },

  onKey(e) {
    if (this.mode === 'welcome') return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (this.mode === 'coach') { Coach.onKey(e); if (e.key === 'Escape') Coach.close(); return; }
    if (e.key === 'Escape') { UI.closeMenu(); this.deselect(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); this.undo(); }
  },

  /* ---------- Fin de partie ---------- */
  resultText() {
    const r = this.game.result, n = Math.ceil(this.game.history.length / 2);
    const W = c => `${this.subject(c)} ${this.verb(c, 'gagne', 'gagnent')}`;
    const loser = r.winner ? other(r.winner) : null;
    switch (r.reason) {
      case 'mat': return { title: 'Échec et mat', text: `${W(r.winner)} en ${n} coup${n > 1 ? 's' : ''}. Belle partie à vous deux !` };
      case 'abandon': return { title: 'Abandon', text: `${this.subject(loser)} ${this.verb(loser, 'abandonne', 'abandonnent')}. ${W(r.winner)}.` };
      case 'temps': return { title: 'Temps écoulé', text: `${this.subject(loser)} ${this.verb(loser, 'n’a', 'n’ont')} plus de temps. ${W(r.winner)}.` };
      case 'temps-nulle': return { title: 'Partie nulle', text: `Le temps ${this.custom[r.flagged] ? 'de ' + this.names[r.flagged] : r.flagged === 'w' ? 'des Blancs' : 'des Noirs'} est écoulé, mais l’adversaire n’a plus assez de matériel pour mater.` };
      case 'pat': return { title: 'Pat', text: 'Partie nulle : le roi n’est pas en échec, mais aucun coup légal n’est possible.' };
      case 'materiel': return { title: 'Partie nulle', text: 'Matériel insuffisant : plus aucun mat n’est possible.' };
      case '50coups': return { title: 'Partie nulle', text: 'Règle des 50 coups : ni prise ni coup de pion depuis 50 coups.' };
      case 'repetition': return { title: 'Partie nulle', text: 'La même position est apparue trois fois.' };
      case 'accord': return { title: 'Partie nulle', text: 'Nulle acceptée d’un commun accord.' };
      default: return { title: 'Partie terminée', text: '' };
    }
  },

  async finish() {
    const g = this.game, r = g.result;
    if (!r) return;
    Clock.pause();
    this.drawOffer = null; this.resignArm = null;
    this.deselect();
    this.refresh();
    this.save();
    this.locked = true;
    if (r.reason === 'mat') {
      await Tweens.delay(250);
      const loserKing = View.pieces.get(g.pos.king[g.pos.turn >> 3]);
      await Fx.topple(loserKing);
    } else {
      if (r.reason === 'abandon') Sound.play('flag');
      else if (!r.winner) Sound.play('draw');
      await Tweens.delay(250);
    }
    if (g !== this.game) return;
    this.locked = false;
    this.showResult();
  },

  showResult() {
    if (!this.game.result || this.mode !== 'play') return;
    UI.gameOver(this.resultText(), {
      canAnalyse: this.game.history.length > 0,
      coach: () => this.openCoach(),
      close: () => UI.resultPill(() => this.showResult()),
      new: () => this.showWelcome(),
    });
  },

  openCoach() {
    if (!this.game.history.length) return;
    UI.clearSheet(); UI.closeMenu(); UI.toggleHistory(false);
    Clock.pause();
    Coach.open(this.game, { ...this.names });
    this.refresh();
  },

  backFromCoach() {
    this.mode = 'play';
    View.sync(this.game.pos);
    View.syncTrays(this.captured());
    View.setArrows([]);
    this.paint();
    this.refresh();
    if (this.game.result) UI.resultPill(() => this.showResult());
  },

  // Depuis le coach : reprendre la partie à partir d'un coup donné
  replayFrom(ply) {
    const old = this.game;
    const g = new E.Game(old.startFen);
    for (const h of old.history.slice(0, ply)) g.play(h.move);
    this.game = g;
    this.resetUiState();
    this.mode = 'play';
    Clock.restore(ply);
    Fx.clearAll();
    View.sync(g.pos);
    View.syncTrays(this.captured());
    this.paint(); this.refresh();
    UI.clearSheet();
    UI.renderHistory(g);
    this.save();
    if (g.history.length) Clock.start(g.turn);
    UI.toast(ply ? `Reprise après le demi-coup ${ply} : ${this.turnLabel(g.turn)}` : `Reprise depuis la position de départ : ${this.turnLabel(g.turn)}`, 3400);
  },

  /* ---------- PGN ---------- */
  async copyPgn() {
    const text = this.game.pgn(this.names.w, this.names.b);
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch (e) { ok = false; }
    }
    if (ok) UI.toast('Partie copiée au format PGN');
    else {
      const el = UI.sheet(`<h2>Partie au format PGN</h2><textarea class="pgn" readonly>${escapeHtml(text)}</textarea><div class="row"><button class="btn btn--primary" data-k="x">Fermer</button></div>`);
      const ta = el.querySelector('textarea'); ta.focus(); ta.select();
      el.querySelector('[data-k]').onclick = () => UI.clearSheet();
    }
  },

  selfTest() {
    UI.toast('Vérification des règles en cours…', 8000);
    setTimeout(() => {
      let count = 0, fail = 0;
      const ok = E.runPerftTests({ maxDepth: 4, maxNodes: 5e5, log: s => { count++; if (/ÉCHEC|FAIL/i.test(s)) fail++; console.log(s); } });
      UI.toast(ok ? `Moteur vérifié : tous les tests perft sont réussis` : 'Un test perft a échoué, voir la console', 4000);
      void fail; void count;
    }, 60);
  },
};

/* ---------------------------------------------------------------
   Démarrage : interface → Babylon.js → moteur de rendu → partie
   --------------------------------------------------------------- */
// Noms d'architecture (alias explicites des modules)
const GameController = Game, UIManager = UI, AudioManager = Sound;

async function boot() {
  const bootEl = $('#boot'), info = $('#bootInfo');
  window.runPerftTests = opts => E.runPerftTests(opts);
  window.chess = { Game, GameController, View, E, Tweens, Coach, Fx, Clock, Sound, AudioManager, Settings, Stockfish, UI, UIManager,
    GRAPHICS_CONFIG, ANIMATION_CONFIG };
  UI.init();
  Layout.update();
  try {
    info.textContent = 'Chargement de Babylon.js';
    await BabylonLoader.load();
  } catch (err) {
    console.error(err);
    bootEl.innerHTML = '<div>Babylon.js n’a pas pu être chargé.<small>Vérifie ta connexion internet puis recharge la page (ou place une copie dans assets/vendor/babylon.js).</small></div>';
    return;
  }
  try {
    await BabylonRenderer.init(t => { info.textContent = t; });
    Object.assign(window.chess, { BabylonRenderer, PieceManager, CameraController, LightingManager, MaterialLibrary, EffectsManager, HighlightManager,
      PerformanceManager, PieceAnimationController, CombatAnimationController, CaptureAnimationController, KnightSword, CinematicDirector,
      GameFeelManager, IdleAnimationController, TouchController, MoveDirector, Layout, BoardBuilder, Haptics, BABYLON: window.BABYLON });
    Game.init();
    bootEl.style.transition = 'opacity .5s ease';
    bootEl.style.opacity = '0';
    bootEl.style.pointerEvents = 'none';
    setTimeout(() => bootEl.remove(), 520);
  } catch (err) {
    console.error(err);
    bootEl.innerHTML = '<div>Le rendu 3D n’a pas pu démarrer sur cet appareil.<small>WebGPU et WebGL 2 sont indisponibles ou bloqués : ' + escapeHtml(String((err && err.message) || err)) + '</small></div>';
    return;
  }
  console.info('%cÉchiquier 3D — Babylon.js ' + BabylonLoader.VERSION + ' · ' + BabylonRenderer.backend, 'font-weight:bold',
    '— tape runPerftTests() pour vérifier le moteur de règles, window.chessDebug = true pour les statistiques.');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
