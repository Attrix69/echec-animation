  },

  // Flèches plates au-dessus des pièces : [{ from, to, color, opacity }]
  setArrows(list) {
    for (const a of this.arrows) { a.mesh.dispose(); a.mat.dispose(); }
    this.arrows = [];
    for (const a of list) {
      const f = sqToWorld(a.from), t = sqToWorld(a.to);
      const dx = t.x - f.x, dz = t.z - f.z;
      const pts = [[f.x, f.z]];
      if (Math.abs(dx) + Math.abs(dz) === 3 && Math.abs(dx) && Math.abs(dz)) pts.push(Math.abs(dx) > Math.abs(dz) ? [t.x, f.z] : [f.x, t.z]);
      pts.push([t.x, t.z]);
      const g = Geo.make(), W = .075, Y = .07;
      const quad = (p) => {                                   // polygone convexe en éventail, normale vers le haut
        const b = g.positions.length / 3;
        for (const [x, z] of p) { g.positions.push(x, Y, z); g.normals.push(0, 1, 0); g.uvs.push(0, 0); }
        for (let i = 1; i < p.length - 1; i++) g.indices.push(b, b + i, b + i + 1);
      };
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, z0] = pts[i], [x1, z1] = pts[i + 1], last = i === pts.length - 2;
        const len = Math.hypot(x1 - x0, z1 - z0), ux = (x1 - x0) / len, uz = (z1 - z0) / len, nx = -uz, nz = ux;
        const s0 = i === 0 ? .22 : -W, e0 = last ? len - .44 : len + W;
        const P = (a, b) => [x0 + ux * a + nx * b, z0 + uz * a + nz * b];
        quad([P(s0, -W), P(e0, -W), P(e0, W), P(s0, W)]);
        if (last) quad([P(len - .44, -.24), P(len - .1, 0), P(len - .44, .24)]);
      }
      Geo.orient(g);
      const mesh = Geo.toMesh('arrow', g, this.scene);
      const mat = new BABYLON.StandardMaterial('arrow-mat', this.scene);
      mat.disableLighting = true; mat.emissiveColor = typeof a.color === 'number' ? BABYLON.Color3.FromHexString('#' + a.color.toString(16).padStart(6, '0')) : C3(a.color);
      mat.alpha = a.opacity || .82; mat.backFaceCulling = false; mat.disableDepthWrite = true;

  },
};


/* =====================================================================
   EFFECTS MANAGER — particules (GPU si disponible, sinon CPU), éclats 3D,
   ondes de choc, éclairs, arcs de taille, traînées. Tous les effets sont
   liés à une action de jeu et restent courts : jamais d'écran saturé.
   ===================================================================== */
// Traînée en ruban (lame d'épée) : suit la base et la pointe, sous-échantillonnée en arc
class RibbonTrail {
  constructor(scene, color, { length = 22, alpha = .9 } = {}) {
    this.n = length; this.pts = [];
    this.mesh = new BABYLON.Mesh('ribbon', scene);
    const pos = new Float32Array(this.n * 2 * 3), uv = new Float32Array(this.n * 2 * 2), ind = [];
    for (let i = 0; i < this.n - 1; i++) { const a = i * 2; ind.push(a, a + 2, a + 1, a + 1, a + 2, a + 3, a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const vd = new BABYLON.VertexData();
    vd.positions = pos; vd.uvs = uv; vd.indices = ind;
    vd.applyToMesh(this.mesh, true);
    this.pos = pos; this.uv = uv;
    const m = this.mat = new BABYLON.StandardMaterial('ribbon-mat', scene);
    m.disableLighting = true; m.emissiveColor = color.clone(); m.backFaceCulling = false;
    m.opacityTexture = MaterialLibrary.spriteTexture('trail', Tex.sprite('trail', 128));
    m.opacityTexture.wrapU = m.opacityTexture.wrapV = BABYLON.Constants.TEXTURE_CLAMP_ADDRESSMODE;
    m.alphaMode = BABYLON.Constants.ALPHA_ADD; m.alpha = alpha; m.disableDepthWrite = true;
    this.mesh.material = m; this.mesh.isPickable = false; this.mesh.alwaysSelectAsActiveMesh = true;
    this.alpha = alpha; this.fade = 1; this.stopped = false; this.age = 0;
    if (BabylonRenderer.glow) BabylonRenderer.glow.addIncludedOnlyMesh(this.mesh);
  }
  // Ajoute un échantillon ; entre deux images, on interpole la rotation autour du pivot
  push(pivot, base, tip) {
    const last = this.pts[0];
    if (last && pivot) {
      const d0 = last.tip.subtract(pivot), d1 = tip.subtract(pivot);
      const ang = Math.acos(clamp(BABYLON.Vector3.Dot(d0.normalizeToNew(), d1.normalizeToNew()), -1, 1));
      const sub = Math.min(6, Math.floor(ang / .12));
      for (let i = 1; i <= sub; i++) {
        const t = i / (sub + 1);
        const b = BABYLON.Vector3.Lerp(last.base, base, t);
        const dir = BABYLON.Vector3.Lerp(d0.normalizeToNew(), d1.normalizeToNew(), t).normalize().scale(lerp(d0.length(), d1.length(), t));
        this.pts.unshift({ base: b, tip: pivot.add(dir) });
      }
    }
    this.pts.unshift({ base: base.clone(), tip: tip.clone() });
    if (this.pts.length > this.n) this.pts.length = this.n;
    this.rebuild();
  }
  rebuild() {
    const P = this.pos, U = this.uv, k = this.pts.length;
    for (let i = 0; i < this.n; i++) {
      const s = this.pts[Math.min(i, k - 1)] || { base: V3(), tip: V3() };
      const t = i / (this.n - 1);
      P.set([s.base.x, s.base.y, s.base.z, s.tip.x, s.tip.y, s.tip.z], i * 6);
      U.set([Math.min(1, i / Math.max(1, k - 1)), 0, Math.min(1, i / Math.max(1, k - 1)), 1], i * 4);
      void t;
    }
    this.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, P, false, false);
    this.mesh.updateVerticesData(BABYLON.VertexBuffer.UVKind, U, false, false);
    this.mesh.refreshBoundingInfo();
  }
  stop() { this.stopped = true; }
  update(dt) {
    if (!this.stopped) return true;
    this.fade -= dt / 260;
    this.mat.alpha = this.alpha * Math.max(0, this.fade);
    if (this.pts.length > 1 && this.fade < .7) { this.pts.pop(); this.rebuild(); }
    if (this.fade <= 0) { this.dispose(); return false; }
    return true;
  }
  dispose() { if (BabylonRenderer.glow) BabylonRenderer.glow.removeIncludedOnlyMesh(this.mesh); this.mesh.dispose(); this.mat.dispose(); this.disposed = true; }
}

const EffectsManager = {
  scale: 1, activeUntil: 0, ribbons: [], trails: [], shardSets: {},
  get active() { return performance.now() < this.activeUntil || this.ribbons.length > 0 || this.trails.length > 0 || this.shardsLive > 0; },
  keepAlive(ms) { this.activeUntil = Math.max(this.activeUntil, performance.now() + ms); View.wake(); },
  init(scene) {
    this.scene = scene;
    const T = (k, kind, size) => MaterialLibrary.spriteTexture(k, Tex.sprite(kind, size));
    this.tex = { glow: T('glow', 'glow', 128), soft: T('soft', 'soft', 64), smoke: T('smoke', 'smoke', 128), star: T('star', 'star', 128),
      shock: T('shock', 'shock', 256), crescent: T('crescent', 'crescent', 256), ring: T('ring', 'ring', 128) };
    this.useGPU = !!(BABYLON.GPUParticleSystem && BABYLON.GPUParticleSystem.IsSupported) && BabylonRenderer.quality.name !== 'PERF';
    this.pools = {};
    this.mats = {};
    this.shardsLive = 0;
  },
  applyTheme(th) { this.theme = th; },
  color(hex, a = 1) { const c = C3(hex); return new BABYLON.Color4(c.r, c.g, c.b, a); },
  glowHex() { return (this.theme || BabylonRenderer.theme).glow; },

  /* ---------- Systèmes de particules (réserves réutilisées) ---------- */
  system(kind) {
    const pool = this.pools[kind] || (this.pools[kind] = { list: [], i: 0 });
    const cap = { dust: 90, smoke: 60, sparks: 140, magic: 160, embers: 80, glints: 40 }[kind] || 100;
    if (pool.list.length < 3) {
      let ps;
      const gpu = this.useGPU && kind !== 'smoke';
      try { ps = gpu ? new BABYLON.GPUParticleSystem('fx-' + kind, { capacity: cap }, this.scene) : new BABYLON.ParticleSystem('fx-' + kind, cap, this.scene); }
      catch (e) { ps = new BABYLON.ParticleSystem('fx-' + kind, cap, this.scene); }
      ps.emitter = V3(); ps.emitRate = 0; ps.manualEmitCount = 0; ps.updateSpeed = 1 / 60;
      ps.isGPU = gpu; ps.minAngularSpeed = 0; ps.maxAngularSpeed = 0;
      ps.preventAutoStart = true;
      this.configure(kind, ps);
      pool.list.push(ps);
      return ps;
    }
    pool.i = (pool.i + 1) % pool.list.length;
    return pool.list[pool.i];
  },
  configure(kind, ps) {
    const B = BABYLON.ParticleSystem;
    switch (kind) {
      case 'dust':
        ps.particleTexture = this.tex.smoke; ps.blendMode = B.BLENDMODE_STANDARD;
        ps.minLifeTime = .55; ps.maxLifeTime = 1.1; ps.minSize = .12; ps.maxSize = .32;
        ps.minEmitPower = .35; ps.maxEmitPower = 1.1; ps.gravity = V3(0, .08, 0);
        ps.addSizeGradient(0, .5); ps.addSizeGradient(1, 1.9);
        ps.minAngularSpeed = -1; ps.maxAngularSpeed = 1; ps.minInitialRotation = 0; ps.maxInitialRotation = 6.28;
        break;
      case 'smoke':
        ps.particleTexture = this.tex.smoke; ps.blendMode = B.BLENDMODE_STANDARD;
        ps.minLifeTime = .9; ps.maxLifeTime = 1.6; ps.minSize = .2; ps.maxSize = .45;
        ps.minEmitPower = .1; ps.maxEmitPower = .4; ps.gravity = V3(0, .35, 0);
        ps.addSizeGradient(0, .6); ps.addSizeGradient(1, 2.2);
        break;
      case 'sparks':
        ps.particleTexture = this.tex.glow; ps.blendMode = B.BLENDMODE_ADD;
        ps.minLifeTime = .22; ps.maxLifeTime = .5; ps.minSize = .025; ps.maxSize = .06;
        ps.minEmitPower = 1.4; ps.maxEmitPower = 3.6; ps.gravity = V3(0, -7, 0);
        ps.billboardMode = B.BILLBOARDMODE_STRETCHED;
        break;
      case 'embers':
        ps.particleTexture = this.tex.glow; ps.blendMode = B.BLENDMODE_ADD;
        ps.minLifeTime = .5; ps.maxLifeTime = 1.1; ps.minSize = .03; ps.maxSize = .07;
        ps.minEmitPower = .3; ps.maxEmitPower = 1.1; ps.gravity = V3(0, .6, 0);
        break;
      case 'magic':
        ps.particleTexture = this.tex.star; ps.blendMode = B.BLENDMODE_ADD;
        ps.minLifeTime = .5; ps.maxLifeTime = 1.05; ps.minSize = .05; ps.maxSize = .13;
        ps.minEmitPower = .2; ps.maxEmitPower = .9; ps.gravity = V3(0, .9, 0);
        ps.minAngularSpeed = -2; ps.maxAngularSpeed = 2;
        ps.addSizeGradient(0, .3); ps.addSizeGradient(.25, 1); ps.addSizeGradient(1, 0);
        break;
      case 'glints':
        ps.particleTexture = this.tex.star; ps.blendMode = B.BLENDMODE_ADD;
        ps.minLifeTime = .25; ps.maxLifeTime = .45; ps.minSize = .1; ps.maxSize = .22;
        ps.minEmitPower = 0; ps.maxEmitPower = .15; ps.gravity = V3(0, 0, 0);
        ps.addSizeGradient(0, 0); ps.addSizeGradient(.3, 1); ps.addSizeGradient(1, 0);
        break;
    }
  },
  // Salve de particules : kind, position, nombre, couleurs, forme d'émission
  burst(kind, pos, n, { c1, c2, dead, radius = .15, dir = null, spread = 1, power = null, life = null, size = null, hemi = true } = {}) {
    if (!GRAPHICS_CONFIG.particles || Tweens.skipping || this.scale <= 0) return;
    const count = Math.max(1, Math.round(n * this.scale));
    const ps = this.system(kind);
    ps.emitter = pos.clone();
    if (dir) {
      const d = dir.normalizeToNew(), s = spread;
      ps.createDirectedSphereEmitter(radius, d.add(V3(-s, -s * .3, -s)), d.add(V3(s, s, s)));
    } else if (hemi) ps.createHemisphericEmitter(radius, 1);
    else ps.createSphereEmitter(radius, 1);
    if (c1) ps.color1 = c1; if (c2) ps.color2 = c2 || c1;
    ps.colorDead = dead || new BABYLON.Color4(0, 0, 0, 0);
    if (power) { ps.minEmitPower = power[0]; ps.maxEmitPower = power[1]; }
    if (life) { ps.minLifeTime = life[0]; ps.maxLifeTime = life[1]; }
    if (size) { ps.minSize = size[0]; ps.maxSize = size[1]; }
    ps.manualEmitCount = (ps.manualEmitCount > 0 ? ps.manualEmitCount : 0) + count;
    if (!ps.isStarted()) ps.start();

  },
  dust(x, z, strength = 1, y = .02) {

    this.burst('dust', V3(x, y, z), 16 * strength, { c1: c, c2, radius: .22, power: [.3 * strength, 1 * strength] });
  },
  smoke(x, z, strength = 1, y = .1) {
    const c = this.color(this.theme.dust, .22);
    this.burst('smoke', V3(x, y, z), 10 * strength, { c1: c, c2: this.color('#2a2522', .18), radius: .18 });
  },
  sparks(pos, dir, strength = 1, hex) {
    const c = this.color(hex || this.theme.spark, 1), c2 = this.color('#ffffff', .9);
    this.burst('sparks', pos, 26 * strength, { c1: c, c2, dir, spread: .9, radius: .04, power: [1.2 * strength, 3.4 * strength] });
  },
  embers(pos, strength = 1, hex) {
    const c = this.color(hex || this.glowHex(), .9);
    this.burst('embers', pos, 18 * strength, { c1: c, c2: this.color('#ffffff', .6), radius: .2, hemi: false });
  },
  magic(pos, strength = 1, hex, radius = .3) {
    const c = this.color(hex || this.glowHex(), 1);
    this.burst('magic', pos, 26 * strength, { c1: c, c2: this.color('#ffffff', .85), radius, hemi: false });
  },
  glint(pos, hex) {
    this.burst('glints', pos, 2, { c1: this.color(hex || '#ffffff', 1), c2: this.color('#ffffff', 1), radius: .01 });
  },
  activeParticles() {
    let n = 0;
    for (const k in this.pools) for (const ps of this.pools[k].list) { try { n += ps.isGPU ? (performance.now() < (ps._until || 0) ? ps.getCapacity() : 0) : ps.getActiveCount(); } catch (e) { /* ignore */ } }
    return n + this.shardsLive;
  },

  /* ---------- Éclats 3D (SolidParticleSystem, un seul appel de dessin) ---------- */
  shardSet(color) {
    if (this.shardSets[color]) return this.shardSets[color];
    const scene = this.scene;
    const sps = new BABYLON.SolidParticleSystem('shards-' + color, scene, { updatable: true, isPickable: false });
    const shapes = [BABYLON.MeshBuilder.CreatePolyhedron('s0', { type: 0, size: 1 }, scene), BABYLON.MeshBuilder.CreatePolyhedron('s1', { type: 1, size: 1 }, scene), BABYLON.MeshBuilder.CreateBox('s2', { width: 1.2, height: .6, depth: .9 }, scene)];
    shapes.forEach((s, i) => sps.addShape(s, [18, 18, 12][i]));
    shapes.forEach(s => s.dispose());
    const mesh = sps.buildMesh();
    mesh.material = MaterialLibrary.piece[color];
    mesh.isPickable = false; mesh.alwaysSelectAsActiveMesh = true;
    LightingManager.addCaster(mesh);
    sps.computeBoundingBox = false;
    for (const p of sps.particles) { p.isVisible = false; p.on = false; }   // « alive » est réservé par le SPS
    sps.setParticles();
    const set = { sps, mesh, live: 0 };
    sps.updateParticle = p => {
      if (!p.on) { p.isVisible = false; return p; }
      const s = this._dt;
      p.age += s;
      p.velocity.y -= 9.8 * s;
      p.position.addInPlace(p.velocity.scale(s));
      const onBoard = Math.abs(p.position.x) < BOARD.outer && Math.abs(p.position.z) < BOARD.outer;
      const floor = onBoard ? p.r * .5 : -9;
      if (p.position.y < floor) {
        p.position.y = floor;
        if (p.velocity.y < 0) p.velocity.y *= -.3;
        p.velocity.x *= .7; p.velocity.z *= .7; p.spin.scaleInPlace(.7);
      }
      p.rotation.addInPlace(p.spin.scale(s));
      // hors du plateau (aucun sol) ou fin de vie : disparition par réduction
      const fade = !onBoard ? clamp(1 - (p.age - p.offAt) / .35, 0, 1) : clamp((p.life - p.age) / .35, 0, 1);
      if (onBoard) p.offAt = p.age;
      const sc = p.r * fade;
      p.scaling.set(sc, sc, sc);
      if (fade <= 0 || p.age >= p.life) { p.on = false; p.isVisible = false; set.live--; }
      return p;

    return (this.shardSets[color] = set);
  },
  shards(pos, color, dir, strength = 1) {
    if (!GRAPHICS_CONFIG.particles || Tweens.skipping || this.scale <= 0) return;
    const set = this.shardSet(color), n = Math.round(24 * strength * Math.max(.4, this.scale));
    let spawned = 0;
    for (const p of set.sps.particles) {
      if (spawned >= n) break;
      if (p.on) continue;
      p.on = true; p.isVisible = true; spawned++; set.live++;
      p.r = .03 + Math.random() * .06; p.age = 0; p.offAt = 0; p.life = 1.2 + Math.random() * .6;
      const a = Math.random() * Math.PI * 2, rad = Math.random() * .2;
      p.position.set(pos.x + Math.cos(a) * rad, pos.y + Math.random() * .5, pos.z + Math.sin(a) * rad);
      const sp = 1.2 + Math.random() * 2.3 * strength;
      p.velocity = V3(dir.x * sp + Math.cos(a) * (.5 + Math.random()), 1 + Math.random() * 2.8, dir.z * sp + Math.sin(a) * (.5 + Math.random()));
      p.spin = V3((Math.random() - .5) * 18, (Math.random() - .5) * 18, (Math.random() - .5) * 18);
      p.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      p.scaling.set(p.r, p.r, p.r);
    }
    set.mesh.setEnabled(true);
    this.keepAlive(1900);
  },

  /* ---------- Maillages d'effet éphémères ---------- */
  additive(key, tex, hex) {
    const k = key + hex;
    if (this.mats[k]) return this.mats[k];
    const m = new BABYLON.StandardMaterial('fx-' + k, this.scene);
    m.disableLighting = true; m.emissiveColor = C3(hex); m.opacityTexture = tex; m.emissiveTexture = tex;
    m.alphaMode = BABYLON.Constants.ALPHA_ADD; m.disableDepthWrite = true; m.backFaceCulling = false;
    return (this.mats[k] = m);
  },
  quad(name, mat, { billboard = false, ground = false } = {}) {
    const m = ground ? BABYLON.MeshBuilder.CreateGround(name, { width: 1, height: 1 }, this.scene) : BABYLON.MeshBuilder.CreatePlane(name, { size: 1 }, this.scene);
    m.material = mat; m.isPickable = false;
    if (billboard) m.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    m.visibility = 0;
    return m;
  },
  shockwave(x, y, z, hex, { r0 = .3, r1 = 1.6, ms = 520, opacity = .85 } = {}) {
    if (Tweens.skipping) return Promise.resolve();
    const m = this.quad('shock', this.additive('shock', this.tex.shock, hex), { ground: true });
    m.position.set(x, y + .012, z);
    this.keepAlive(ms / Tweens.speed + 50);

      const e = Ease.outCubic(k);
      const s = lerp(r0, r1, e) * 2;
      m.scaling.set(s, 1, s);
      m.visibility = opacity * (1 - k) * (1 - k);
    }).then(() => m.dispose());
  },
  flash(pos, hex, size = 1.2, ms = 180, opacity = 1) {
    if (Tweens.skipping) return;
    const m = this.quad('flash', this.additive('glow', this.tex.glow, hex), { billboard: true });
    m.position.copyFrom(pos);
    if (BabylonRenderer.glow) BabylonRenderer.glow.addIncludedOnlyMesh(m);
    this.keepAlive(ms / Tweens.speed + 50);
    Tweens.add(ms, k => {
      const s = size * (.6 + .6 * Ease.outCubic(k));
      m.scaling.set(s, s, s);
      m.visibility = opacity * (k < .15 ? k / .15 : Math.pow(1 - (k - .15) / .85, 2));
    }).then(() => { if (BabylonRenderer.glow) BabylonRenderer.glow.removeIncludedOnlyMesh(m); m.dispose(); });
    LightingManager.flash(pos, hex, 2.6, ms * 1.4);
  },
  // Arc lumineux de taille (plan orienté selon le geste)
  slashArc(center, yaw, roll, hex, size = 1.1, ms = 260, flat = false) {
    if (Tweens.skipping) return;
    const m = this.quad('slash', this.additive('crescent', this.tex.crescent, hex));
    m.position.copyFrom(center);
    m.rotation.set(flat ? Math.PI / 2 - .22 : 0, yaw, flat ? 0 : roll);     // à plat : l'arc se lit vu du dessus
    this.keepAlive(ms / Tweens.speed + 50);
    Tweens.add(ms, k => {                                                     // arc net (hors couche de lueur)
      const s = size * (.8 + .35 * Ease.outCubic(k));
      m.scaling.set(s, s, s);
      m.visibility = .7 * (k < .12 ? k / .12 : Math.pow(1 - (k - .12) / .88, 1.6));
    }).then(() => m.dispose());
  },
  ribbon(hex, opts) {
    const r = new RibbonTrail(this.scene, C3(hex), opts);
    this.ribbons.push(r);
    View.wake();
    return r;
  },
  // Traînée lumineuse (TrailMesh Babylon) derrière un nœud
  trail(node, hex, { diameter = .05, length = 36, alpha = .55 } = {}) {
    if (Tweens.skipping || Tweens.off || !GRAPHICS_CONFIG.particles || this.scale < .35) return null;
    const t = new BABYLON.TrailMesh('trail', node, this.scene, { diameter, length, sections: 6, autoStart: true });
    const m = new BABYLON.StandardMaterial('trail-mat', this.scene);
    m.disableLighting = true; m.emissiveColor = C3(hex); m.alpha = alpha; m.alphaMode = BABYLON.Constants.ALPHA_ADD; m.disableDepthWrite = true; m.backFaceCulling = false;
    t.material = m; t.isPickable = false;
    if (BabylonRenderer.glow) BabylonRenderer.glow.addIncludedOnlyMesh(t);
    const rec = { t, m, alpha, fading: false, fade: 1 };
    this.trails.push(rec);
    return rec;
  },
  stopTrail(rec) { if (rec) { rec.fading = true; try { rec.t.stop(); } catch (e) { /* ignore */ } } },
  // Colonne de lumière de la promotion
  beam(x, z, hex, ms) {
    const mat = this.additive('beam', this.tex.soft, hex);
    const b = BABYLON.MeshBuilder.CreateCylinder('beam', { diameterTop: .7, diameterBottom: .86, height: 2.6, tessellation: 32, cap: BABYLON.Mesh.NO_CAP }, this.scene);
    b.material = mat; b.position.set(x, 1.3, z); b.isPickable = false; b.visibility = 0;
    const disc = this.quad('beam-disc', this.additive('glow', this.tex.glow, hex), { ground: true });
    disc.position.set(x, .02, z); disc.scaling.set(1.8, 1, 1.8);
    for (const m of [b, disc]) if (BabylonRenderer.glow) BabylonRenderer.glow.addIncludedOnlyMesh(m);
    this.keepAlive(ms / Tweens.speed + 100);
    return { b, disc, set: k => { b.visibility = .45 * Math.sin(Math.PI * k); disc.visibility = Math.sin(Math.PI * k); b.rotation.y = k * 3; },
      dispose: () => { for (const m of [b, disc]) { if (BabylonRenderer.glow) BabylonRenderer.glow.removeIncludedOnlyMesh(m); m.dispose(); } } };
  },

  update(dt) {
    this._dt = dt / 1000 * Tweens.timeScale;
    let live = 0;
    for (const k in this.shardSets) {
      const s = this.shardSets[k];
      if (s.live > 0) { s.sps.setParticles(); live += s.live; }
      else if (s.mesh.isEnabled()) s.mesh.setEnabled(false);
    }
    this.shardsLive = live;
    this.ribbons = this.ribbons.filter(r => r.update(dt));
    this.trails = this.trails.filter(r => {
      if (!r.fading) return true;
      r.fade -= dt / 420;
      r.m.alpha = r.alpha * Math.max(0, r.fade);
      if (r.fade <= 0) { if (BabylonRenderer.glow) BabylonRenderer.glow.removeIncludedOnlyMesh(r.t); r.t.dispose(); r.m.dispose(); return false; }
      return true;
    });
    const now = performance.now();
    for (const k in this.pools) for (const ps of this.pools[k].list) if (ps.isStarted() && ps._until && now > ps._until) { ps.stop(); }
  },
  // Efface les effets résiduels (retour en arrière, nouvelle position)
  clearAll() {
    for (const k in this.pools) for (const ps of this.pools[k].list) { try { ps.reset(); ps.stop(); } catch (e) { /* ignore */ } }
    for (const k in this.shardSets) { const s = this.shardSets[k]; for (const p of s.sps.particles) { p.on = false; p.isVisible = false; } s.live = 0; s.sps.setParticles(); s.mesh.setEnabled(false); }
    for (const r of this.ribbons) r.dispose();
    this.ribbons = [];
    for (const r of this.trails) { if (BabylonRenderer.glow) BabylonRenderer.glow.removeIncludedOnlyMesh(r.t); r.t.dispose(); r.m.dispose(); }
    this.trails = [];
    View.wake();
  },
};


/* =====================================================================
   GAME FEEL — INPUT → ANTICIPATION → ACTION → IMPACT → FX → SON →
   RÉACTION → RECOVERY. Tout est synchronisé sur les mêmes chronologies.
   ===================================================================== */
const Haptics = {
  ok() { return Settings.haptics && typeof navigator.vibrate === 'function'; },
  pulse(p) { if (!this.ok() || Tweens.skipping) return; try { navigator.vibrate(p); } catch (e) { /* ignore */ } },
  select() { this.pulse(8); },
  move() { this.pulse(6); },
  land() { this.pulse(12); },
  capture() { this.pulse([24, 40, 16]); },
  check() { this.pulse([14, 60, 14]); },
  mate() { this.pulse([40, 80, 40, 80, 180]); },
  error() { this.pulse([6, 40, 6]); },
};

const GameFeelManager = {
  // Arrêt sur image bref au moment de l'impact (le temps des animations ralentit)
  hitStop(ms = ANIMATION_CONFIG.capture.hitStopMs, scale = ANIMATION_CONFIG.capture.hitStopScale) {
    if (Tweens.off || Tweens.skipping || REDUCED_MOTION) return;
    Tweens.timeScale = scale;
    clearTimeout(this._hs);
    this._hs = setTimeout(() => { Tweens.timeScale = 1; }, ms);
  },
  // Impact au sol : réaction des pièces voisines, caméra, poussière, vibration
  impact(x, z, { strength = 1, shake = .2, radius = 1.7, haptic = 'land', dust = true, exclude = null } = {}) {
    if (Tweens.skipping) return;
    for (const p of PieceManager.all) {
      if (p === exclude || p.leaving || !p.alive) continue;
      const d = Math.hypot(p.root.position.x - x, p.root.position.z - z);
      if (d > .3 && d < radius) p.impulse(x, z, 1.5 * strength);
    }
    if (shake) CameraController.shake(shake * strength);
    if (haptic) Haptics[haptic]();
    if (dust) EffectsManager.dust(x, z, strength);
  },
};

/* ---------------------------------------------------------------
   Outils de trajectoire
   --------------------------------------------------------------- */
const bez2 = (a, c, b, t) => { const u = 1 - t; return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, z: u * u * a.z + 2 * u * t * c.z + t * t * b.z }; };
const knightCorner = (a, b) => (Math.abs(b.x - a.x) > Math.abs(b.z - a.z) ? { x: b.x, z: a.z } : { x: a.x, z: b.z });
const setXZ = (p, x, z) => { p.root.position.x = x; p.root.position.z = z; };

/* =====================================================================
   PIECE ANIMATION CONTROLLER — un profil par type de pièce.
   move() retourne { done: Promise, contact: ms } : contact = instant où
   l'attaquant atteint sa victime (déclenche la réaction de celle-ci).
   ===================================================================== */
const PawnAnimationProfile = {
  deathStyle: 'topple',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.pawn, dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
    if (o.capture) {                                   // estoc : préparation, fente rapide, contact, retour
      const D = C.anticipation + C.lunge, k0 = C.anticipation / D;
      const done = Tweens.timeline(D, k => {
        let e = 0, y = 0, lean = 0, s = 1;
        if (k < k0) { const q = Ease.outQuad(k / k0); e = -.08 * q; lean = -.2 * q; s = 1 - C.crouch * q; }
        else {
          const q = (k - k0) / (1 - k0), m = Ease.inOutCubic(q);
          e = lerp(-.08, 1, m); y = .14 * Math.sin(Math.PI * m);
          lean = kf(q, [[0, -.2], [.35, .32, Ease.outQuad], [.8, .12], [1, 0]]);
          s = kf(q, [[0, 1 - C.crouch], [.2, 1.08, Ease.outQuad], [.75, 1], [.85, .9], [1, 1]]);
        }
        setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = y; p.lean(dx, dz, lean); p.squash(s);
      }, [{ at: k0, run: () => Sound.play('pawnStab') }]);
      return { done, contact: D * (k0 + (1 - k0) * .7) };
    }
    const hops = dist > 1.5 ? 2 : 1, H = C.perSquare, A = C.anticipation, R = 170, D = A + hops * H + R;
    const cues = [];
    for (let i = 0; i < hops; i++) cues.push({ at: (A + i * H) / D, run: () => Sound.play('pawnHop') });
    cues.push({ at: (A + hops * H) / D, run: () => { Sound.play('pawn'); GameFeelManager.impact(b.x, b.z, { strength: .35, shake: 0, haptic: 'move' }); } });
    const done = Tweens.timeline(D, k => {
      const t = k * D;
      let e, y = 0, s = 1, lean = 0;
      if (t < A) { const q = Ease.outQuad(t / A); e = 0; s = 1 - C.crouch * q; lean = -.05 * q; }
      else if (t < A + hops * H) {
        const tt = t - A, i = Math.min(hops - 1, Math.floor(tt / H)), lt = (tt - i * H) / H;
        e = (i + Ease.inOutSine(lt)) / hops;
        y = C.hop * Math.sin(Math.PI * lt);
        s = kf(lt, [[0, 1 - C.crouch * (i ? .5 : 1)], [.2, 1.07, Ease.outQuad], [.8, 1.02], [1, 1 - C.impactSquash]]);
        lean = C.tilt * Math.sin(Math.PI * lt);
      } else {
        const q = (t - A - hops * H) / R;
        e = 1; y = C.bounce * Math.max(0, Math.sin(Math.PI * Math.min(1, q * 1.6)));
        s = kf(q, [[0, 1 - C.impactSquash], [.35, 1.03, Ease.outQuad], [.7, .99], [1, 1]]);
      }
      setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = y; p.squash(s); p.lean(dx, dz, lean);
    }, cues);
    return { done, contact: D };
  },
};

const KnightAnimationProfile = {
  deathStyle: 'projection',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.knight, dx = b.x - a.x, dz = b.z - a.z;
    const corner = knightCorner(a, b), A = C.anticipation, J = C.jump, R = C.recovery, D = A + J + R;
    const yaw0 = p.orient.rotation.y, yawT = Math.atan2(dx, dz), yawF = PieceManager.facing(p.code);
    const turn = (from, to, t) => from + BABYLON.Scalar.DeltaAngle(from, to) * t;
    const done = Tweens.timeline(D, k => {
      const t = k * D;
      if (t < A) {                                       // se cabre en se tournant vers sa destination
        const q = Ease.outCubic(t / A);
        setXZ(p, a.x, a.z); p.lean(dx, dz, -C.rear * q); p.motion.position.y = .03 * q;
        p.orient.rotation.y = turn(yaw0, yawT, q); if (p.morph) p.morph.rear = q; p.squash(1 - .06 * q);
      } else if (t < A + J) {                            // bond en arc qui suit le L
        const q = (t - A) / J, e = Ease.inOutSine(q), pt = bez2(a, corner, b, e);
        setXZ(p, pt.x, pt.z); p.motion.position.y = .03 + C.jumpHeight * 4 * e * (1 - e);
        p.lean(dx, dz, lerp(-C.rear, .34, Ease.inOutQuad(q))); p.orient.rotation.y = yawT;
        if (p.morph) p.morph.rear = 1 - q * .7;
        p.squash(kf(q, [[0, .94], [.15, 1.08, Ease.outQuad], [.85, 1.02], [1, 1]]));
      } else {                                           // réception, squash, retour à l'orientation de repos
        const q = (t - A - J) / R;
        setXZ(p, b.x, b.z); p.motion.position.y = 0;
        p.lean(dx, dz, .34 * (1 - Ease.outBack(q)));
        p.squash(kf(q, [[0, 1 - C.landSquash], [.4, 1.04, Ease.outQuad], [1, 1]]));
        p.orient.rotation.y = turn(yawT, yawF, Ease.inOutSine(q));
        if (p.morph) p.morph.rear = .3 * (1 - q);
      }
    }, [
      { at: A / D, run: () => Sound.play('knightJump') },
      { at: (A + J) / D, run: () => {
        Sound.play('knightLand');
        EffectsManager.shockwave(b.x, 0, b.z, EffectsManager.glowHex(), { r1: 1.2, ms: 480, opacity: .45 });
        GameFeelManager.impact(b.x, b.z, { strength: .8, shake: .18, exclude: p });
      } },
    ]);
    return { done, contact: (A + J * .86) };
  },
};

const BishopAnimationProfile = {
  deathStyle: 'dissolve',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.bishop, dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
    const G = clamp(320 + dist * C.perSquare, C.min, C.max) * (o.capture ? .78 : 1), A = C.anticipation, R = C.recovery, D = A + G + R;
    const hex = EffectsManager.glowHex();
    let trail = null;
    const done = Tweens.timeline(D, k => {
      const t = k * D;
      let e = 0, y = 0, lean = 0, spin = 0;
      if (t < A) { const q = Ease.outQuad(t / A); y = .03 * q; lean = -.05 * q; }
      else if (t < A + G) {
        const q = (t - A) / G;
        e = o.capture ? Ease.inCubic(q) * .35 + Ease.inOutCubic(q) * .65 : Ease.inOutCubic(q);
        y = .03 + .05 * Math.sin(Math.PI * q); lean = C.tilt * Math.sin(Math.PI * q) * (o.capture ? 1.5 : 1);
        spin = C.spin * Math.sin(Math.PI * q) * .5;
      } else { const q = (t - A - G) / R; e = 1; y = .03 * (1 - Ease.outQuad(q)); lean = -.04 * Math.sin(Math.PI * q); }
      setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = y; p.lean(dx, dz, lean);
      p.orient.rotation.y = PieceManager.facing(p.code) + spin;
    }, [
      { at: A / D, run: () => {
        Sound.play('bishopGlide', { dur: G / Tweens.speed / 1000 });
        trail = EffectsManager.trail(Pieces.fxAnchor(p, .72), hex, { diameter: .03, length: 26, alpha: .3 });
      } },
      { at: (A + G) / D, run: () => { EffectsManager.stopTrail(trail); Sound.play('tock', { f: 520 }); GameFeelManager.impact(b.x, b.z, { strength: .3, shake: 0, haptic: 'move', dust: false }); } },
    ]);
    return { done, contact: A + G * .8 };
  },
};

const RookAnimationProfile = {
  deathStyle: 'crush',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.rook, dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
    const G = clamp(300 + dist * C.perSquare, C.min, C.max), A = C.anticipation, R = C.recovery, D = A + G + R;
    const done = Tweens.timeline(D, k => {
      const t = k * D;
      let e = 0, lean = 0, s = 1, y = 0;
      if (t < A) { const q = Ease.outQuad(t / A); s = 1 - .05 * q; lean = -.045 * q; }       // se tasse : inertie
      else if (t < A + G) {
        const q = (t - A) / G;
        e = o.capture ? Ease.inQuart(q) * .5 + Ease.inQuad(q) * .5 : Ease.inOutQuad(q);   // accélération finale en prise
        lean = C.tilt * Math.sin(Math.PI * Math.min(1, q * 1.1)) * (o.capture ? 1.6 : 1);
        y = .006 * Math.abs(Math.sin(q * 38)) * (1 - q);                                     // léger frottement
        s = 1 - .05 * (1 - Math.min(1, q * 4));
      } else {
        const q = (t - A - G) / R;
        e = 1 + (o.capture ? -.06 * Math.sin(Math.PI * q) : 0);                            // recul après collision
        lean = -.05 * Math.sin(Math.PI * q) * (1 - q);
        s = kf(q, [[0, .93], [.3, 1.02], [1, 1]]);
      }
      setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = y; p.lean(dx, dz, lean); p.squash(s);
    }, [
      { at: A / D, run: () => Sound.play('rookSlide', { dur: G / Tweens.speed / 1000 }) },
      { at: (A + G) / D, run: () => {
        Sound.play('rookThud');
        GameFeelManager.impact(b.x, b.z, { strength: o.capture ? 1.3 : 1, shake: o.capture ? .38 : .24, exclude: p, haptic: 'land' });
      } },
    ]);
    return { done, contact: A + G * .9 };
  },
};

const QueenAnimationProfile = {
  deathStyle: 'burst',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.queen, dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
    const D = clamp(700 + dist * C.perSquare, C.min, C.max) * (o.capture ? .9 : 1);
    const hex = EffectsManager.glowHex();
    const halo = EffectsManager.quad('queen-halo', EffectsManager.additive('glow', EffectsManager.tex.glow, hex), { ground: true });
    let trail = null, last = 0;
    const yawF = PieceManager.facing(p.code);
    const done = Tweens.timeline(D, k => {
      let e, y;
      if (k < .22) { const q = Ease.outCubic(k / .22); e = 0; y = C.rise * q; }                          // légère montée
      else if (k < .78) { const q = Ease.inOutSine((k - .22) / .56); e = o.capture ? Ease.inQuad(q) * .4 + q * .6 : q; y = C.rise + .035 * Math.sin(q * Math.PI * 3); }
      else { const q = Ease.outCubic((k - .78) / .22); e = 1; y = C.rise * (1 - q); }
      setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = y;
      p.lean(dx, dz, .09 * Math.sin(Math.PI * clamp((k - .15) / .7, 0, 1)));
      p.orient.rotation.y = yawF + C.spin * Math.sin(Math.PI * k);                                        // rotation lente
      halo.position.set(p.root.position.x, .012, p.root.position.z);
      const hs = 1.25 + .15 * Math.sin(k * 14); halo.scaling.set(hs, 1, hs);
      halo.visibility = .55 * Math.sin(Math.PI * k);
      if (k - last > .06 && k < .8) { last = k; EffectsManager.magic(p.worldCenter(.75), .12, hex, .28); }  // aura très discrète
    }, [
      { at: 0, run: () => { Sound.play('queenRise'); trail = EffectsManager.trail(Pieces.fxAnchor(p, .86), hex, { diameter: .032, length: 30, alpha: .28 }); } },
      { at: .8, run: () => EffectsManager.stopTrail(trail) },
    ]);
    done.then(() => { halo.dispose(); Sound.play('tock', { f: 440 }); GameFeelManager.impact(b.x, b.z, { strength: .35, shake: 0, haptic: 'move', dust: false }); });
    return { done, contact: D * .7 };
  },
};

const KingAnimationProfile = {
  deathStyle: 'slam',
  move(p, a, b, o) {
    const C = ANIMATION_CONFIG.profiles.king, dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
    const steps = Math.max(3, Math.round(dist * 2.2)), S = C.stepMs, A = C.anticipation, D = A + steps * S + C.recovery;
    let step = -1;
    const done = Tweens.timeline(D, k => {
      const t = k * D;
      if (t < A) { const q = Ease.outQuad(t / A); setXZ(p, a.x, a.z); p.squash(1 - .04 * q); p.lean(dx, dz, -.03 * q); return; }
      if (t < A + steps * S) {                            // pas solennels, balancement, petite inertie
        const tt = t - A, i = Math.min(steps - 1, Math.floor(tt / S)), lt = (tt - i * S) / S;
        const e = (i + Ease.inOutSine(lt)) / steps;
        setXZ(p, a.x + dx * e, a.z + dz * e); p.motion.position.y = C.stepLift * Math.sin(Math.PI * lt);
        p.roll(dx, dz, (i % 2 ? 1 : -1) * C.sway * Math.sin(Math.PI * lt));
        p.squash(1 - .03 * Math.max(0, Math.sin(Math.PI * (lt - .85) / .15)));
        if (i !== step) { step = i; Sound.play('kingStep'); if (i > 0) GameFeelManager.impact(p.root.position.x, p.root.position.z, { strength: .2, shake: .04, haptic: null, dust: false, exclude: p }); }
        return;
      }
      const q = (t - A - steps * S) / C.recovery;
      setXZ(p, b.x, b.z); p.motion.position.y = 0; p.motion.rotationQuaternion.set(0, 0, 0, 1);
      p.squash(kf(q, [[0, .95], [.4, 1.015], [1, 1]]));
    }, [{ at: (A + steps * S) / D, run: () => GameFeelManager.impact(b.x, b.z, { strength: .55, shake: .1, exclude: p }) }]);
    return { done, contact: A + steps * S * .84 };
  },
};

const Pieces = {
  // Ancre d'effet attachée à la pièce (traînées) à une fraction de sa hauteur
  fxAnchor(p, h) {
    const n = new BABYLON.TransformNode('fx-anchor', p.root.getScene());
    n.parent = p.idle; n.position.y = PieceGeo.H(p.type) * h;
    setTimeout(() => n.dispose(), 4000);
    return n;
  },
};

const PieceAnimationController = {
  profiles: {
    [E.PAWN]: PawnAnimationProfile, [E.KNIGHT]: KnightAnimationProfile, [E.BISHOP]: BishopAnimationProfile,
    [E.ROOK]: RookAnimationProfile, [E.QUEEN]: QueenAnimationProfile, [E.KING]: KingAnimationProfile,
  },
  move(p, a, b, o = {}) { return this.profiles[p.type].move(p, a, b, o); },
  // Glisser-déposer : la pièce se pose depuis la hauteur de glisse
  drop(p, b) {
    const x0 = p.root.position.x, z0 = p.root.position.z, y0 = p.lift.cur;
    p.lift.target = 0; p.lift.cur = 0; p.dragTarget = null;
    Sound.play('tock', { f: 480 });
    const done = Tweens.timeline(ANIMATION_CONFIG.drop.ms, k => {
      const e = Ease.outCubic(k);
      setXZ(p, lerp(x0, b.x, e), lerp(z0, b.z, e));
      p.motion.position.y = y0 * (1 - Ease.inQuad(k));
      p.squash(k > .8 ? 1 - .1 * Math.sin(Math.PI * (k - .8) / .2) : 1);
      p.lean(1, 0, 0);
    }, [{ at: .95, run: () => GameFeelManager.impact(b.x, b.z, { strength: .3, shake: 0, haptic: 'move', exclude: p }) }]);
    return { done, contact: 60 };
  },
  // Déplacement refusé : la pièce revient à sa case en petit arc
  returnHome(p, sq) {
    const to = sqToWorld(sq), x0 = p.root.position.x, z0 = p.root.position.z, y0 = p.lift.cur;
    p.dragTarget = null; p.lift.target = 0; p.lift.cur = 0;
    HighlightManager.bright(p, false);
    const A = ANIMATION_CONFIG.returnHome;
    return Tweens.add(A.ms, k => {
      const e = Ease.outCubic(k);
      setXZ(p, lerp(x0, to.x, e), lerp(z0, to.z, e));
      p.motion.position.y = lerp(y0, 0, e) + A.arc * Math.sin(Math.PI * k);
      p.lean(to.x - x0, to.z - z0, -.12 * Math.sin(Math.PI * k));
    }).then(() => { p.setSquare(sq); p.resetPose(); Sound.play('tock', { f: 420, g: .2 }); });
  },
};

/* =====================================================================
   CAPTURE ANIMATION CONTROLLER — la victime n'est jamais simplement
   supprimée : chaque style a sa mort, courte, puis un fondu propre.
   ===================================================================== */
const CaptureAnimationController = {
  // Fondu final (+ retrait des ombres), puis suppression
  async vanish(v, ms = ANIMATION_CONFIG.capture.fadeMs, fx = true) {
    for (const m of v.meshes) LightingManager.removeCaster(m);
    if (fx) EffectsManager.magic(v.worldCenter(.45), .5, EffectsManager.glowHex(), .25);
    await Tweens.add(ms, k => v.setVisibility(1 - Ease.inQuad(k)));
    PieceManager.dispose(v);
  },
  // Pion : impact + chute (la victime bascule, rebondit, puis s'efface)
  async topple(v, dir) {
    Sound.play('topple');
    const x0 = v.root.position.x, z0 = v.root.position.z, R = PieceGeo.R(v.type);
    await Tweens.timeline(620, k => {
      const a = kf(k, [[0, 0], [.12, -.12, Ease.outQuad], [.62, 1.42, Ease.inQuad], [.78, 1.3, Ease.outQuad], [.9, 1.42, Ease.inQuad], [1, 1.4]]);
      v.lean(dir.x, dir.z, a);
      const tip = Math.max(0, a);
      const push = .4 * Ease.outCubic(Math.min(1, k * 1.4));                // repoussée hors de la case de l'attaquant
      setXZ(v, x0 + dir.x * (R * Math.sin(tip) * .8 + push), z0 + dir.z * (R * Math.sin(tip) * .8 + push));
      v.motion.position.y = R * .55 * Math.sin(Math.min(tip, 1.4)) * .6;
    }, [{ at: .62, run: () => { Sound.play('thud', { g: .5 }); EffectsManager.dust(v.root.position.x + dir.x * .4, v.root.position.z + dir.z * .4, .7); } }]);
    await Tweens.delay(140);
    await this.vanish(v, 380);
  },
  // Cavalier : taille + projection (la victime part en tournoyant et se dissout avant de quitter le plateau)
  async projection(v, dir) {
    Sound.play('break');
    const x0 = v.root.position.x, z0 = v.root.position.z, spin = (Math.random() < .5 ? -1 : 1) * Math.PI * 3;
    const yaw0 = v.orient.rotation.y, D = 2.2 + Math.random() * .4;
    for (const m of v.meshes) LightingManager.removeCaster(m);
    let lastFx = 0;
    await Tweens.timeline(720, k => {
      const e = Ease.outCubic(k);
      setXZ(v, x0 + dir.x * D * e, z0 + dir.z * D * e);
      v.motion.position.y = 1.1 * Math.sin(Math.PI * Math.min(1, k * .9)) * (1 - k * .3);
      v.lean(dir.x, dir.z, kf(k, [[0, 0], [.1, .55, Ease.outQuad], [1, 2.6]]));
      v.orient.rotation.y = yaw0 + spin * Ease.outCubic(k);
      v.setVisibility(k < .45 ? 1 : 1 - Ease.inQuad((k - .45) / .55));
      if (k - lastFx > .1) { lastFx = k; EffectsManager.embers(v.worldCenter(.5), .25); }
    });
    EffectsManager.magic(v.worldCenter(.5), .8, EffectsManager.glowHex(), .35);
    PieceManager.dispose(v);
  },
  // Fou : rotation + disparition (la victime tourbillonne et se change en lumière)
  async dissolve(v, dir) {
    Sound.play('slice');
    const yaw0 = v.orient.rotation.y, hex = EffectsManager.glowHex();
    for (const m of v.meshes) LightingManager.removeCaster(m);
    let lastFx = 0;
    const bx = v.root.position.x, bz = v.root.position.z;
    await Tweens.timeline(760, k => {
      setXZ(v, bx + dir.x * .35 * Ease.outCubic(Math.min(1, k * 2)), bz + dir.z * .35 * Ease.outCubic(Math.min(1, k * 2)));
      v.orient.rotation.y = yaw0 + 9 * Ease.inCubic(k);
      v.motion.position.y = .25 * Ease.inOutSine(k);
      const s = 1 - .75 * Ease.inQuad(k);
      v.motion.scaling.set(s, 1 + .2 * k, s);
      v.lean(dir.x, dir.z, .12 * Math.sin(Math.PI * k));
      v.setVisibility(1 - Ease.inQuad(clamp((k - .25) / .75, 0, 1)));
      if (k - lastFx > .08) { lastFx = k; EffectsManager.magic(v.worldCenter(.5), .3, hex, .22); }
    }, [{ at: .1, run: () => EffectsManager.flash(v.worldCenter(.55), hex, 1.1, 200) }]);
    EffectsManager.magic(v.worldCenter(.6), .9, hex, .3);
    PieceManager.dispose(v);
  },
  // Tour : collision lourde + chute (recul, bascule, débris, poussière)
  async crush(v, dir) {
    Sound.play('shatter');
    const x0 = v.root.position.x, z0 = v.root.position.z, R = PieceGeo.R(v.type);
    EffectsManager.shards(v.worldCenter(.35), v.color, dir, .7);
    EffectsManager.smoke(x0, z0, 1);
    await Tweens.timeline(640, k => {
      const push = Ease.outCubic(Math.min(1, k * 1.6)) * .45;
      const a = kf(k, [[0, 0], [.15, .25, Ease.outQuad], [.7, 1.45, Ease.inQuad], [.82, 1.34], [1, 1.42]]);
      setXZ(v, x0 + dir.x * (push + R * Math.sin(a) * .7), z0 + dir.z * (push + R * Math.sin(a) * .7));
      v.lean(dir.x, dir.z, a);
      v.motion.position.y = R * .4 * Math.sin(Math.min(a, 1.4)) * .6;
      v.squash(1 - .08 * Math.sin(Math.PI * Math.min(1, k * 3)));
    }, [{ at: .7, run: () => { Sound.play('thudBig', { g: .6 }); GameFeelManager.impact(v.root.position.x + dir.x * .5, v.root.position.z + dir.z * .5, { strength: .7, shake: .15, exclude: v }); } }]);
    await Tweens.delay(120);
    await this.vanish(v, 420, false);
  },
  // Dame : attaque + explosion élégante de particules
  async burst(v, dir) {
    const hex = EffectsManager.glowHex();
    Sound.play('zap');
    for (const m of v.meshes) LightingManager.removeCaster(m);
    const bx = v.root.position.x, bz = v.root.position.z;
    await Tweens.timeline(240, k => {                                // soulevée et repoussée par l'onde, elle vibre de lumière
      v.motion.position.y = .2 * Ease.outCubic(k);
      setXZ(v, bx + dir.x * .3 * Ease.outCubic(k), bz + dir.z * .3 * Ease.outCubic(k));
      v.orient.rotation.y += .03;
      v.lean(dir.x, dir.z, .18 * Math.sin(Math.PI * k));
      const s = 1 + .08 * Math.sin(k * 40) * k;
      v.motion.scaling.set(s, 1 + .05 * k, s);
    });
    const c = v.worldCenter(.5);
    EffectsManager.flash(c, hex, 1.8, 240);
    EffectsManager.magic(c, 1.6, hex, .35);
    EffectsManager.embers(c, 1.2, BabylonRenderer.theme.pieces[v.color].base);
    EffectsManager.shards(c, v.color, dir, .5);
    EffectsManager.shockwave(c.x, 0, c.z, hex, { r0: .2, r1: 1.8, ms: 560, opacity: .7 });
    Sound.play('magicBurst');
    await Tweens.add(180, k => { v.setVisibility(1 - k); const s = 1 + .5 * k; v.motion.scaling.set(s, s, s); });
    PieceManager.dispose(v);
  },
  // Roi : chute dramatique (écrasée, la victime s'effondre lentement)
  async slam(v, dir) {
    Sound.play('slam');
    const x0 = v.root.position.x, z0 = v.root.position.z, R = PieceGeo.R(v.type);
    await Tweens.timeline(260, k => v.squash(1 - .28 * Ease.outQuad(k)));
    GameFeelManager.impact(x0, z0, { strength: .9, shake: .22, exclude: v, haptic: null });
    await Tweens.timeline(900, k => {
      const a = kf(k, [[0, 0], [.25, .12], [.8, 1.46, Ease.inCubic], [.9, 1.36, Ease.outQuad], [1, 1.44, Ease.inQuad]]);
      v.lean(dir.x, dir.z, a);
      v.squash(lerp(.72, 1, Ease.outQuad(Math.min(1, k * 2))));
      setXZ(v, x0 + dir.x * R * Math.sin(a) * .8, z0 + dir.z * R * Math.sin(a) * .8);
      v.motion.position.y = R * .5 * Math.sin(Math.min(a, 1.4)) * .6;
    }, [{ at: .8, run: () => { Sound.play('thudBig'); EffectsManager.dust(v.root.position.x + dir.x * .5, v.root.position.z + dir.z * .5, 1.2); CameraController.shake(.2); } }]);
    await Tweens.delay(160);
    await this.vanish(v, 420, false);
  },
};

/* =====================================================================
   COMBAT ANIMATION CONTROLLER — système générique :
   attacker, victim, weapon, impactPoint, impactDirection, damageEffect,
   cameraReaction, audio. Chaque pièce peut avoir sa propre attaque.
   ===================================================================== */
const CombatAnimationController = {
  async perform(spec) {
    const run = spec.approach();                                    // déplacement de l'attaquant
    const hit = Tweens.delay(run.contact).then(() => this.impact(spec));
    await Promise.all([run.done, hit]);
  },
  impact(spec) {
    const { victim, impactDirection: dir, damageEffect, cameraReaction = 'punch', audio = {} } = spec;
    const ip = spec.impactPoint || victim.worldCenter(.55);
    if (audio.hit) Sound.play(audio.hit);
    if (!Tweens.skipping) {
      GameFeelManager.hitStop();
      if (cameraReaction === 'punch' || cameraReaction === 'heavy') CameraController.punch(ip, cameraReaction === 'heavy' ? 1.4 : 1);
      CameraController.shake(cameraReaction === 'heavy' ? .42 : .26);
      Haptics.capture();
      BabylonRenderer.dofFocus(ip, .85);
      setTimeout(() => BabylonRenderer.dofFocus(null), 900 / Tweens.speed);
      if (spec.flash !== false) EffectsManager.flash(ip, spec.flashHex || BabylonRenderer.theme.spark, .62, 140, .55);
      if (spec.sparks) EffectsManager.sparks(ip, dir, spec.sparks);
    }
    GameFeelManager.impact(victim.root.position.x, victim.root.position.z, { strength: .5, shake: 0, haptic: null, dust: false, exclude: victim });
    return CaptureAnimationController[damageEffect](victim, dir, spec);
  },
};

/* =====================================================================
   CAVALIER — ATTAQUE À L'ÉPÉE
   1 se redresse · 2 sort l'épée · 3 arme son bras · 4 attaque rapide ·
   5 taille (traînée, lueur, arc lumineux) · 6 impact · 7 la victime est
   projetée · 8 le cavalier se pose · 9 l'épée rentre au fourreau.
   L'épée est une vraie petite épée 3D (lame en acier, garde et pommeau
   en laiton, poignée gainée de cuir), portée par un « bras » invisible.
   ===================================================================== */
class Sword {
  constructor(knight) {
    const scene = knight.root.getScene(), T = KnightSword.template();
    this.pivot = new BABYLON.TransformNode('sword-arm', scene);          // épaule droite du cavalier
    this.pivot.parent = knight.orient;
    this.pivot.position.set(.12, .46, .03);
    this.pivot.rotationQuaternion = BABYLON.Quaternion.Identity();
    this.grow = new BABYLON.TransformNode('sword-grow', scene);
    this.grow.parent = this.pivot;
    this.size = 1.22;                                                  // lisible vu du dessus
    this.meshes = ['blade', 'hilt', 'grip'].map(k => {
      const m = T[k].clone('sword-' + k, this.grow, true);
      m.setEnabled(true); m.isPickable = false;
      return m;
    });
    this.meshes[0].material = MaterialLibrary.steel;
    this.meshes[1].material = MaterialLibrary.brass;
    this.meshes[2].material = MaterialLibrary.leather;
    for (const m of this.meshes) LightingManager.addCaster(m);
    this.pivot.setEnabled(false);
    this.baseLocal = V3(0, .035, 0); this.tipLocal = V3(0, .44, 0);
  }
  show(on) { this.pivot.setEnabled(on); }
  setVisibility(v) { for (const m of this.meshes) m.visibility = v; }
  pose(q) { this.pivot.rotationQuaternion.copyFrom(q); }
  world(local) { this.grow.computeWorldMatrix(true); return BABYLON.Vector3.TransformCoordinates(local, this.grow.getWorldMatrix()); }
  dispose() { for (const m of this.meshes) { LightingManager.removeCaster(m); m.dispose(false, false); } this.grow.dispose(); this.pivot.dispose(); }
}

const KnightSword = {
  tpl: null,
  template() {
    if (this.tpl) return this.tpl;
    const g = PieceGeo.sword(), scene = BabylonRenderer.scene;
    this.tpl = { blade: Geo.toMesh('tpl-blade', g.blade, scene), hilt: Geo.toMesh('tpl-hilt', g.hilt, scene), grip: Geo.toMesh('tpl-grip', g.grip, scene) };
    for (const k in this.tpl) this.tpl[k].setEnabled(false);
    return this.tpl;
  },
  // Orientation de la lame (axe +y du modèle) vers une direction du repère local du cavalier
  dirQ(x, y, z, out) {
    const d = V3(x, y, z).normalize();
    return BABYLON.Quaternion.FromUnitVectorsToRef(BABYLON.Vector3.Up(), d, out || new BABYLON.Quaternion());
  },
  // Taille horizontale : l'azimut balaie de l'arrière droit à l'avant gauche en passant devant le museau
  // (arc large, lisible vu du dessus), l'élévation descend légèrement
  slashQ(t, out) {
    const phi = lerp(2.35, -1.05, t), el = lerp(.38, .02, t);
    return this.dirQ(Math.cos(el) * Math.sin(phi), Math.sin(el), Math.cos(el) * Math.cos(phi), out);
  },
  // Poses du bras (repère local du cavalier : +z museau, +x flanc droit)
  get poses() {
    return this._poses || (this._poses = {
      sheath: this.dirQ(.3, -.8, -.52),     // lame vers le bas et l'arrière, le long du flanc
      guard: this.dirQ(.28, .85, .45),      // tenue haute, pointe vers l'avant
      windup: this.slashQ(0),               // bras armé en arrière, ouvert
      strike: this.slashQ(1),               // fin de la taille, devant le poitrail à gauche
    });
  },
  async attack(K, V, a, b) {
    const S = ANIMATION_CONFIG.sword, P = this.poses, dx = b.x - a.x, dz = b.z - a.z;
    const sword = K.sword || (K.sword = new Sword(K));
    const corner = knightCorner(a, b);
    const T = { rear: S.rear, draw: S.draw, windup: S.windup, leap: S.leap, recover: S.recover, sheathe: S.sheathe };
    const t0 = 0, t1 = t0 + T.rear, t2 = t1 + T.draw * .75, t3 = t2 + T.windup, t4 = t3 + T.leap, t5 = t4 + T.recover, t6 = t5 + T.sheathe * .6;
    const D = t6;
    const slashStart = t3 + T.leap * .6, slashEnd = slashStart + S.slash, impactAt = slashStart + S.slash * .55;
    const yaw0 = K.orient.rotation.y, yawT = Math.atan2(b.x - a.x, b.z - a.z), yawF = PieceManager.facing(K.code);
    const turn = (from, to, t) => from + BABYLON.Scalar.DeltaAngle(from, to) * t;
    const q = BABYLON.Quaternion.Identity();
    const dir = V3(dx, 0, dz).normalize();
    let ribbon = null, hitDone = false;
    const hex = BabylonRenderer.theme.spark;
    sword.show(true); sword.setVisibility(1);
    sword.grow.scaling.set(sword.size, sword.size * .05, sword.size);
    sword.pose(P.sheath);
    const victimDone = { p: null };
    await Tweens.timeline(D, k => {
      const t = k * D;
      // Cavalier : se redresse (cabrage), fait face, puis bondit
      if (t < t3) {
        const r = Ease.outCubic(clamp(t / T.rear, 0, 1));
        setXZ(K, a.x, a.z);
        K.orient.rotation.y = turn(yaw0, yawT, r);
        if (K.morph) K.morph.rear = r;
        const arm = clamp((t - t2) / T.windup, 0, 1);
        K.lean(dx, dz, -.28 * r - .12 * Ease.inOutSine(arm));
        K.motion.position.y = .04 * r + .02 * arm;
        K.squash(1 + .03 * r);
      } else if (t < t4) {
        const u = (t - t3) / T.leap, e = Ease.inOutSine(u), pt = bez2(a, corner, b, e);
        setXZ(K, pt.x, pt.z);
        K.motion.position.y = .06 * (1 - e) + .62 * 4 * e * (1 - e);
        K.lean(dx, dz, lerp(-.4, .38, Ease.inOutQuad(u)));
        K.orient.rotation.y = yawT;
        if (K.morph) K.morph.rear = 1 - u * .6;
        K.squash(kf(u, [[0, .95], [.15, 1.08, Ease.outQuad], [.9, 1.02], [1, 1]]));
      } else {
        const u = clamp((t - t4) / T.recover, 0, 1);
        setXZ(K, b.x, b.z);
        K.motion.position.y = 0;
        K.lean(dx, dz, .38 * (1 - Ease.outBack(u)));
        K.squash(kf(u, [[0, .84], [.45, 1.04, Ease.outQuad], [1, 1]]));
        K.orient.rotation.y = turn(yawT, yawF, Ease.inOutSine(clamp((t - t4) / (D - t4), 0, 1)));
        if (K.morph) K.morph.rear = .4 * (1 - u);
      }
      // Épée : sortie, garde, armé, taille, retour au fourreau
      let len = 1;
      if (t < t1 + T.draw * .1) { sword.pose(P.sheath); len = .05; }
      else if (t < t2) {
        const u = (t - t1 - T.draw * .1) / (t2 - t1 - T.draw * .1);
        len = Ease.outCubic(Math.min(1, u * 1.6));                     // la lame « sort » de la garde
        BABYLON.Quaternion.SlerpToRef(P.sheath, P.guard, Ease.inOutCubic(u), q); sword.pose(q);
      } else if (t < t3) {
        BABYLON.Quaternion.SlerpToRef(P.guard, P.windup, Ease.inOutCubic((t - t2) / T.windup), q); sword.pose(q);
      } else if (t < slashStart) {
        sword.pose(P.windup);
      } else if (t < slashEnd) {
        this.slashQ(Ease.inOutQuad((t - slashStart) / S.slash), q); sword.pose(q);
      } else if (t < t5) {
        BABYLON.Quaternion.SlerpToRef(P.strike, P.guard, Ease.inOutSine(clamp((t - slashEnd) / (t5 - slashEnd), 0, 1)), q); sword.pose(q);
      } else {
        const u = (t - t5) / (t6 - t5);
        BABYLON.Quaternion.SlerpToRef(P.guard, P.sheath, Ease.inOutCubic(u), q); sword.pose(q);
        len = 1 - Ease.inCubic(clamp((u - .35) / .65, 0, 1)) * .95;   // rentre au fourreau
      }
      sword.grow.scaling.set(sword.size, sword.size * Math.max(.05, len), sword.size);
      // Traînée de la lame pendant la taille
      if (ribbon && !ribbon.disposed && t <= slashEnd + 40) ribbon.push(sword.world(V3(0, 0, 0)), sword.world(sword.baseLocal.scale(3.5)), sword.world(sword.tipLocal));
    }, [
      { at: (t1 * .6) / D, run: () => { Sound.play('whoosh', { g: .4 }); } },
      { at: (t1 + T.draw * .1) / D, run: () => { Sound.play('swordDraw'); } },
      { at: t2 / D, run: () => { EffectsManager.glint(sword.world(sword.tipLocal), '#ffffff'); EffectsManager.flash(sword.world(sword.tipLocal.scale(.6)), '#ffffff', .35, 160, .7); } },
      { at: t3 / D, run: () => Sound.play('knightJump') },
      { at: (slashStart - 30) / D, run: () => { if (!Tweens.skipping) ribbon = EffectsManager.ribbon(hex, { length: 24, alpha: .95 }); Sound.play('swordSlash'); } },
      { at: impactAt / D, run: () => {
        if (hitDone) return;
        hitDone = true;
        const ip = V.worldCenter(.55);
        const yaw = Math.atan2(dir.x, dir.z);
        EffectsManager.slashArc(ip.add(dir.scale(-.2)).add(V3(0, .08, 0)), yaw, 0, hex, 1.4, 300, true);
        victimDone.p = CombatAnimationController.impact({ attacker: K, victim: V, weapon: sword, impactPoint: ip, impactDirection: dir, damageEffect: 'projection', cameraReaction: 'heavy', audio: { hit: 'swordHit' }, sparks: 1.3, flashHex: hex });
      } },
      { at: (slashEnd + 40) / D, run: () => { if (ribbon) ribbon.stop(); } },
      { at: t4 / D, run: () => { Sound.play('knightLand'); EffectsManager.shockwave(b.x, 0, b.z, EffectsManager.glowHex(), { r1: 1.1, ms: 460, opacity: .4 }); GameFeelManager.impact(b.x, b.z, { strength: .8, shake: .16, exclude: K }); } },
      { at: (t5 + (t6 - t5) * .35) / D, run: () => { Sound.play('sheath'); EffectsManager.glint(sword.world(V3(0, .02, 0)), BabylonRenderer.theme.glow); } },
    ]);
    if (ribbon) ribbon.stop();
    sword.show(false); sword.grow.scaling.set(sword.size, sword.size, sword.size);
    if (K.morph) K.morph.rear = 0;
    if (!hitDone) { hitDone = true; await CaptureAnimationController.projection(V, dir); }
    else if (victimDone.p) await victimDone.p;
  },
};

/* =====================================================================
   CINÉMATIQUES — promotion, mat
   ===================================================================== */
const CinematicDirector = {
  // Promotion : colonne de lumière, le pion se dissout, la nouvelle pièce se matérialise
  async promote(pawn, sq, newCode) {
    const p = sqToWorld(sq), hex = EffectsManager.glowHex(), ms = ANIMATION_CONFIG.promotion.ms;
    Sound.play('promote');
    Haptics.capture();
    const beam = EffectsManager.beam(p.x, p.z, hex, ms);
    const fresh = PieceManager.create(newCode);
    fresh.setSquare(sq);
    fresh.setVisibility(0); fresh.motion.scaling.set(.01, .01, .01);
    PieceManager.pieces.set(sq, fresh);
    pawn.leaving = true;
    for (const m of pawn.meshes) LightingManager.removeCaster(m);
    let lastFx = 0;
    await Tweens.timeline(ms, k => {
      beam.set(k);
      const g1 = Math.min(1, k / .5);
      pawn.motion.scaling.set(1 - .5 * g1, 1 + .35 * g1, 1 - .5 * g1);
      pawn.orient.rotation.y = k * 6;
      pawn.setVisibility(1 - g1);
      const g2 = clamp((k - .35) / .65, 0, 1);
      const s = Math.max(.01, Ease.outBack(g2));
      fresh.motion.scaling.set(s, s, s);
      fresh.setVisibility(Math.min(1, g2 * 2));
      fresh.orient.rotation.y = PieceManager.facing(newCode) + (1 - Ease.outCubic(g2)) * -4;
      if (k - lastFx > .05) { lastFx = k; EffectsManager.magic(V3(p.x, .1 + k * 1.3, p.z), .25, hex, .4); }
    }, [{ at: .45, run: () => { EffectsManager.flash(V3(p.x, .6, p.z), hex, 1.6, 260); CameraController.shake(.12); } }]);
    beam.dispose();
    PieceManager.dispose(pawn);
    fresh.resetPose();
  },
  // Échec et mat : caméra plus proche, ralenti, chute du roi, particules, lumière, son
  async mate(king) {
    if (!king) return;
    const C = ANIMATION_CONFIG.mate;
    const dir = king.root.position.z < 0 ? { x: .35, z: -1 } : { x: -.35, z: 1 };
    const R = PieceGeo.R(king.type), x0 = king.root.position.x, z0 = king.root.position.z;
    const th = BabylonRenderer.theme;
    king.check = false;
    CameraController.focusOn(king.worldCenter(.4), { amount: .55, zoom: C.focusZoom, speed: 2.4 });
    BabylonRenderer.dofFocus(king.worldCenter(.4), .9);
    LightingManager.setAccent({ pos: king.worldCenter(.9), color: th.hi.check, intensity: 2.2, pulse: .25 });
    await Tweens.timeline(700, k => {                               // vacille
      king.lean(dir.x, dir.z, .09 * Math.sin(k * Math.PI * 3) * (1 - k * .3));
    });
    Tweens.timeScale = C.slowMo;                                     // ralenti
    let hit = false;
    await Tweens.timeline(C.fall, k => {
      const a = (Math.PI / 2 - .07) * (k < .8 ? Ease.inQuad(k / .8) : 1 - .06 * Math.sin(Math.PI * (k - .8) / .2));
      king.lean(dir.x, dir.z, a);
      setXZ(king, x0 + dir.x * R * (1 - Math.cos(a)) * .5, z0 + dir.z * R * (1 - Math.cos(a)) * .5);
      king.motion.position.y = R * Math.sin(a) * .62;
      if (k >= .8 && !hit) {
        hit = true;
        Tweens.timeScale = 1;
        const px = king.root.position.x + dir.x * .5, pz = king.root.position.z + dir.z * .5;
        CameraController.shake(.5);
        EffectsManager.dust(px, pz, 1.6);
        EffectsManager.embers(V3(px, .2, pz), 1.2, th.hi.check);
        EffectsManager.shockwave(px, 0, pz, th.hi.check, { r1: 2.2, ms: 700, opacity: .6 });
        LightingManager.flash(V3(px, .5, pz), th.hi.check, 7, 500);
        GameFeelManager.impact(px, pz, { strength: 1.2, shake: 0, exclude: king, haptic: null });
        Haptics.mate();
        Sound.play('thudBig');
      }
    });
    Tweens.timeScale = 1;
    LightingManager.setAccent({ intensity: 0, pulse: 0 });
    await Tweens.delay(650);
    CameraController.release(1.6);                                   // retour au cadrage plein écran
    BabylonRenderer.dofFocus(null);
  },
};

/* =====================================================================
   CHEF D'ORCHESTRE D'UN COUP — l'état du moteur de règles est déjà à
   jour ; le rendu ne fait que l'illustrer, puis se resynchronise.
   ===================================================================== */
const MoveDirector = {
  async playMove(m, pos, { dropped = false, captured } = {}) {
    const P = PieceManager.pieces;
    const type = m.piece & E.TYPE;
    const mover = P.get(m.from);
    const capSq = m.flags & E.F_EP ? m.to + (m.piece & E.COLOR ? 16 : -16) : m.to;
    const victim = (m.flags & E.F_CAPTURE) ? P.get(capSq) : null;
    const castle = m.flags & (E.F_KCASTLE | E.F_QCASTLE);
    HighlightManager.setSelectedGlow(-1);
    P.delete(m.from);
    if (victim) { P.delete(capSq); victim.leaving = true; HighlightManager.forgetPiece(victim); }
    let rook = null, rf = -1, rt = -1;
    if (castle) {
      rf = m.flags & E.F_KCASTLE ? m.to + 1 : m.to - 2;
      rt = m.flags & E.F_KCASTLE ? m.to - 1 : m.to + 1;
      rook = P.get(rf);
      P.delete(rf);
      if (rook) { P.set(rt, rook); rook.sq = rt; }
    }
    if (mover) { P.set(m.to, mover); mover.sq = m.to; mover.dragTarget = null; HighlightManager.bright(mover, false); }

    if (Tweens.off || !mover) {                                   // animations désactivées
      if (victim) PieceManager.dispose(victim);
      Sound.play(victim ? 'capture' : castle ? 'castle' : 'tock', { f: 520 });
      PieceManager.sync(pos);
      if (captured) UI.setCaptured(captured);
      return;
    }
    const a = sqToWorld(m.from), b = sqToWorld(m.to);
    if (!dropped) mover.lift.target = 0;
    const jobs = [];
    const useSword = victim && type === E.KNIGHT && !dropped && GRAPHICS_CONFIG.weaponAnimations;
    if (useSword) {
      jobs.push(KnightSword.attack(mover, victim, a, b));
    } else {
      const approach = () => (dropped ? PieceAnimationController.drop(mover, b) : PieceAnimationController.move(mover, a, b, { capture: !!victim, castle }));
      if (victim) {
        const vp = sqToWorld(capSq), dir = V3(vp.x - a.x, 0, vp.z - a.z).normalize();
        const prof = PieceAnimationController.profiles[type];
        jobs.push(CombatAnimationController.perform({
          attacker: mover, victim, weapon: null, approach,
          impactPoint: victim.worldCenter(.5), impactDirection: dir,
          damageEffect: prof.deathStyle,
          cameraReaction: type === E.ROOK || type === E.KING ? 'heavy' : 'punch',
          audio: { hit: type === E.ROOK ? null : 'hit' },
          sparks: type === E.BISHOP || type === E.QUEEN ? 0 : .8,
          flashHex: type === E.BISHOP || type === E.QUEEN ? EffectsManager.glowHex() : BabylonRenderer.theme.spark,
        }));
      } else jobs.push(approach().done);
    }
    if (castle && rook) {
      Sound.play('castle');
      const ra = sqToWorld(rf), rb = sqToWorld(rt), C = ANIMATION_CONFIG.castle;
      jobs.push(Tweens.delay(dropped ? 0 : C.rookDelay).then(() => Tweens.timeline(dropped ? 300 : C.rookMs, k => {
        const e = Ease.inOutSine(k);
        setXZ(rook, lerp(ra.x, rb.x, e), ra.z);
        rook.motion.position.y = C.rookArc * Math.sin(Math.PI * k);          // la tour passe au-dessus du roi
        rook.lean(rb.x - ra.x, 0, .25 * Math.sin(Math.PI * k));
        rook.squash(k > .9 ? 1 - .1 * Math.sin(Math.PI * (k - .9) / .1) : 1);
      })).then(() => { rook.resetPose(); rook.setSquare(rt); Sound.play('rookThud'); GameFeelManager.impact(rb.x, rb.z, { strength: .8, shake: .2, exclude: rook }); }));
    }
    await Promise.all(jobs);
    if (!mover.alive) return;
    mover.resetPose();
    mover.setSquare(m.to);
    if (m.promo) await CinematicDirector.promote(mover, m.to, m.promo);
    PieceManager.sync(pos);
    if (captured) UI.setCaptured(captured);
  },
};


/* =====================================================================
   FAÇADES — API stable utilisée par le contrôleur de partie et le coach.
   (View = rendu, Fx = chorégraphies) : la logique métier ne connaît ni
   Babylon.js ni les détails du rendu.
   ===================================================================== */
const View = {
  get pieces() { return PieceManager.pieces; },
  get canvas() { return BabylonRenderer.canvas; },
  get theme() { return BabylonRenderer.theme; },
  wake() { BabylonRenderer.wake(); },
  resize() { Layout.update(); BabylonRenderer.resize(); },
  sync(pos, pop = false) { PieceManager.sync(pos, pop); },
  syncTrays(captured) { UI.setCaptured(captured); },
  setHighlights(o) { HighlightManager.setHighlights(o); },
  setHover(sq) { HighlightManager.setHover(sq); },
  setArrows(list) { HighlightManager.setArrows(list); },
  putAt(piece, sq) { if (piece) { piece.setSquare(sq); piece.resetPose(); } },
  applyTheme(name) { return BabylonRenderer.applyTheme(name); },
  refreshFacing() { PieceManager.refreshFacing(); },
  setTurn(c) { BoardBuilder.setTurn(c); },
  doShake(amp = .05) { CameraController.shake(amp * 4); },
  // Picking : pièce touchée (le plus précis), sinon case sous le doigt
  pick(ev, ignore = null) {
    const r = this.canvas.getBoundingClientRect();
    const hit = BabylonRenderer.scene.pick(ev.clientX - r.left, ev.clientY - r.top, m => {
      const p = m.metadata && m.metadata.piece;
      return !!p && p !== ignore && !p.leaving && p.alive && m.isEnabled();
    }, false, CameraController.cam);
    if (hit && hit.hit) {
      const p = hit.pickedMesh.metadata.piece;
      if (p.sq >= 0 && PieceManager.pieces.get(p.sq) === p) return p.sq;
    }
    return this.squareAtPoint(this.planeHit(ev, 0));
  },
  planeHit(ev, y = 0) {
    const ray = BabylonRenderer.ray(ev.clientX, ev.clientY);
    if (Math.abs(ray.direction.y) < 1e-6) return null;
    const t = (y - ray.origin.y) / ray.direction.y;
    return t < 0 ? null : { x: ray.origin.x + ray.direction.x * t, z: ray.origin.z + ray.direction.z * t };
  },
  squareAtPoint(p) {
    if (!p) return -1;
    const f = Math.floor(p.x + 4), r = Math.floor(p.z + 4);
    return f >= 0 && f < 8 && r >= 0 && r < 8 ? r * 16 + f : -1;
  },
};

const Fx = {
  playMove(m, pos, opts) { return MoveDirector.playMove(m, pos, opts); },
  topple(king) { return CinematicDirector.mate(king); },
  clearAll() { EffectsManager.clearAll(); HighlightManager.setCheck(-1); },
};

/* =====================================================================
   TOUCH CONTROLLER — un doigt : sélection / glisser-déposer ;
   deux doigts : zoom, rotation et inclinaison de la caméra (bornés,
   retour automatique). Souris : survol, clic droit + glisser, molette.
   ===================================================================== */
const TouchController = {
  pts: new Map(),
  gesture: null,
  init(canvas) {
    this.canvas = canvas;
    canvas.addEventListener('pointerdown', e => this.down(e));
    canvas.addEventListener('pointermove', e => this.move(e));
    canvas.addEventListener('pointerup', e => this.up(e));
    canvas.addEventListener('pointercancel', e => this.cancel(e));
    canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !Game.drag) View.setHover(-1); });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); CameraController.userZoom(e.deltaY > 0 ? 1.05 : 1 / 1.05); CameraController.userEnd(); }, { passive: false });
    canvas.addEventListener('dblclick', e => { if (View.pick(e) < 0) CameraController.resetView(); });
  },
  snapshot() {
    const [a, b] = [...this.pts.values()];
    return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x), my: (a.y + b.y) / 2 };
  },
  down(e) {
    this.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (e.pointerType === 'mouse' && e.button === 2) {
      this.gesture = { mouse: true, x: e.clientX, y: e.clientY };
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      return;
    }
    if (this.pts.size === 2) {                         // second doigt : on passe en geste caméra
      Game.cancelDrag();
      this.gesture = this.snapshot();
      return;
    }
    if (this.pts.size === 1 && !this.gesture) Game.onDown(e);
  },
  move(e) {
    const pt = this.pts.get(e.pointerId);
    if (pt) { pt.x = e.clientX; pt.y = e.clientY; }
    const g = this.gesture;
    if (g && g.mouse) {
      CameraController.userRotate((e.clientX - g.x) * -.004, (e.clientY - g.y) * -.004);
      g.x = e.clientX; g.y = e.clientY;
      return;
    }
    if (g && this.pts.size >= 2) {
      const s = this.snapshot();
      if (s.d > 0 && g.d > 0) CameraController.userZoom(g.d / s.d);
      let da = s.ang - g.ang;
      if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
      CameraController.userRotate(-da, (s.my - g.my) * -.004);
      this.gesture = s;
      return;
    }
    if (!g) Game.onMove(e);
  },
  up(e) {
    this.pts.delete(e.pointerId);
    if (this.gesture) {
      if (this.pts.size === 0) { this.gesture = null; CameraController.userEnd(); }
      return;
    }
    Game.onUp(e);
  },
  cancel(e) {
    this.pts.delete(e.pointerId);
    if (this.gesture && this.pts.size === 0) { this.gesture = null; CameraController.userEnd(); }
    Game.cancelDrag();
  },
};

/* =====================================================================
   AUDIO MANAGER — tous les sons sont synthétisés (Web Audio API, aucun
   fichier). Chaque lecture varie légèrement (hauteur, volume) pour éviter
   la répétition exacte ; les sons sont déclenchés par les repères des
   chronologies d'animation (synchronisation image par image).
   ===================================================================== */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -14; this.comp.ratio.value = 4;
      this.master = this.ctx.createGain();
      this.master.connect(this.comp).connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.applyVolume();
    return this.ctx;
  },
  applyVolume() { if (this.master) this.master.gain.value = Settings.sound ? Math.pow(Settings.volume, 1.5) : 0; },
  unlock() { this.ensure(); },
  pitch: 1, gainV: 1,
  play(name, opts = {}) {
    if (!Settings.sound || !this.defs[name] || Tweens.skipping) return;
    const ctx = this.ensure();
    if (!ctx || ctx.state !== 'running') return;
    this.pitch = opts.exact ? 1 : 1 + (Math.random() - .5) * .07;
    this.gainV = opts.exact ? 1 : 1 + (Math.random() - .5) * .16;
    try { this.defs[name].call(this, ctx.currentTime + .005, opts); } catch (e) { /* son ignoré */ }
    this.pitch = 1; this.gainV = 1;
  },

  tone(t, { type = 'sine', f0, f1, dur = .2, gain = .3, attack = .004 }) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0 * this.pitch, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * this.pitch), t + dur);
    gain *= this.gainV;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + .05);
  },
  noise(t, { dur = .1, gain = .3, type = 'bandpass', f = 1000, f1, q = 1, attack = .002 }) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    fl.type = type; fl.frequency.setValueAtTime(f * this.pitch, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1 * this.pitch, t + dur);
    gain *= this.gainV;
    fl.Q.value = q;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(this.master);
    s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  tock(t, f = 520, g = .45) {
    this.tone(t, { f0: f, f1: f * .55, dur: .09, gain: g });
    this.noise(t, { f: f * 3, q: 2, dur: .035, gain: g * .5 });
  },

  defs: {
    tock(t, o) { this.tock(t, o.f || 520, o.g || .45); },
    pawnHop(t) { this.tock(t, 760, .18); },
    pawn(t) { this.tock(t, 620, .38); },
    pawnStab(t) { this.noise(t, { type: 'highpass', f: 2500, f1: 6000, dur: .1, gain: .22 }); this.tock(t + .08, 820, .3); },
    knightJump(t) { this.noise(t, { f: 400, f1: 1600, q: 1.5, dur: .32, gain: .22, attack: .08 }); },
    knightLand(t) { this.tone(t, { f0: 150, f1: 55, dur: .28, gain: .55 }); this.noise(t, { type: 'lowpass', f: 500, dur: .12, gain: .35 }); },
    bishopGlide(t, o) {
      const d = clamp(o.dur || .6, .3, 1.2);
      this.tone(t, { f0: 1320, f1: 1760, dur: d, gain: .05, attack: d * .4 });
      this.tone(t, { f0: 1980, f1: 2640, dur: d * .9, gain: .025, attack: d * .4 });
      this.noise(t, { type: 'highpass', f: 5000, dur: d, gain: .04, attack: d * .3 });
    },
    rookSlide(t, o) { const d = clamp(o.dur || .6, .3, 1.2); this.noise(t, { type: 'lowpass', f: 260, f1: 520, dur: d, gain: .22, attack: .08 }); },
    rookThud(t) { this.tone(t, { f0: 95, f1: 42, dur: .38, gain: .75 }); this.noise(t, { type: 'lowpass', f: 260, dur: .2, gain: .45 }); },
    queenRise(t) { [523.25, 659.25, 783.99].forEach((f, i) => this.tone(t + i * .04, { type: 'triangle', f0: f, dur: .95, gain: .07, attack: .2 })); },
    kingStep(t) { this.tone(t, { f0: 190, f1: 120, dur: .13, gain: .32 }); this.noise(t, { type: 'lowpass', f: 700, dur: .05, gain: .18 }); },
    capture(t) { this.noise(t, { f: 1800, q: 1.2, dur: .09, gain: .5 }); this.tock(t, 360, .5); },
    topple(t) { this.tock(t, 300, .35); this.tock(t + .22, 240, .3); },
    whack(t) { this.noise(t, { f: 900, q: 1, dur: .12, gain: .7 }); this.tone(t, { f0: 230, f1: 110, dur: .16, gain: .5 }); },
    slice(t) { this.noise(t, { type: 'highpass', f: 6500, f1: 1800, dur: .2, gain: .4 }); this.tone(t + .02, { f0: 2400, f1: 1700, dur: .45, gain: .07 }); },
    shatter(t) {
      for (let i = 0; i < 12; i++) this.noise(t + Math.random() * .28, { f: 1800 + Math.random() * 5000, q: 4, dur: .05 + Math.random() * .06, gain: .25 });
      this.tone(t, { f0: 90, f1: 40, dur: .35, gain: .6 });
    },
    zap(t) { this.tone(t, { type: 'sawtooth', f0: 1300, f1: 90, dur: .45, gain: .1 }); this.tone(t, { f0: 70, f1: 40, dur: .45, gain: .45 }); },
    slam(t) { this.tone(t, { f0: 75, f1: 32, dur: .55, gain: .85 }); this.noise(t, { type: 'lowpass', f: 180, dur: .3, gain: .55 }); },
    castle(t) { this.tock(t, 500, .35); this.tock(t + .2, 420, .35); },
    check(t) { this.tone(t, { f0: 660, dur: .13, gain: .22 }); this.tone(t + .13, { f0: 880, dur: .2, gain: .22 }); },
    mate(t) {
      [659.25, 523.25, 440, 329.63].forEach((f, i) => this.tone(t + i * .22, { type: 'triangle', f0: f, dur: .55, gain: .14, attack: .02 }));
      this.tone(t + .9, { f0: 65, f1: 35, dur: 1, gain: .5 });
    },
    promote(t) {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(t + i * .075, { f0: f, dur: .4, gain: .1 }));
      this.noise(t + .3, { type: 'highpass', f: 6000, dur: .5, gain: .05, attack: .1 });
    },
    thudBig(t) { this.tone(t, { f0: 110, f1: 45, dur: .5, gain: .6 }); this.noise(t, { type: 'lowpass', f: 320, dur: .25, gain: .4 }); },
    draw(t) { [392, 493.88, 587.33].forEach(f => this.tone(t, { type: 'triangle', f0: f, dur: 1, gain: .07, attack: .05 })); },
    start(t) { [392, 523.25, 659.25].forEach((f, i) => this.tone(t + i * .06, { type: 'triangle', f0: f, dur: .7, gain: .07, attack: .03 })); },
    tick(t) { this.tone(t, { type: 'square', f0: 1500, dur: .03, gain: .05 }); },
    flag(t) { this.tone(t, { type: 'square', f0: 440, dur: .3, gain: .12 }); this.tone(t + .32, { type: 'square', f0: 330, dur: .45, gain: .12 }); },
    click(t) { this.tone(t, { f0: 1200, dur: .03, gain: .06 }); },
    thud(t, o) { const g = o.g || 1; this.tone(t, { f0: 125, f1: 55, dur: .26, gain: .5 * g }); this.noise(t, { type: 'lowpass', f: 420, dur: .12, gain: .3 * g }); },
    hit(t) { this.noise(t, { f: 950, q: 1, dur: .1, gain: .55 }); this.tone(t, { f0: 210, f1: 90, dur: .15, gain: .45 }); },
    whoosh(t, o) { const g = o.g || 1; this.noise(t, { f: 320, f1: 1500, q: 1.2, dur: .3, gain: .2 * g, attack: .1 }); },
    // Épée du cavalier : sortie du fourreau (glissement métallique qui sonne), taille, impact, retour
    swordDraw(t) {
      this.noise(t, { type: 'highpass', f: 2800, f1: 7200, dur: .34, gain: .1, attack: .06 });
      this.tone(t + .12, { f0: 2640, f1: 2700, dur: .7, gain: .03, attack: .01 });
      this.tone(t + .12, { f0: 3960, dur: .5, gain: .016, attack: .01 });
      this.noise(t, { f: 500, f1: 1300, q: 1.4, dur: .28, gain: .08, attack: .08 });
    },
    swordSlash(t) {
      this.noise(t, { f: 700, f1: 3800, q: 1.6, dur: .17, gain: .38, attack: .03 });
      this.noise(t + .02, { type: 'highpass', f: 5200, dur: .12, gain: .08, attack: .02 });
    },
    swordHit(t) {
      [1210, 2330, 3570, 4810].forEach((f, i) => this.tone(t, { type: 'sine', f0: f, dur: .42 - i * .07, gain: .08 - i * .012, attack: .002 }));
      this.noise(t, { f: 2600, q: 1.5, dur: .05, gain: .42 });
      this.tone(t, { f0: 150, f1: 60, dur: .2, gain: .45 });
    },
    sheath(t) {
      this.noise(t, { type: 'highpass', f: 4200, f1: 2400, dur: .3, gain: .07, attack: .08 });
      this.tock(t + .3, 1700, .16);
    },
    break(t) {
      for (let i = 0; i < 7; i++) this.noise(t + Math.random() * .16, { f: 700 + Math.random() * 2600, q: 3, dur: .04 + Math.random() * .05, gain: .22 });
      this.tone(t, { f0: 160, f1: 70, dur: .22, gain: .35 });
    },
    magicBurst(t) {
      [1318.5, 1568, 2093, 2637].forEach((f, i) => this.tone(t + i * .035, { type: 'triangle', f0: f, dur: .5, gain: .045, attack: .01 }));
      this.noise(t, { type: 'highpass', f: 6500, dur: .45, gain: .06, attack: .03 });
    },
  },
};

const PROMO_NAMES = { [E.QUEEN]: 'Dame', [E.ROOK]: 'Tour', [E.BISHOP]: 'Fou', [E.KNIGHT]: 'Cavalier' };
const GLYPHS = { w: { [E.QUEEN]: '♕', [E.ROOK]: '♖', [E.BISHOP]: '♗', [E.KNIGHT]: '♘' }, b: { [E.QUEEN]: '♛', [E.ROOK]: '♜', [E.BISHOP]: '♝', [E.KNIGHT]: '♞' } };
const CLOCK_PRESETS = { none: null, blitz: { base: 3, inc: 2 }, rapid: { base: 10, inc: 5 } };
